function App() {
  // 1a's home is the feed. It landed on New dub while the feed was still a
  // placeholder; now that it renders real activity it takes the front door.
  const [view, setView] = useState('feed');
  const [system, setSystem] = useState(null);
  const [voicePresets, setVoicePresets] = useState([]);
  const [jobs, setJobs] = useState([]);
  const [sphereOn, setSphereOn] = useState(true);
  const [publishPending, setPublishPending] = useState([]);
  const [selectedResultJobId, setSelectedResultJobId] = useState(null);
  const [selectedReviewJobId, setSelectedReviewJobId] = useState(null);
  const [jobsTab, setJobsTab] = useState('all');
  const [libTab, setLibTab] = useState('results');
  // What ⌘K last parsed, handed to HomeView to pre-fill the form.
  const [pendingCommand, setPendingCommand] = useState(null);
  const narrow = useIsNarrow();

  // "logs at failure →" on any job error panel: jump to System → Logs.
  // The tab and the window filter follow the same event (SystemView, LogsTab).
  useEffect(() => {
    const h = () => { _lsSet('system_tab', 'logs'); setView('system'); };
    window.addEventListener('gcd:open-logs', h);
    return () => window.removeEventListener('gcd:open-logs', h);
  }, []);
  const [navOpen, setNavOpen] = useState(false);

  // Rotating a phone into landscape can cross the breakpoint while the drawer
  // is open; leaving it open would then overlay a layout that has its own rail.
  useEffect(() => { if (!narrow) setNavOpen(false); }, [narrow]);

  // System polling
  useEffect(() => {
    const refresh = () => fetch('/api/system').then(r => r.json()).then(setSystem).catch(() => {});
    refresh();
    const t = setInterval(refresh, 5000);
    return () => clearInterval(t);
  }, []);

  // Voice presets
  useEffect(() => {
    fetch('/api/voices').then(r => r.json()).then(d => setVoicePresets(d.presets || [])).catch(() => {});
  }, [view]);

  // Jobs polling. The publish inbox rides the same cadence — staged uploads
  // only change when a human or the uploader acts, so it needs no faster loop.
  // A 404 (backend without publish routes) just leaves the inbox empty.
  useEffect(() => {
    let stopped = false;
    const fetchJobs = async () => {
      try {
        const r = await fetch('/api/jobs');
        const d = await r.json();
        if (!stopped) setJobs(d.jobs || []);
      } catch (_) {}
      try {
        const r = await fetch('/api/publish/pending');
        if (r.ok) {
          const d = await r.json();
          if (!stopped) setPublishPending(d.pending || []);
        }
      } catch (_) {}
    };
    fetchJobs();
    const interval = jobs.some(j => ACTIVE_STATUSES.has(j.status)) ? 2000 : 10000;
    const t = setInterval(fetchJobs, interval);
    return () => { stopped = true; clearInterval(t); };
  }, [jobs.some(j => ACTIVE_STATUSES.has(j.status))]);

  const runningJob = jobs.find(j => ACTIVE_STATUSES.has(j.status));
  const awaitingReviewCount = jobs.filter(j => j.status === 'awaiting_translation_review').length;

  const onJobSubmitted = (jobId) => {
    setJobsTab('live');
    setView('jobs');
    fetch('/api/jobs').then(r => r.json()).then(d => setJobs(d.jobs || [])).catch(() => {});
  };

  const refreshJobs = () => fetch('/api/jobs').then(r => r.json()).then(d => setJobs(d.jobs || []));
  const jumpResult = (id) => { setSelectedResultJobId(id); setLibTab('results'); setView('library'); };

  const refreshSystem = () =>
    fetch('/api/system').then(r => r.json()).then(setSystem).catch(() => {});

  // Every "Details" affordance lands on the same place: System → Setup.
  const openSetup = () => { _lsSet('system_tab', 'setup'); setView('system'); };

  return (
    <div style={{ width: '100%', height: '100%', display: 'flex', background: 'var(--bg)',
                  overflow: 'hidden' }}>
      {/* Tapping outside the drawer closes it — expected on touch, and the
          only way out when the rail covers most of the screen. */}
      {narrow && navOpen && <div className="scrim" onClick={() => setNavOpen(false)}/>}

      <LeftRail
        view={view} setView={setView}
        runningJob={runningJob}
        awaitingReviewCount={awaitingReviewCount}
        system={system}
        publishPendingCount={publishPending.length}
        narrow={narrow} open={navOpen} onClose={() => setNavOpen(false)}
      />

      {/* minWidth:0 is load-bearing: a flex child defaults to min-width:auto,
          so any wide content (a URL, a table) refuses to shrink and pushes the
          page sideways instead of wrapping. */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column',
                    minWidth: 0, overflowX: 'hidden' }}>
        <TopBar
          view={view}
          runningJob={runningJob}
          awaitingReviewCount={awaitingReviewCount}
          notices={system?.notices}
          mode={system?.mode || 'local'}
          onJumpToProcessing={() => { setJobsTab('live'); setView('jobs'); }}
          onJumpToReview={() => { setJobsTab('review'); setView('jobs'); }}
          onOpenSetup={openSetup}
          onCommand={(text) => {
            const parsed = parseCommand(text);
            if (parsed) setPendingCommand(parsed);
            setView('home');
          }}
          narrow={narrow} onOpenNav={() => setNavOpen(true)}
        />

        {/* Above every view: a setup problem is worth interrupting whatever
            the user came here to do, because it will otherwise show up as a
            bad dub they can't explain. */}
        <SetupBanner notices={system?.notices} onOpenSetup={openSetup}/>

        {view === 'home' && (
          <HomeView
            system={system}
            voicePresets={voicePresets}
            sphereOn={sphereOn}
            onJobSubmitted={onJobSubmitted}
            command={pendingCommand}
            onCommandConsumed={() => setPendingCommand(null)}
          />
        )}

        {view === 'jobs' && (
          <JobsView
            tab={jobsTab} setTab={setJobsTab}
            jobs={jobs} system={system} voicePresets={voicePresets}
            publishPending={publishPending}
            runningJob={runningJob} awaitingReviewCount={awaitingReviewCount}
            sphereOn={sphereOn}
            selectedReviewJobId={selectedReviewJobId}
            onPickReviewJob={setSelectedReviewJobId}
            onReviewContinued={() => setSelectedReviewJobId(null)}
            onReviewCancel={() => setSelectedReviewJobId(null)}
            onJumpResult={jumpResult}
            onJumpHome={() => setView('home')}
            onRefresh={refreshJobs}
          />
        )}

        {view === 'library' && (
          <LibraryView
            tab={libTab} setTab={setLibTab}
            jobs={jobs} system={system} voicePresets={voicePresets}
            selectedResultJobId={selectedResultJobId}
            onPickResultJob={setSelectedResultJobId}
            onJumpHome={() => setView('home')}
            onJumpJobs={() => { setJobsTab('all'); setView('jobs'); }}
            onRefresh={refreshJobs}
          />
        )}

        {view === 'discover' && (
          <DiscoverView
            onJumpResult={jumpResult}
            onJumpProcessing={() => { setJobsTab('live'); setView('jobs'); }}
          />
        )}

        {view === 'feed' && (
          <AgentFeedView
            jobs={jobs}
            system={system}
            narrow={narrow}
            onOpenJob={(job) => {
              // A finished dub opens on its result; a live one on the running
              // job. Both go through the wrappers' own tab targeting.
              if (ACTIVE_STATUSES.has(job.status)) {
                setJobsTab('live'); setView('jobs'); return;
              }
              jumpResult(job.id);
            }}
            onSwitchToHome={() => setView('home')}
          />
        )}
        {view === 'apikeys' && <ApiKeysView mode={system?.mode || 'local'}/>}
        {view === 'mcp' && <McpServerView mode={system?.mode || 'local'}/>}
        {view === 'webhooks' && <WebhooksView/>}
        {view === 'members' && <MembersView/>}
        {view === 'billing' && <BillingView/>}
        {view === 'audit' && <AuditView/>}

        {view === 'system' && (
          <SystemView system={system} onRefreshSystem={refreshSystem}/>
        )}
      </div>

      {/* A floating pill over a phone screen covers whatever is at the bottom
          of the page — here it sat on top of the last stage row and the URL
          input. It is a decorative toggle plus a hint about keyboard
          shortcuts, neither of which applies on touch. */}
      {!narrow && (
        <div style={{
          position: 'fixed', bottom: 12, right: 16,
          padding: '6px 10px',
          background: 'var(--bg-2)', border: '1px solid var(--line)',
          borderRadius: 999,
          display: 'flex', alignItems: 'center', gap: 10,
          fontSize: 10, fontFamily: 'var(--mono)',
          color: 'var(--ink-4)', zIndex: 10,
        }}>
          <label style={{ display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
            <input type="checkbox" checked={sphereOn} onChange={e => setSphereOn(e.target.checked)} style={{ accentColor: 'var(--accent)' }}/>
            sphere
          </label>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
