function CopyButton({ text, label = 'Copy' }) {
  const [done, setDone] = useState(false);
  const copy = async () => {
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
    } catch (_) {
      // clipboard API needs a secure context; on plain http:// over a LAN
      // it throws, so fall back to the old selection trick.
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
    }
    setDone(true);
    setTimeout(() => setDone(false), 1400);
  };
  return (
    <button className="btn btn-ghost" onClick={copy} disabled={!text}
            style={{ fontSize: 10, padding: '3px 8px',
                     color: done ? 'var(--accent)' : 'var(--ink-3)' }}>
      {done ? '✓ copied' : label}
    </button>
  );
}

function MetaField({ label, value, mono, minHeight }) {
  if (!value) return null;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <div className="caps">{label}</div>
        <div style={{ flex: 1 }}/>
        <CopyButton text={value}/>
      </div>
      <div className={'wrap-any' + (mono ? ' mono' : '')}
           style={{ padding: '8px 10px', background: 'var(--bg-2)',
                    border: '1px solid var(--line)', borderRadius: 'var(--r-md)',
                    fontSize: 12, lineHeight: 1.5, whiteSpace: 'pre-wrap',
                    maxHeight: 260, overflowY: 'auto', minHeight: minHeight || 0 }}>
        {value}
      </div>
    </div>
  );
}

function MetadataPanel({ jobId, defaultOpen = false }) {
  const [open, setOpen] = useState(defaultOpen);
  const [data, setData] = useState(null);
  const [err, setErr] = useState('');
  const [side, setSide] = useState('translated');

  useEffect(() => {
    if (!open || data) return;
    fetch(`/api/dub/${jobId}/metadata`)
      .then(r => r.json())
      .then(d => { if (d.error) setErr(d.error); else setData(d); })
      .catch(e => setErr(String(e.message || e)));
  }, [open, jobId]);

  // Chapters are "0:00 Title" lines — the format YouTube parses back into
  // real chapter marks when pasted into a description.
  const fmtChapters = (chs) => (chs || []).map(c => {
    const t = Math.max(0, Math.round(c.start || 0));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
    const stamp = h > 0
      ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`
      : `${m}:${String(sec).padStart(2, '0')}`;
    return `${stamp} ${c.title}`;
  }).join('\n');

  const hasTranslation = !!(data && data.translated);
  const shown = side === 'translated' && hasTranslation ? data.translated : data?.source;
  const chapterText = fmtChapters(shown?.chapters);
  // What you'd actually paste into the description box: body then chapters.
  const fullBlock = [shown?.description, chapterText].filter(Boolean).join('\n\n');

  return (
    <div className="panel" style={{ width: '100%', padding: 0, overflow: 'hidden' }}>
      <button onClick={() => setOpen(!open)} style={{
        width: '100%', display: 'flex', alignItems: 'center', gap: 10,
        padding: '12px 16px', textAlign: 'left',
      }}>
        <span style={{ color: 'var(--ink-3)' }}>{I.glossary}</span>
        <span style={{ fontSize: 13, fontWeight: 500 }}>Video metadata</span>
        <span className="mono" style={{ fontSize: 10, color: 'var(--ink-4)' }}>
          title · description · chapters
        </span>
        <div style={{ flex: 1 }}/>
        <span style={{ color: 'var(--ink-3)', fontSize: 11 }}>{open ? '▾' : '▸'}</span>
      </button>

      {open && (
        <div style={{ padding: '0 16px 16px', display: 'flex',
                      flexDirection: 'column', gap: 14 }}>
          {err && <div style={{ color: 'var(--err)', fontSize: 11.5 }}>{err}</div>}
          {!data && !err && (
            <div className="mono" style={{ fontSize: 11, color: 'var(--ink-3)' }}>Loading…</div>
          )}
          {data && !data.source.title && !data.source.description && (
            <div style={{ fontSize: 11.5, color: 'var(--ink-3)' }}>
              No metadata for this source — it was a local file, or the yt-dlp
              probe could not reach the page.
            </div>
          )}
          {data && (data.source.title || data.source.description) && (
            <>
              <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                {['translated', 'source'].map(sd => (
                  <button key={sd} onClick={() => setSide(sd)}
                          disabled={sd === 'translated' && !hasTranslation}
                          className={'btn' + (side === sd ? ' btn-primary' : '')}
                          style={{ fontSize: 11, padding: '4px 10px' }}>
                    {sd === 'translated'
                      ? (data.target_lang ? data.target_lang.toUpperCase() : 'Translated')
                      : 'Original'}
                  </button>
                ))}
                <div style={{ flex: 1 }}/>
                {fullBlock && (
                  <CopyButton text={fullBlock} label="Copy description + chapters"/>
                )}
              </div>

              {!hasTranslation && (
                <div style={{ fontSize: 11, color: 'var(--ink-3)' }}>
                  No translation stored — same-language dub, or the source had
                  no title to translate.
                </div>
              )}

              <MetaField label="Title" value={shown?.title}/>
              <MetaField label="Description" value={shown?.description} minHeight={80}/>
              <MetaField label="Chapters" value={chapterText} mono/>
              {side === 'source' && (
                <>
                  <MetaField label="Thumbnail URL" value={data.source.thumbnail} mono/>
                  <MetaField label="Source URL" value={data.source.webpage_url} mono/>
                </>
              )}
            </>
          )}
        </div>
      )}
    </div>
  );
}

function ResultView({ jobs, selectedJobId, voicePresets, system, onRefresh, onPickJob, onSwitchToHome, onSwitchToHistory }) {
  const completedJobs = jobs.filter(j => j.status === 'complete').sort((a, b) => (b.completed_at || b.created || 0) - (a.completed_at || a.created || 0));
  const job = selectedJobId ? jobs.find(j => j.id === selectedJobId) : completedJobs[0];
  
  if (!job) {
    return (
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 16, padding: 'var(--pad)', background: 'var(--bg)' }}>
        <div className="caps">No completed jobs yet</div>
        <div className="serif" style={{ fontSize: 'clamp(20px, 5.5vw, 32px)', letterSpacing: '-0.015em', textAlign: 'center', maxWidth: 480 }}>
          Nothing to <span style={{ fontStyle: 'italic', color: 'var(--ink-3)' }}>show off</span> yet.
        </div>
        <button onClick={onSwitchToHome} className="btn btn-primary">Start your first dub</button>
      </div>
    );
  }
  return (
    <div className="scroll" style={{ flex: 1, padding: 'var(--pad)', background: 'var(--bg)' }}>
      <div style={{ maxWidth: 900, margin: '0 auto', display: 'flex', flexDirection: 'column',
                    alignItems: 'center', gap: 20 }}>
        <div className="serif" style={{ fontSize: 24 }}>{job.title || job.source_label || job.id}</div>
        <video src={`/outputs/${job.id}/dubbed_video.mp4`} controls
               style={{ maxWidth: '100%', maxHeight: '55vh' }}/>
        <div style={{ display: 'flex', gap: 10 }}>
          <a className="btn btn-primary" href={`/outputs/${job.id}/dubbed_video.mp4`} download>Download MP4</a>
          <button className="btn" onClick={onSwitchToHistory}>Back to History</button>
        </div>
        {/* Quality first (should you publish this?), then publish, then the
            stage controls that fix whatever quality flagged. */}
        {job.status === 'complete' && (
          <QualityPanel jobId={job.id} defaultOpen={false}/>
        )}
        {job.status === 'complete' && (
          <MetadataPanel jobId={job.id} defaultOpen={false}/>
        )}
        {job.status === 'complete' && (
          <PublishPanel jobId={job.id} defaultOpen={true}/>
        )}
        {/* Stages stay available after completion: this is where you re-run
            just the translation with a better model, or re-synthesize a
            voice, without paying for transcription again. */}
        <StagePanel jobId={job.id} system={system} voicePresets={voicePresets}
                    onChanged={onRefresh} defaultOpen={false}/>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// HISTORY VIEW (placeholder)
// ═══════════════════════════════════════════════════════════════════
function HistoryView({ jobs, system, voicePresets, publishPending = [],
                       onJumpProcessing, onJumpReview, onJumpResult, onRefresh }) {
  // Which job's stage breakdown is expanded. Errored jobs are the main
  // reason to open this — the panel says which stage died and offers a
  // retry from exactly there.
  const [openId, setOpenId] = useState(null);
  // Publish inbox: filter the list down to jobs waiting for approval.
  const [publishOnly, setPublishOnly] = useState(false);
  const pendingIds = useMemo(() => new Set(publishPending.map(p => p.job_id)), [publishPending]);
  const shown = publishOnly ? jobs.filter(j => pendingIds.has(j.id)) : jobs;

  // ── Selection & delete ──────────────────────────────────────────
  // `visible` is computed once and reused by both the render and the
  // shift-range maths, so a row's index always means the same thing in
  // both places.
  const visible = shown.slice(0, 20);
  const [selected, setSelected] = useState(() => new Set());
  const [anchor, setAnchor] = useState(null);   // index of the last plain click
  const [confirming, setConfirming] = useState(false);
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState('');

  // Jobs still writing to their own output directory can't be deleted —
  // the server refuses, and saying so up front beats a per-row error after.
  const LIVE = ['running', 'processing', 'queued', 'downloading'];
  const isLive = (j) => LIVE.includes(j.status);

  const selectedList = visible.filter(j => selected.has(j.id));
  const liveSelected = selectedList.filter(isLive).length;

  // Drop ids that have scrolled out of view or been deleted elsewhere, so
  // the counter never claims more than the list can act on.
  useEffect(() => {
    setSelected(prev => {
      const ids = new Set(visible.map(j => j.id));
      const next = new Set([...prev].filter(id => ids.has(id)));
      return next.size === prev.size ? prev : next;
    });
  }, [jobs, publishOnly]);

  const toggle = (idx, id, shiftKey) => {
    const extending = shiftKey && anchor !== null;
    // The anchor only moves on a plain click, and it is set here rather than
    // inside the setSelected updater — React may run an updater more than
    // once, and a state setter is not a safe thing to do in one.
    if (!extending) setAnchor(idx);
    setSelected(prev => {
      const next = new Set(prev);
      if (extending) {
        // Shift extends from the anchor and applies the value the clicked row
        // is about to take, which is how file managers behave — a range drag
        // can deselect as well as select.
        const [lo, hi] = anchor < idx ? [anchor, idx] : [idx, anchor];
        const turningOn = !prev.has(id);
        for (let i = lo; i <= hi; i++) {
          if (!visible[i]) continue;
          if (turningOn) next.add(visible[i].id); else next.delete(visible[i].id);
        }
      } else if (next.has(id)) {
        next.delete(id);
      } else {
        next.add(id);
      }
      return next;
    });
    setConfirming(false);
  };

  const allSelected = visible.length > 0 && selected.size === visible.length;
  const selectAll = () => {
    setSelected(allSelected ? new Set() : new Set(visible.map(j => j.id)));
    setAnchor(null); setConfirming(false);
  };

  const doDelete = async () => {
    setBusy(true); setNote('');
    try {
      const fd = new FormData();
      fd.append('job_ids', [...selected].join(','));
      const r = await fetch('/api/jobs/bulk_delete', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.error) { setNote(d.error); return; }
      const parts = [`Deleted ${d.deleted.length} job${d.deleted.length === 1 ? '' : 's'}`];
      if (d.freed_mb) parts.push(`freed ${d.freed_mb} MB`);
      if (d.skipped?.length) parts.push(`${d.skipped.length} skipped (${d.skipped[0].reason})`);
      setNote(parts.join(' · '));
      setSelected(new Set()); setAnchor(null);
      onRefresh && onRefresh();
    } catch (e) {
      setNote(String(e.message || e));
    } finally {
      setBusy(false); setConfirming(false);
    }
  };
  return (
    <div className="scroll" style={{ flex: 1, padding: 'var(--pad)', background: 'var(--bg)' }}>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 14, marginBottom: 20, flexWrap: 'wrap' }}>
        <div className="serif" style={{ fontSize: 'clamp(22px, 6vw, 32px)' }}>History · {jobs.length} jobs</div>
        {publishPending.length > 0 && (
          <button className="chip" onClick={() => setPublishOnly(o => !o)} style={{
            color: 'var(--warn)', cursor: 'pointer',
            borderColor: 'oklch(0.78 0.15 60 / 0.3)',
            background: publishOnly ? 'oklch(0.78 0.15 60 / 0.15)' : 'oklch(0.78 0.15 60 / 0.06)',
          }}>
            {publishPending.length} awaiting publish approval {publishOnly ? '· show all' : ''}
          </button>
        )}
      </div>
      {publishOnly && shown.length === 0 && (
        <div style={{ color: 'var(--ink-3)', fontSize: 12, marginBottom: 12 }}>
          Pending publishes exist but their jobs are not in the visible list.
        </div>
      )}
      {/* Selection toolbar. Always present so "Select all" is discoverable
          without first hunting for a checkbox. */}
      {visible.length > 0 && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 10,
                      flexWrap: 'wrap', fontSize: 12 }}>
          <label style={{ display: 'flex', alignItems: 'center', gap: 7, cursor: 'pointer',
                          color: 'var(--ink-2)' }}>
            <input type="checkbox" checked={allSelected} onChange={selectAll}
                   style={{ accentColor: 'var(--accent)', width: 14, height: 14, cursor: 'pointer' }}/>
            {allSelected ? 'Clear selection' : `Select all ${visible.length} shown`}
          </label>
          {selected.size > 0 && (
            <>
              <span className="mono" style={{ color: 'var(--ink-3)', fontSize: 11 }}>
                {selected.size} selected
              </span>
              {!confirming ? (
                <button className="btn" onClick={() => setConfirming(true)} disabled={busy}
                        style={{ color: 'var(--err)', borderColor: 'oklch(0.7 0.2 25 / 0.35)' }}>
                  Delete {selected.size}
                </button>
              ) : (
                <>
                  <span style={{ color: 'var(--err)' }}>
                    Delete {selected.size} job{selected.size === 1 ? '' : 's'} and their files? This cannot be undone.
                  </span>
                  <button className="btn" onClick={doDelete} disabled={busy}
                          style={{ background: 'oklch(0.7 0.2 25 / 0.15)', color: 'var(--err)',
                                   borderColor: 'oklch(0.7 0.2 25 / 0.35)' }}>
                    {busy ? 'Deleting…' : 'Yes, delete'}
                  </button>
                  <button className="btn btn-ghost" onClick={() => setConfirming(false)} disabled={busy}>
                    Cancel
                  </button>
                </>
              )}
              {liveSelected > 0 && (
                <span style={{ color: 'var(--warn)', fontSize: 11 }}>
                  {liveSelected} still running — {liveSelected === 1 ? 'it' : 'they'} will be skipped
                </span>
              )}
            </>
          )}
          <div style={{ flex: 1 }}/>
          <span className="mono" style={{ fontSize: 10.5, color: 'var(--ink-4)' }}>
            shift-click a checkbox to select a range
          </span>
        </div>
      )}
      {note && (
        <div style={{ padding: '8px 11px', borderRadius: 'var(--r-md)', marginBottom: 10,
                      background: 'var(--accent-dim)', border: '1px solid var(--line-2)',
                      fontSize: 11.5 }}>{note}</div>
      )}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {visible.map((j, idx) => (
          <div key={j.id} style={{
            background: selected.has(j.id) ? 'var(--bg-2)' : 'var(--bg-1)',
            border: '1px solid ' + (selected.has(j.id) ? 'var(--accent-dim)' : 'var(--line)'),
            borderRadius: 6,
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 16, padding: 10 }}>
              <input type="checkbox" checked={selected.has(j.id)}
                     onClick={e => toggle(idx, j.id, e.shiftKey)}
                     onChange={() => {}}
                     aria-label={`Select ${j.title || j.id}`}
                     style={{ accentColor: 'var(--accent)', width: 14, height: 14,
                              flexShrink: 0, cursor: 'pointer' }}/>
              <StatusBadge status={j.status}/>
              <div style={{ flex: 1 }}>{j.title || j.source_label || j.source || j.id}</div>
              {pendingIds.has(j.id) && (
                <span className="chip" style={{ fontSize: 10, color: 'var(--warn)',
                                                borderColor: 'oklch(0.78 0.15 60 / 0.3)' }}>
                  publish pending
                </span>
              )}
              {j.failed_stage && (
                <span className="mono" style={{ fontSize: 10.5, color: 'var(--err)' }}>
                  failed at {j.failed_stage}
                </span>
              )}
              <div className="mono" style={{ fontSize: 11, color: 'var(--ink-3)' }}>{j.target_lang}</div>
              <button className="btn btn-ghost" style={{ padding: '4px 9px', fontSize: 11.5 }}
                      onClick={() => setOpenId(openId === j.id ? null : j.id)}>
                {openId === j.id ? 'Hide stages' : 'Stages'}
              </button>
              {j.status === 'complete' && <button className="btn" onClick={() => onJumpResult(j.id)}>View</button>}
              {/* Selects just this row and opens the shared confirm, so there
                  is one delete path rather than two that can disagree. */}
              <button className="btn btn-ghost" title="Delete this job and its files"
                      disabled={busy || isLive(j)}
                      onClick={() => { setSelected(new Set([j.id])); setAnchor(idx); setConfirming(true); }}
                      style={{ padding: '4px 8px', fontSize: 11.5, color: 'var(--ink-3)' }}>
                Delete
              </button>
            </div>
            {openId === j.id && (
              <div style={{ padding: '0 10px 10px', display: 'flex', flexDirection: 'column', gap: 8 }}>
                {(j.status === 'error' || j.status === 'interrupted') && (
                  <JobErrorPanel job={j} compact/>
                )}
                {j.status === 'complete' && <QualityPanel jobId={j.id}/>}
                {j.status === 'complete' && (
                  <PublishPanel jobId={j.id} defaultOpen={pendingIds.has(j.id)}/>
                )}
                <StagePanel jobId={j.id} system={system} voicePresets={voicePresets}
                            onChanged={onRefresh}/>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// SYSTEM VIEW (placeholder)
// ═══════════════════════════════════════════════════════════════════
// Subsystem pass/fail list. `ok:false` at severity "warn" is amber, not red —
// no diarization is a real loss but still produces a watchable dub, and
// colouring it like a missing ffmpeg would flatten the distinction.
function CheckList({ checks }) {
  if (!checks?.length) return (
    <div className="mono" style={{ fontSize: 11, color: 'var(--ink-4)', marginTop: 8 }}>
      No checks reported.
    </div>
  );
  return (
    <div style={{ marginTop: 10, display: 'flex', flexDirection: 'column', gap: 5 }}>
      {checks.map(c => {
        const color = c.ok ? 'var(--accent)'
                    : (c.severity === 'warn' ? 'var(--warn)' : 'var(--err)');
        return (
          <div key={c.id} style={{ display: 'flex', alignItems: 'baseline', gap: 8, fontSize: 11.5 }}>
            <span style={{ color, width: 12, flexShrink: 0 }}>{c.ok ? '✓' : '✕'}</span>
            <span style={{ color: 'var(--ink)', minWidth: 150 }}>{c.label}</span>
            <span className="mono" style={{ fontSize: 10, color: 'var(--ink-3)',
                                            overflow: 'hidden', textOverflow: 'ellipsis',
                                            whiteSpace: 'nowrap' }}>
              {c.detail || c.hint || ''}
            </span>
          </div>
        );
      })}
    </div>
  );
}

function SetupTab({ system, onRefreshSystem }) {
  const [running, setRunning] = useState(false);
  const [deep, setDeep] = useState(null);
  const [err, setErr] = useState('');
  const [token, setToken] = useState('');
  const [savedToken, setSavedToken] = useState('');

  useEffect(() => {
    fetch('/api/config').then(r => r.json())
      .then(d => setSavedToken(d.hf_token || ''))
      .catch(() => {});
  }, []);

  // The only network probe in the app. Explicit button, never automatic: a
  // local-first tool shouldn't phone home on launch, and it has to work offline.
  const runChecks = async () => {
    setRunning(true); setErr('');
    try {
      const fd = new FormData();
      const r = await fetch('/api/diagnostics/run', { method: 'POST', body: fd });
      const d = await r.json();
      if (!d.ok) setErr(d.error || 'Check failed');
      else { setDeep(d); _undismissAll(); onRefreshSystem && onRefreshSystem(); }
    } catch (e) { setErr(String(e.message || e)); }
    finally { setRunning(false); }
  };

  const saveToken = async () => {
    setErr('');
    try {
      const fd = new FormData();
      fd.append('body', JSON.stringify({ hf_token: token.trim() }));
      const r = await fetch('/api/config', { method: 'PATCH', body: fd });
      const d = await r.json();
      if (d.error) { setErr(d.error); return; }
      setSavedToken(d.config?.hf_token || '');
      setToken('');
      await runChecks();
    } catch (e) { setErr(String(e.message || e)); }
  };

  const notices = deep?.notices || system?.notices || [];
  const checks = deep?.checks || system?.checks || [];
  const ranAt = deep?.ran_at || system?.diagnostics_ran_at;

  return (
    <div style={{ maxWidth: 860 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
        <button className="btn btn-primary" onClick={runChecks} disabled={running}>
          {running ? 'Checking…' : 'Run checks'}
        </button>
        <span className="mono" style={{ fontSize: 10, color: 'var(--ink-4)' }}>
          Contacts huggingface.co and your translation backend
          {ranAt ? ` · last run ${fmtAge(ranAt)}` : ' · never run'}
        </span>
        <div style={{ flex: 1 }}/>
        <button className="btn btn-ghost" onClick={() => { _undismissAll(); onRefreshSystem && onRefreshSystem(); }}>
          Un-dismiss all
        </button>
      </div>

      {err && (
        <div style={{ padding: '9px 12px', borderRadius: 6, marginBottom: 14,
                      background: 'oklch(0.7 0.2 25 / 0.1)', border: '1px solid oklch(0.7 0.2 25 / 0.25)',
                      color: 'var(--err)', fontSize: 11.5 }}>{err}</div>
      )}

      {notices.length === 0 ? (
        <div style={{ padding: '14px 16px', borderRadius: 8, marginBottom: 18,
                      background: 'var(--accent-dim)', border: '1px solid var(--line-2)',
                      fontSize: 12.5, color: 'var(--ink)' }}>
          ✓ Nothing needs attention.
        </div>
      ) : notices.map(n => <NoticeCard key={n.code} n={n}/>)}

      <div style={{ padding: 16, background: 'var(--bg-1)', border: '1px solid var(--line)',
                    borderRadius: 8, marginTop: 18 }}>
        <div className="caps">Hugging Face token</div>
        <div className="mono" style={{ fontSize: 10.5, color: 'var(--ink-3)', marginTop: 6, lineHeight: 1.6 }}>
          Needed for speaker diarization. Read-scope is enough. Stored in
          config-user.json and never sent back to this page in full.
        </div>
        <div style={{ display: 'flex', gap: 8, marginTop: 10, alignItems: 'center' }}>
          <input className="field" type="password" placeholder={savedToken ? `saved: ${savedToken}` : 'hf_…'}
                 value={token} onChange={e => setToken(e.target.value)}
                 style={{ flex: 1, maxWidth: 340 }}/>
          <button className="btn" onClick={saveToken} disabled={!token.trim()}>Save &amp; check</button>
          <a href="https://hf.co/settings/tokens" target="_blank" rel="noreferrer"
             className="chip" style={{ textDecoration: 'none', color: 'var(--ink-2)' }}>
            Get a token ↗
          </a>
        </div>
      </div>

      <div style={{ padding: 16, background: 'var(--bg-1)', border: '1px solid var(--line)',
                    borderRadius: 8, marginTop: 14 }}>
        <div className="caps">Subsystems</div>
        <CheckList checks={checks}/>
      </div>
    </div>
  );
}

function LogsTab() {
  const [entries, setEntries] = useState([]);
  const [level, setLevel] = useState(_lsGet('log_level', ''));
  const [live, setLive] = useState(true);
  const [meta, setMeta] = useState({});
  const boxRef = useRef(null);
  // A failure window set by JobErrorPanel's "logs at failure →": show only
  // the ring entries the failed stage produced, frozen (no live tail).
  const readFocus = () => {
    try { return JSON.parse(localStorage.getItem('log_focus') || 'null'); }
    catch (_) { return null; }
  };
  const [focus, setFocus] = useState(readFocus);
  useEffect(() => {
    const h = () => setFocus(readFocus());
    window.addEventListener('gcd:open-logs', h);
    return () => window.removeEventListener('gcd:open-logs', h);
  }, []);
  const clearFocus = () => {
    try { localStorage.removeItem('log_focus'); } catch (_) {}
    setFocus(null);
  };

  const load = useCallback(async () => {
    try {
      // Focused: pull deep and unfiltered, then cut to the seq window — the
      // failed stage's lines may be any level, and may sit far back.
      const url = focus
        ? '/api/logs?limit=2000'
        : `/api/logs?limit=500&level=${encodeURIComponent(level)}`;
      const r = await fetch(url);
      const d = await r.json();
      let es = d.entries || [];
      if (focus) es = es.filter(e => e.seq >= (focus.from || 0) && e.seq <= focus.to);
      setEntries(es);
      setMeta({ dropped: d.dropped, capacity: d.capacity });
    } catch (_) {}
  }, [level, focus]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    if (!live || focus) return;
    const t = setInterval(load, 3000);
    return () => clearInterval(t);
  }, [live, load, focus]);
  useEffect(() => {
    if (live && boxRef.current) boxRef.current.scrollTop = boxRef.current.scrollHeight;
  }, [entries, live]);

  const levelColor = (lv) => lv === 'ERROR' || lv === 'CRITICAL' ? 'var(--err)'
                           : lv === 'WARNING' ? 'var(--warn)'
                           : lv === 'DEBUG' ? 'var(--ink-4)' : 'var(--ink-3)';

  return (
    <div style={{ maxWidth: 1100 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12, flexWrap: 'wrap' }}>
        {['', 'INFO', 'WARNING', 'ERROR'].map(lv => (
          <button key={lv || 'all'} className={'tab' + (level === lv ? ' active' : '')}
                  onClick={() => { setLevel(lv); _lsSet('log_level', lv); }}>
            {lv ? lv.toLowerCase() : 'all'}
          </button>
        ))}
        <div style={{ flex: 1 }}/>
        <label className="mono" style={{ fontSize: 10.5, color: 'var(--ink-2)', display: 'flex',
                                         alignItems: 'center', gap: 6, cursor: 'pointer' }}>
          <input type="checkbox" checked={live} onChange={e => setLive(e.target.checked)}/> live
        </label>
        <button className="btn btn-ghost" onClick={load}>{I.refresh} Refresh</button>
        <button className="btn btn-ghost" onClick={() => {
          const text = entries.map(e => `${fmtClock(e.ts)} ${e.level} ${e.logger} ${e.message}`).join('\n');
          navigator.clipboard?.writeText(text);
        }}>{I.copy} Copy</button>
      </div>

      {focus && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap',
                      padding: '8px 11px', borderRadius: 6, marginBottom: 10, fontSize: 11.5,
                      background: 'oklch(0.7 0.2 25 / 0.08)',
                      border: '1px solid oklch(0.7 0.2 25 / 0.28)', color: 'var(--err)' }}>
          <span>
            Failure window{focus.stage ? ` — ${String(focus.stage).toLowerCase()}` : ''}
            {focus.job ? ` · job ${focus.job}` : ''}
          </span>
          {entries.length === 0 && (
            <span className="mono" style={{ fontSize: 10.5, color: 'var(--ink-3)' }}>
              these lines have been evicted from the ring — only recent output is kept
            </span>
          )}
          <div style={{ flex: 1 }}/>
          <button className="btn btn-ghost" style={{ padding: '3px 9px', fontSize: 11 }}
                  onClick={clearFocus}>Show all logs</button>
        </div>
      )}

      <div ref={boxRef} className="scroll" style={{
        height: 'calc(100vh - 260px)', overflow: 'auto', padding: 12,
        background: 'var(--bg-1)', border: '1px solid var(--line)', borderRadius: 8,
      }}>
        {entries.length === 0 ? (
          <div className="mono" style={{ fontSize: 11, color: 'var(--ink-4)' }}>No log lines yet.</div>
        ) : entries.map(e => (
          <div key={e.seq} className="mono" style={{
            fontSize: 10.5, lineHeight: 1.55, display: 'flex', gap: 8,
            padding: '1px 0', whiteSpace: 'pre-wrap', wordBreak: 'break-word',
          }}>
            <span style={{ color: 'var(--ink-4)', flexShrink: 0 }}>{fmtClock(e.ts)}</span>
            <span style={{ color: levelColor(e.level), flexShrink: 0, width: 54 }}>{e.level}</span>
            <span style={{ color: 'var(--ink-4)', flexShrink: 0, width: 118, overflow: 'hidden',
                           textOverflow: 'ellipsis' }}>{e.logger.replace(/^gochidubb\./, '')}</span>
            <span style={{ color: 'var(--ink-2)', flex: 1 }}>{e.message}</span>
          </div>
        ))}
      </div>
      <div className="mono" style={{ fontSize: 9.5, color: 'var(--ink-4)', marginTop: 6 }}>
        in-memory ring · {entries.length} shown · capacity {meta.capacity ?? '—'}
        {meta.dropped ? ` · ${meta.dropped} older lines evicted` : ''}
        {' · third-party stdout/stderr included · secrets redacted'}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// VOICE & TTS SETTINGS — the only editor for VoxCPM's knobs. Everything
// here maps 1:1 onto UserConfig fields; the server validates the same
// bounds shown in the hints (app/config.py FIELD_SPECS), so the UI never
// has to be the only thing standing between a typo and the model.
// ═══════════════════════════════════════════════════════════════════
function NumberKnob({ label, hint, value, onChange, min, max, step, disabled, sentinel }) {
  const atSentinel = sentinel !== undefined && Number(value) === sentinel;
  return (
    <Field label={label} hint={hint}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <input type="range" min={min} max={max} step={step} disabled={disabled}
               value={atSentinel ? min : value}
               onChange={e => onChange(Number(e.target.value))}
               style={{ flex: 1, accentColor: 'var(--accent)', minWidth: 0,
                        opacity: atSentinel ? 0.45 : 1 }}/>
        <span className="mono" style={{ width: 46, textAlign: 'right', flexShrink: 0,
                                        color: atSentinel ? 'var(--ink-4)' : 'var(--accent)' }}>
          {/* Match the readout's precision to the step, so a 0.1-step knob
              reads "2.0" rather than jumping between "2" and "2.1". */}
          {atSentinel ? 'auto'
            : Number(value).toFixed((String(step).split('.')[1] || '').length)}
        </span>
        {sentinel !== undefined && (
          <button className="btn btn-ghost" disabled={disabled}
                  style={{ fontSize: 10, flexShrink: 0 }}
                  onClick={() => onChange(atSentinel ? Number(min) : sentinel)}>
            {atSentinel ? 'set' : 'auto'}
          </button>
        )}
      </div>
    </Field>
  );
}

function OutputTab({ system }) {
  const [saved, setSaved] = useState(null);
  const [draft, setDraft] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [note, setNote] = useState('');

  useEffect(() => {
    fetch('/api/config').then(r => r.json())
      .then(d => { setSaved(d); setDraft(d); })
      .catch(e => setErr('Could not load settings: ' + (e.message || e)));
  }, []);

  const set = (k, v) => setDraft(d => ({ ...d, [k]: v }));
  const changed = draft && saved
    ? Object.keys(draft).filter(k => draft[k] !== saved[k]) : [];

  const save = async () => {
    if (!changed.length) return;
    setBusy(true); setErr(''); setNote('');
    try {
      const body = {};
      changed.forEach(k => { body[k] = draft[k]; });
      const fd = new FormData();
      fd.append('body', JSON.stringify(body));
      const r = await fetch('/api/config', { method: 'PATCH', body: fd });
      const d = await r.json();
      if (!r.ok || d.error) { setErr(d.error || `Save failed (${r.status})`); return; }
      setSaved(d.config); setDraft(d.config);
      setNote('Saved — applies to the next job.');
    } catch (e) { setErr(String(e.message || e)); }
    finally { setBusy(false); }
  };

  if (!draft) {
    return <div className="mono" style={{ color: 'var(--ink-3)' }}>
      {err || 'Loading settings…'}
    </div>;
  }

  const group = { padding: 16, background: 'var(--bg-1)', border: '1px solid var(--line)',
                  borderRadius: 'var(--r-lg)', display: 'flex', flexDirection: 'column',
                  gap: 14, marginBottom: 16 };
  const copyMode = draft.output_video_codec === 'copy';

  return (
    <div style={{ maxWidth: 720 }}>
      <div style={group}>
        <div className="caps">Format &amp; compatibility</div>
        <Field label="Video codec"
               hint="Re-encode keeps the result playable in QuickTime, WhatsApp and Finder. Copy is faster but passes the source stream through untouched — a VP9 or AV1 source then produces an .mp4 those players refuse.">
          <Select value={draft.output_video_codec} onChange={v => set('output_video_codec', v)}>
            <option value="h264" style={{ background: '#14141a' }}>H.264 · re-encode when needed (most compatible)</option>
            <option value="copy" style={{ background: '#14141a' }}>Copy source stream · fastest</option>
          </Select>
        </Field>
        {copyMode && (
          <div style={{ padding: '8px 11px', borderRadius: 'var(--r-md)',
                        background: 'var(--bg-2)', border: '1px solid var(--warn)',
                        color: 'var(--warn)', fontSize: 11.5 }}>
            With Copy, a VP9 or AV1 source is placed in an .mp4 unchanged. The
            file is valid but will not open in QuickTime or WhatsApp.
          </div>
        )}
        <Field label="Max source resolution"
               hint="Caps what is downloaded. Lower is faster to fetch and render.">
          <Select value={String(draft.output_max_height)}
                  onChange={v => set('output_max_height', Number(v))}>
            <option value="720" style={{ background: '#14141a' }}>720p</option>
            <option value="1080" style={{ background: '#14141a' }}>1080p</option>
            <option value="1440" style={{ background: '#14141a' }}>1440p</option>
            <option value="2160" style={{ background: '#14141a' }}>2160p · 4K</option>
            <option value="0" style={{ background: '#14141a' }}>Best available</option>
          </Select>
        </Field>
      </div>

      <div style={group}>
        <div className="caps">Quality vs speed</div>
        <div style={{ fontSize: 11.5, color: 'var(--ink-3)', marginTop: -4 }}>
          Only applies when the video is re-encoded — a copied stream keeps the
          source's own quality.
        </div>
        <Field label="Encoder preset"
               hint="Slower presets produce a smaller file at the same quality, and take longer to render.">
          <Select value={draft.output_preset} onChange={v => set('output_preset', v)}>
            {['ultrafast','superfast','veryfast','faster','fast','medium','slow'].map(o => (
              <option key={o} value={o} style={{ background: '#14141a' }}>{o}</option>
            ))}
          </Select>
        </Field>
        <NumberKnob label="Quality (CRF)" min={16} max={32} step={1}
                    value={draft.output_crf}
                    onChange={v => set('output_crf', v)}
                    hint="16–32. Lower is better quality and a bigger file; 23 is the default, 18 is near-transparent."/>
        <Field label="Audio bitrate" hint="AAC. 192k is transparent for speech.">
          <Select value={draft.output_audio_bitrate}
                  onChange={v => set('output_audio_bitrate', v)}>
            {['128k','192k','256k','320k'].map(o => (
              <option key={o} value={o} style={{ background: '#14141a' }}>{o}</option>
            ))}
          </Select>
        </Field>
      </div>

      <div style={group}>
        <div className="caps">Mix</div>
        <NumberKnob label="Background volume" min={0} max={1} step={0.05}
                    value={draft.background_volume}
                    onChange={v => set('background_volume', Math.round(v * 20) / 20)}
                    hint="Music/SFX bed level when no one is speaking; it ducks automatically under the dub. 0 mutes it."/>
        <Toggle value={!!draft.bg_ducking}
                onChange={v => set('bg_ducking', v)}
                label="Duck background under speech"
                hint="Off = legacy flat mix at the volume above."/>
      </div>

      {err && (
        <div style={{ padding: '9px 12px', borderRadius: 'var(--r-md)', marginBottom: 12,
                      background: 'oklch(0.7 0.2 25 / 0.1)', border: '1px solid oklch(0.7 0.2 25 / 0.25)',
                      color: 'var(--err)', fontSize: 11.5 }}>{err}</div>
      )}
      {note && !err && (
        <div style={{ padding: '9px 12px', borderRadius: 'var(--r-md)', marginBottom: 12,
                      background: 'var(--accent-dim)', border: '1px solid var(--line-2)',
                      fontSize: 11.5 }}>{note}</div>
      )}

      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <button className="btn btn-primary" onClick={save} disabled={busy || !changed.length}>
          {busy ? 'Saving…' : changed.length ? `Save ${changed.length} change${changed.length > 1 ? 's' : ''}` : 'Saved'}
        </button>
        {changed.length > 0 && (
          <button className="btn btn-ghost" onClick={() => { setDraft(saved); setErr(''); setNote(''); }}>
            Discard
          </button>
        )}
        <div style={{ flex: 1 }}/>
        <span className="mono" style={{ fontSize: 10, color: 'var(--ink-4)' }}>config-user.json</span>
      </div>
    </div>
  );
}

function VoiceTtsTab({ system }) {
  const [saved, setSaved] = useState(null);   // last known server state
  const [draft, setDraft] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [note, setNote] = useState('');

  useEffect(() => {
    fetch('/api/config').then(r => r.json())
      .then(d => { setSaved(d); setDraft(d); })
      .catch(e => setErr('Could not load settings: ' + (e.message || e)));
  }, []);

  const voxOk = system?.voxcpm?.ok !== false;
  const set = (k, v) => setDraft(d => ({ ...d, [k]: v }));
  // Only changed keys are sent, so a save never rewrites fields this tab
  // doesn't own (and never resends a masked secret).
  const changed = draft && saved
    ? Object.keys(draft).filter(k => draft[k] !== saved[k]) : [];

  const save = async () => {
    if (!changed.length) return;
    setBusy(true); setErr(''); setNote('');
    try {
      const body = {};
      changed.forEach(k => { body[k] = draft[k]; });
      const fd = new FormData();
      fd.append('body', JSON.stringify(body));
      const r = await fetch('/api/config', { method: 'PATCH', body: fd });
      const d = await r.json();
      if (!r.ok || d.error) { setErr(d.error || `Save failed (${r.status})`); return; }
      setSaved(d.config); setDraft(d.config);
      setNote(d.tts_rebuild_pending
        ? (d.tts_reloaded
            ? 'Saved — the voice model was released; the next job loads it with these settings.'
            : 'Saved — the next job loads the model with these settings.')
        : 'Saved — applies to the next job.');
    } catch (e) { setErr(String(e.message || e)); }
    finally { setBusy(false); }
  };

  if (!draft) {
    return <div className="mono" style={{ color: 'var(--ink-3)' }}>
      {err || 'Loading settings…'}
    </div>;
  }

  const engine = draft.tts_engine;
  const voxDisabled = engine !== 'voxcpm' && engine !== 'auto';
  const group = { padding: 16, background: 'var(--bg-1)', border: '1px solid var(--line)',
                  borderRadius: 'var(--r-lg)', display: 'flex', flexDirection: 'column',
                  gap: 14, marginBottom: 16 };

  return (
    <div style={{ maxWidth: 720 }}>
      {!voxOk && (
        <div style={{ padding: '10px 13px', borderRadius: 'var(--r-md)', marginBottom: 16,
                      background: 'var(--bg-2)', border: '1px solid var(--warn)',
                      color: 'var(--warn)', fontSize: 11.5 }}>
          VoxCPM2 isn't importable in this environment, so its settings are saved
          but inert — the pipeline falls back to F5-TTS or edge-tts. See Setup.
        </div>
      )}

      <div style={group}>
        <div className="caps">Engine</div>
        <Field label="TTS engine"
               hint="Which tier to use. Higher tiers fall back automatically when unavailable.">
          <Select value={engine} onChange={v => set('tts_engine', v)}>
            {['voxcpm', 'f5tts', 'edge-tts'].map(o => (
              <option key={o} value={o} style={{ background: '#14141a' }}>
                {o === 'voxcpm' ? 'VoxCPM2 · best cloning, 8+ GB'
                 : o === 'f5tts' ? 'F5-TTS · good cloning, 3+ GB'
                 : 'edge-tts · no cloning, no GPU'}
              </option>
            ))}
          </Select>
        </Field>
        <Field label="VoxCPM model"
               hint="HuggingFace repo id or a local path. Changing this downloads new weights on the next job.">
          <input className="field" value={draft.voxcpm_model} disabled={voxDisabled}
                 onChange={e => set('voxcpm_model', e.target.value)}/>
        </Field>
      </div>

      <div style={group}>
        <div className="caps">Quality</div>
        <NumberKnob label="Guidance (cfg)" min={1} max={3} step={0.1}
                    value={draft.voxcpm_cfg} disabled={voxDisabled}
                    onChange={v => set('voxcpm_cfg', Math.round(v * 10) / 10)}
                    hint="1.0–3.0. Higher sticks closer to the text; too high sounds clipped and robotic."/>
        <NumberKnob label="Inference steps" min={4} max={24} step={1} sentinel={0}
                    value={draft.voxcpm_steps} disabled={voxDisabled}
                    onChange={v => set('voxcpm_steps', v)}
                    hint="auto follows the per-job speed tier (fast 6 · balanced 8 · quality 10). Set 4–24 to override it for every job."/>
        <Toggle value={!!draft.voxcpm_denoise_refs} disabled={voxDisabled}
                onChange={v => set('voxcpm_denoise_refs', v)}
                label="Denoise reference clips with VoxCPM"
                hint="Off by default — the pipeline already denoises, normalizes and trims references. Turn on for unusually noisy source audio."/>
      </div>

      <div style={group}>
        <div className="caps">Cross-lingual</div>
        <div style={{ fontSize: 11.5, color: 'var(--ink-3)', marginTop: -4 }}>
          Applied only when the target language differs from the source, where
          the voice otherwise drifts toward source-language phonetics. These are
          floors: a higher value above still wins.
        </div>
        <NumberKnob label="Cross-lingual guidance" min={1} max={3} step={0.1}
                    value={draft.voxcpm_xling_cfg} disabled={voxDisabled}
                    onChange={v => set('voxcpm_xling_cfg', Math.round(v * 10) / 10)}
                    hint="Default 2.5."/>
        <NumberKnob label="Cross-lingual steps" min={4} max={24} step={1}
                    value={draft.voxcpm_xling_steps} disabled={voxDisabled}
                    onChange={v => set('voxcpm_xling_steps', v)}
                    hint="Default 14. Costs ~60% more inference time per segment, but avoids retries."/>
      </div>

      <div style={group}>
        <div className="caps">Output</div>
        <Toggle value={!!draft.qa_same_language}
                onChange={v => set('qa_same_language', v)}
                label="Run QA on same-language dubs"
                hint="Whisper-roundtrips every segment to catch gibberish. Always on for cross-lingual jobs; rarely needed otherwise."/>
        <NumberKnob label="Max time-compression" min={1} max={2} step={0.05}
                    value={draft.tts_max_stretch}
                    onChange={v => set('tts_max_stretch', Math.round(v * 20) / 20)}
                    hint="1.0–2.0. How hard the assembler may speed up a segment to keep sync. Above ~1.15 becomes audible; lower it if dubs sound rushed."/>
      </div>

      {err && (
        <div style={{ padding: '9px 12px', borderRadius: 'var(--r-md)', marginBottom: 12,
                      background: 'oklch(0.7 0.2 25 / 0.1)', border: '1px solid oklch(0.7 0.2 25 / 0.25)',
                      color: 'var(--err)', fontSize: 11.5 }}>{err}</div>
      )}
      {note && !err && (
        <div style={{ padding: '9px 12px', borderRadius: 'var(--r-md)', marginBottom: 12,
                      background: 'var(--accent-dim)', border: '1px solid var(--line-2)',
                      fontSize: 11.5 }}>{note}</div>
      )}

      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <button className="btn btn-primary" onClick={save} disabled={busy || !changed.length}>
          {busy ? 'Saving…' : changed.length ? `Save ${changed.length} change${changed.length > 1 ? 's' : ''}` : 'Saved'}
        </button>
        {changed.length > 0 && (
          <button className="btn btn-ghost" onClick={() => { setDraft(saved); setErr(''); setNote(''); }}>
            Discard
          </button>
        )}
        <div style={{ flex: 1 }}/>
        <span className="mono" style={{ fontSize: 10, color: 'var(--ink-4)' }}>
          config-user.json
        </span>
      </div>
    </div>
  );
}

function SystemView({ system, onRefreshSystem }) {
  const [tab, setTab] = useState(_lsGet('system_tab', 'overview'));
  const pick = (t) => { setTab(t); _lsSet('system_tab', t); };
  // "logs at failure →" from a job error panel: if this view is already
  // mounted the localStorage-seeded initial tab won't re-run, so follow
  // the event too.
  useEffect(() => {
    const h = () => setTab('logs');
    window.addEventListener('gcd:open-logs', h);
    return () => window.removeEventListener('gcd:open-logs', h);
  }, []);
  const issues = system?.notices || [];
  const problems = issues.filter(n => n.severity === 'error').length;

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: 'var(--pad)', background: 'var(--bg)' }}>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 14, marginBottom: 18 }}>
        <div className="serif" style={{ fontSize: 'clamp(22px, 6vw, 32px)' }}>System</div>
        <span className="chip" style={{
          color: issues.length === 0 ? 'var(--accent)' : sevMeta(problems ? 'error' : 'warn').color,
          borderColor: issues.length === 0 ? 'var(--line-2)' : sevMeta(problems ? 'error' : 'warn').line,
        }}>
          {issues.length === 0 ? 'Ready' : `${issues.length} setup ${issues.length === 1 ? 'issue' : 'issues'}`}
        </span>
      </div>

      <div style={{ display: 'flex', gap: 6, marginBottom: 22 }}>
        {[['overview', 'Overview'], ['voice', 'Voice & TTS'], ['output', 'Output'], ['setup', 'Setup'], ['logs', 'Logs']].map(([id, label]) => (
          <button key={id} className={'tab' + (tab === id ? ' active' : '')} onClick={() => pick(id)}>
            {label}{id === 'setup' && issues.length > 0 ? ` · ${issues.length}` : ''}
          </button>
        ))}
      </div>

      {tab === 'voice' && <VoiceTtsTab system={system}/>}
      {tab === 'output' && <OutputTab system={system}/>}
      {tab === 'setup' && <SetupTab system={system} onRefreshSystem={onRefreshSystem}/>}
      {tab === 'logs' && <LogsTab/>}
      {tab === 'overview' && (
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
        <div style={{ padding: 16, background: 'var(--bg-1)', border: '1px solid var(--line)', borderRadius: 8 }}>
          <div className="caps">Translation Backend</div>
          <div style={{ fontSize: 18, marginTop: 8 }}>
            {system?.translation_backend === 'lm_studio' ? 'LM Studio' : 'Ollama'}
          </div>
          <div className="mono" style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 4 }}>
            {system?.lm_studio?.ok ? `Connected to ${system?.lm_studio?.url || 'localhost:1234'}` : 'Not connected'}
          </div>
          {system?.lm_studio?.models && (
            <div style={{ marginTop: 10 }}>
              <div className="caps" style={{ marginBottom: 4 }}>Available Models ({system.lm_studio.models.length})</div>
              <div style={{ fontSize: 11, color: 'var(--ink-2)', maxHeight: 200, overflow: 'auto' }}>
                {system.lm_studio.models.slice(0, 10).map(m => (
                  <div key={m} className="mono" style={{ padding: '2px 0' }}>· {m}</div>
                ))}
                {system.lm_studio.models.length > 10 && (
                  <div className="mono" style={{ color: 'var(--ink-4)' }}>+ {system.lm_studio.models.length - 10} more</div>
                )}
              </div>
            </div>
          )}
        </div>
        <div style={{ padding: 16, background: 'var(--bg-1)', border: '1px solid var(--line)', borderRadius: 8 }}>
          <div className="caps">Accelerator</div>
          {/* system.gpu only knows CUDA; system.accelerator also sees MPS, so
              an Apple Silicon machine stops being reported as "No GPU". */}
          <div style={{ fontSize: 18, marginTop: 8 }}>
            {system?.accelerator?.name || system?.gpu?.name || 'No GPU detected'}
          </div>
          <div className="mono" style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 4 }}>
            {system?.accelerator?.vram_gb ? `${system.accelerator.vram_gb} GB VRAM · `
              : (system?.gpu?.vram_gb ? `${system.gpu.vram_gb} GB VRAM · ` : '')}
            {system?.accelerator?.backend
              ? `${system.accelerator.backend} backend`
              : (system?.accelerator ? 'CPU mode' : '')}
            {system?.accelerator?.torch_version ? ` · torch ${system.accelerator.torch_version}` : ''}
          </div>
          {system?.accelerator?.torch_error && (
            <div className="mono" style={{ fontSize: 10.5, color: 'var(--err)', marginTop: 6 }}>
              {system.accelerator.torch_error}
            </div>
          )}
        </div>
        {/* Live resource readout — the same probes that produce the
            per-stage metrics, so "no GPU telemetry" is visible here
            rather than silently showing up as blank stage stats. */}
        <div style={{ padding: 16, background: 'var(--bg-1)', border: '1px solid var(--line)', borderRadius: 8 }}>
          <div className="caps">Live utilization</div>
          {system?.resources ? (
            <div className="mono" style={{ fontSize: 11, color: 'var(--ink-2)', marginTop: 8, lineHeight: 1.8 }}>
              <div>cpu · {system.resources.cpu_pct ?? '—'}% of {system.resources.cpu_cores ?? '?'} cores</div>
              <div>ram · {system.resources.ram_used_gb ?? '—'} / {system.resources.ram_total_gb ?? '—'} GB
                {system.resources.proc_rss_mb ? ` (server ${system.resources.proc_rss_mb} MB)` : ''}
              </div>
              {system.resources.gpu ? (
                <div>
                  gpu · {system.resources.gpu.util_pct !== undefined ? `${system.resources.gpu.util_pct}% util · ` : ''}
                  {system.resources.gpu.mem_used_mb !== undefined
                    ? `${(system.resources.gpu.mem_used_mb / 1024).toFixed(1)} GB used` : ''}
                  {system.resources.gpu.mem_total_mb
                    ? ` / ${(system.resources.gpu.mem_total_mb / 1024).toFixed(0)} GB` : ''}
                </div>
              ) : (
                <div style={{ color: 'var(--ink-4)' }}>gpu · no telemetry</div>
              )}
              <div style={{ color: 'var(--ink-4)' }}>probe · {system.resources.gpu_backend || 'none'}</div>
            </div>
          ) : (
            <div className="mono" style={{ fontSize: 11, color: 'var(--ink-4)', marginTop: 8 }}>
              psutil not installed — install it for CPU/RAM metrics
            </div>
          )}
        </div>
        <button className="btn" style={{ marginTop: 10 }} onClick={onRefreshSystem}>Refresh</button>
      </div>
      )}
    </div>
  );
}

// DISCOVER VIEW — trending candidates from the scout (app/scout.py)
// ═══════════════════════════════════════════════════════════════════
// GET /api/scout/trending returns normalized candidates + which source
// actually served ("mostviewed" vs the yt-dlp fallback). Each card can
// submit straight into the dub queue via POST /api/scout/dub.
const SCOUT_COUNTRIES = [
  ['global', 'Global'], ['usa', 'USA'], ['uk', 'UK'], ['india', 'India'],
  ['germany', 'Germany'], ['canada', 'Canada'], ['brazil', 'Brazil'],
  ['australia', 'Australia'],
];

function RankDelta({ delta }) {
  if (!delta) return null;
  const up = delta > 0;
  return (
    <span className="mono" style={{ fontSize: 10, color: up ? 'var(--accent)' : 'var(--err)' }}>
      {up ? '▲' : '▼'}{Math.abs(delta)}
    </span>
  );
}

function ScoutCard({ cand, onJumpResult, onJumpProcessing }) {
  // Default to the same target language the Dub form remembers.
  const [lang, setLang] = useState(() => _lsGet('tgtLang', 'ru'));
  const [state, setState] = useState({ phase: 'idle' }); // idle|sending|queued|error
  const [thumbBroken, setThumbBroken] = useState(false);

  const dub = async () => {
    setState({ phase: 'sending' });
    try {
      const r = await fetch('/api/scout/dub', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          url: cand.url, video_id: cand.video_id,
          target_lang: lang, mode: 'auto', is_music: cand.is_music,
        }),
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.job_id) setState({ phase: 'queued', jobId: d.job_id });
      else setState({ phase: 'error', msg: d.error || d.detail || `HTTP ${r.status}` });
    } catch (e) { setState({ phase: 'error', msg: String(e.message || e) }); }
  };

  return (
    <div className="panel" style={{ overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <div style={{ position: 'relative', aspectRatio: '16 / 9', background: 'var(--bg-2)' }}>
        {cand.thumb_url && !thumbBroken && (
          <img src={cand.thumb_url} alt="" loading="lazy"
               onError={() => setThumbBroken(true)}
               style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}/>
        )}
        {cand.duration_sec != null && (
          <span className="mono" style={{
            position: 'absolute', right: 6, bottom: 6, fontSize: 10,
            padding: '1px 6px', borderRadius: 4, background: 'rgba(0,0,0,0.75)', color: '#fff',
          }}>{fmtSec(cand.duration_sec)}</span>
        )}
        {cand.rank != null && (
          <span className="mono" style={{
            position: 'absolute', left: 6, top: 6, fontSize: 10,
            padding: '1px 7px', borderRadius: 4, background: 'rgba(0,0,0,0.75)', color: '#fff',
            display: 'inline-flex', gap: 5, alignItems: 'baseline',
          }}>#{cand.rank} <RankDelta delta={cand.rank_delta}/></span>
        )}
      </div>

      <div style={{ padding: 12, display: 'flex', flexDirection: 'column', gap: 7, flex: 1 }}>
        <a href={cand.url} target="_blank" rel="noreferrer" className="wrap-any"
           style={{ fontSize: 12.5, fontWeight: 500, color: 'var(--ink)', textDecoration: 'none',
                    lineHeight: 1.4 }}>
          {cand.title || cand.video_id}
        </a>
        <div className="mono" style={{ fontSize: 10, color: 'var(--ink-3)', display: 'flex',
                                       gap: 8, flexWrap: 'wrap', alignItems: 'baseline' }}>
          {cand.channel && <span className="wrap-any">{cand.channel}</span>}
          {cand.view_count != null && (
            <span style={{ color: 'var(--ink-4)' }}>{fmtViews(cand.view_count)} views</span>
          )}
        </div>

        {(cand.is_music || cand.is_short || cand.already_processed) && (
          <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
            {cand.is_music && (
              <span className="chip" style={{ fontSize: 10, color: 'var(--warn)',
                                              borderColor: 'oklch(0.78 0.15 60 / 0.3)' }}>
                Music — reupload
              </span>
            )}
            {cand.is_short && <span className="chip" style={{ fontSize: 10 }}>Short</span>}
            {cand.already_processed && (
              cand.existing_job_id ? (
                <button className="chip" onClick={() => onJumpResult(cand.existing_job_id)}
                        style={{ fontSize: 10, color: 'var(--accent)', cursor: 'pointer',
                                 borderColor: 'var(--accent-dim)' }}>
                  Already processed →
                </button>
              ) : (
                <span className="chip" style={{ fontSize: 10 }}>Already processed</span>
              )
            )}
          </div>
        )}

        <div style={{ flex: 1 }}/>

        {state.phase === 'queued' ? (
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 11.5 }}>
            <span style={{ color: 'var(--accent)' }}>✓ Queued</span>
            <button className="chip" onClick={onJumpProcessing}
                    style={{ fontSize: 10, color: 'var(--accent)', cursor: 'pointer',
                             borderColor: 'var(--accent-dim)' }}>
              {String(state.jobId).slice(0, 8)} → watch
            </button>
          </div>
        ) : (
          <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
            <select className="field" value={lang} onChange={e => setLang(e.target.value)}
                    style={{ flex: 1, fontSize: 11.5, padding: '5px 8px' }}>
              {LANGS.filter(l => l.c !== 'auto').map(l => (
                <option key={l.c} value={l.c} style={{ background: '#16161c' }}>{l.n}</option>
              ))}
            </select>
            <button className="btn btn-primary" onClick={dub}
                    disabled={state.phase === 'sending'}
                    style={{ padding: '5px 12px', fontSize: 11.5 }}>
              {state.phase === 'sending' ? '…' : 'Dub'}
            </button>
          </div>
        )}
        {state.phase === 'error' && (
          <div className="wrap-any" style={{ fontSize: 10.5, color: 'var(--err)', lineHeight: 1.4 }}>
            {state.msg}
          </div>
        )}
      </div>
    </div>
  );
}

function DiscoverView({ onJumpResult, onJumpProcessing }) {
  const [country, setCountry] = useState(() => _lsGet('scout_country', 'global'));
  const [category, setCategory] = useState('');
  const [includeShorts, setIncludeShorts] = useState(false);
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  const load = useCallback(async () => {
    setLoading(true); setErr('');
    try {
      const params = new URLSearchParams({ limit: '20' });
      // "global" is the absence of a country filter, not a country slug.
      if (country && country !== 'global') params.set('country', country);
      if (category.trim()) params.set('category', category.trim());
      if (includeShorts) params.set('include_shorts', 'true');
      const r = await fetch('/api/scout/trending?' + params.toString());
      const d = await r.json();
      if (!r.ok || d.error) { setErr(d.error || `HTTP ${r.status}`); }
      else setData(d);
    } catch (e) { setErr(String(e.message || e)); }
    finally { setLoading(false); }
  }, [country, category, includeShorts]);

  // Fetch once when the tab opens; after that the Refresh button owns it —
  // the server caches upstream results, but there's no reason to hammer
  // mostviewed.today on every keystroke in the category box.
  useEffect(() => { load(); }, []);
  useEffect(() => { _lsSet('scout_country', country); }, [country]);

  const candidates = data?.candidates || [];

  return (
    <div className="scroll" style={{ flex: 1, padding: 'var(--pad)', background: 'var(--bg)' }}>
      <div style={{ maxWidth: 1100, margin: '0 auto' }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 14, marginBottom: 6, flexWrap: 'wrap' }}>
          <div className="serif" style={{ fontSize: 'clamp(22px, 6vw, 32px)' }}>Discover</div>
          <span style={{ fontSize: 12, color: 'var(--ink-3)' }}>
            trending on YouTube · pick one, pick a language, dub it
          </span>
        </div>
        {data?.source && (
          <div className="mono" style={{ fontSize: 9.5, color: 'var(--ink-4)', marginBottom: 14 }}>
            via {data.source === 'mostviewed' ? 'mostviewed.today' : 'yt-dlp fallback'}
          </div>
        )}

        <div style={{ display: 'flex', gap: 10, alignItems: 'flex-end', flexWrap: 'wrap', marginBottom: 18 }}>
          <div style={{ minWidth: 140 }}>
            <Field label="Country">
              <Select value={country} onChange={setCountry}>
                {SCOUT_COUNTRIES.map(([v, n]) => (
                  <option key={v} value={v} style={{ background: '#16161c' }}>{n}</option>
                ))}
              </Select>
            </Field>
          </div>
          <div style={{ minWidth: 160 }}>
            <Field label="Category (optional)">
              <input className="field" value={category} onChange={e => setCategory(e.target.value)}
                     placeholder="e.g. gaming, music, shorts"/>
            </Field>
          </div>
          <label className="mono" style={{ fontSize: 10.5, color: 'var(--ink-2)', display: 'flex',
                                           alignItems: 'center', gap: 6, cursor: 'pointer',
                                           paddingBottom: 9 }}>
            <input type="checkbox" checked={includeShorts}
                   onChange={e => setIncludeShorts(e.target.checked)}
                   style={{ accentColor: 'var(--accent)' }}/>
            include shorts
          </label>
          <button className="btn" onClick={load} disabled={loading}>
            {I.refresh} {loading ? 'Fetching…' : 'Refresh'}
          </button>
        </div>

        {err && (
          <div style={{ padding: '10px 12px', borderRadius: 6, marginBottom: 14, fontSize: 12,
                        background: 'oklch(0.7 0.2 25 / 0.08)', border: '1px solid oklch(0.7 0.2 25 / 0.3)',
                        color: 'var(--err)' }} className="wrap-any">
            {err}
          </div>
        )}

        {loading && !data && (
          <div style={{ color: 'var(--ink-3)', fontSize: 12 }}>Fetching trending videos…</div>
        )}
        {!loading && !err && data && candidates.length === 0 && (
          <div style={{ color: 'var(--ink-3)', fontSize: 12 }}>No candidates returned — try another country or include shorts.</div>
        )}

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 14 }}>
          {candidates.map(c => (
            <ScoutCard key={c.video_id || c.url} cand={c}
                       onJumpResult={onJumpResult} onJumpProcessing={onJumpProcessing}/>
          ))}
        </div>
      </div>
    </div>
  );
}

    <div style={{ flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column' }}>

        <HistoryView jobs={jobs} system={system} voicePresets={voicePresets}
          publishPending={publishPending}
          onJumpProcessing={() => setTab('live')}
          onJumpReview={(id) => { onPickReviewJob(id); setTab('review'); }}
          onJumpResult={onJumpResult} onRefresh={onRefresh}/>

          voicePresets={voicePresets}
          onJobCancelled={() => setTab('all')}

function DevPage({ title, subtitle, action, children }) {

// A copyable snippet. The clipboard API needs a secure context, which
// http://localhost is — but a LAN address over plain HTTP is not, so the
// fallback matters for anyone running with GOCHIDUBB_HOST set.
function CodeBlock({ code, label }) {
  const [copied, setCopied] = useState(false);
  const copy = async () => {
    try {
      await navigator.clipboard.writeText(code);
    } catch (_) {
      const ta = document.createElement('textarea');
      ta.value = code; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
    }
    setCopied(true); setTimeout(() => setCopied(false), 1400);
  };
  return (
    <div style={{ position: 'relative' }}>
      {label && <div className="caps" style={{ marginBottom: 6 }}>{label}</div>}
      <pre className="mono wrap-any" style={{
        background: 'var(--bg-2)', border: '1px solid var(--line)',
        borderRadius: 'var(--r-md)', padding: '11px 12px', fontSize: 11,
        lineHeight: 1.65, color: 'var(--ink-2)', whiteSpace: 'pre-wrap', margin: 0,
      }}>{code}</pre>
      <button className="btn" onClick={copy} style={{
        position: 'absolute', top: label ? 24 : 6, right: 6, fontSize: 10,
        padding: '3px 8px',
      }}>{copied ? 'copied' : 'copy'}</button>
    </div>
  );
}

}

function ApiKeysView({ mode }) {
  const [data, setData] = useState(null);
  const [name, setName] = useState('');
  const [env, setEnv] = useState('live');
  const [expiry, setExpiry] = useState('90');
  const [scopes, setScopes] = useState(['dub:write', 'jobs:read', 'outputs:read']);
  const [minted, setMinted] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  const load = () => fetch('/api/apikeys').then(r => r.json()).then(setData)
                       .catch(() => {});
  useEffect(() => { load(); }, []);

  const toggle = (s) => setScopes(cur =>
    cur.includes(s) ? cur.filter(x => x !== s) : [...cur, s]);

  const submit = async () => {
    setBusy(true); setErr('');
    try {
      const fd = new FormData();
      fd.append('name', name);
      fd.append('scopes', scopes.join(','));
      fd.append('environment', env);
      if (expiry) fd.append('expires_days', expiry);
      const r = await fetch('/api/apikeys', { method: 'POST', body: fd });
      const d = await r.json();
      if (!r.ok) { setErr(d.error || 'Could not create key'); return; }
      setMinted(d);          // shown once — the server cannot return it again
      setName('');
      load();
    } catch (e) { setErr(String(e)); }
    finally { setBusy(false); }
  };

  const revoke = async (id) => {
    await fetch(`/api/apikeys/${id}/revoke`, { method: 'POST' });
    load();
  };

  const allScopes = data?.scopes || {};
  const keys = data?.keys || [];

  return (
    <DevPage title="API keys"
             subtitle={`${keys.length} key${keys.length === 1 ? '' : 's'} · REST + MCP share keys`}>

            <div style={{ fontSize: 12.5, color: 'var(--ink-2)', lineHeight: 1.6 }}>

              <span className="mono"> hosted</span>, but nothing is enforced yet.
            </div>
          </div>
        </DevCard>
      )}

      {minted && (
        <DevCard style={{ borderColor: 'var(--accent)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8,
                        marginBottom: 10 }}>
            <span className="dot" style={{ background: 'var(--accent)' }}/>
            <span style={{ fontSize: 12.5, fontWeight: 600 }}>
              Copy it now — this is the only time it is shown

            <button className="btn btn-ghost" style={{ marginLeft: 'auto', fontSize: 11 }}
                    onClick={() => setMinted(null)}>Done</button>
          </div>
          <CodeBlock code={minted.token}/>
          <div className="mono" style={{ fontSize: 10.5, color: 'var(--ink-3)',
                                         marginTop: 8 }}>
            Only a salted hash is stored. If you lose this, revoke the key and
            make another.
          </div>
        </DevCard>
      )}

      <DevCard>
        <div className="caps" style={{ marginBottom: 12 }}>New key</div>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap',
                      alignItems: 'flex-end', marginBottom: 14 }}>
          <div style={{ flex: '1 1 200px', minWidth: 0 }}>
            <div className="caps" style={{ marginBottom: 5 }}>Name</div>
            <input className="field" value={name} placeholder="ci-pipeline"

          </div>
          <div>
            <div className="caps" style={{ marginBottom: 5 }}>Environment</div>
            <div style={{ display: 'flex', gap: 4 }}>
              {['live', 'test'].map(v => (

              ))}
            </div>
          </div>
          <div>
            <div className="caps" style={{ marginBottom: 5 }}>Expires</div>
            <select className="field" value={expiry}
                    onChange={e => setExpiry(e.target.value)}>
              <option value="" style={{ background: 'var(--bg-2)' }}>never</option>
              <option value="30" style={{ background: 'var(--bg-2)' }}>30 days</option>
              <option value="90" style={{ background: 'var(--bg-2)' }}>90 days</option>

        </div>

        <div className="caps" style={{ marginBottom: 8 }}>Scopes</div>

          {Object.entries(allScopes).map(([s, desc]) => {

      <DevCard style={{ padding: 0, overflow: 'hidden' }}>

                  <th key={x} className="caps" style={{

                    borderBottom: '1px solid var(--line)', whiteSpace: 'nowrap',

                ))}

                return (

              <div style={{ marginLeft: 'auto', display: 'flex', gap: 6 }}>
                <button className="btn" style={{ fontSize: 11 }}
                        onClick={() => test(hk.id)}>Send test</button>
                <button className="btn" style={{ fontSize: 11 }}
                        onClick={() => remove(hk.id)}>Remove</button>
              </div>
            </div>
          ))}
        </DevCard>
      )}

      <DevCard>
        <div className="caps" style={{ marginBottom: 10 }}>Delivery log</div>
        {deliveries.length === 0 ? (
          <div className="mono" style={{ fontSize: 11, color: 'var(--ink-3)' }}>
            No deliveries yet.
          </div>
        ) : deliveries.map(d => (
          <div key={d.id} className="mono" style={{
            display: 'flex', alignItems: 'baseline', gap: 10, fontSize: 11,
            padding: '7px 0', borderTop: '1px solid var(--bg-2)',
          }}>
            <span style={{ color: 'var(--ink-4)' }}>{fmtClock(d.ts)}</span>
            <span style={{ color: 'var(--ink-2)' }}>{d.event}</span>
            <span className="wrap-any" style={{ color: 'var(--ink-3)' }}>
              {(d.payload || {}).job_id || ''}
            </span>
            <span style={{ marginLeft: 'auto',
                           color: d.ok ? 'var(--accent)' : 'var(--err)' }}>
              {d.status || d.error || '—'}{d.ms != null ? ` · ${d.ms}ms` : ''}
            </span>
          </div>
        ))}
      </DevCard>
    </DevPage>
  );
}

function StatTile({ label, value, unit, note, tint }) {

      <div style={{ display: 'flex', alignItems: 'baseline', gap: 5 }}>
