// ═══════════════════════════════════════════════════════════════════
// STAGE PANEL — per-stage state, artifacts, timings and retry
// ═══════════════════════════════════════════════════════════════════
// Mirrors GET /api/dub/{id}/stages. Every stage the backend checkpoints
// shows up here with what it produced, how long it took, what it cost in
// CPU/GPU, and a Retry control that re-runs *only* that stage onward.
const STAGE_STATE_META = {
  done:    { color: 'var(--accent)', label: 'done' },
  stale:   { color: 'var(--warn)',   label: 'stale' },
  failed:  { color: 'var(--err)',    label: 'failed' },
  running: { color: 'var(--accent)', label: 'running' },
  pending: { color: 'var(--ink-4)',  label: 'pending' },
};

const fmtDur = (s) => {
  if (s === null || s === undefined) return '—';
  if (s < 1) return `${Math.round(s * 1000)}ms`;
  if (s < 60) return `${s.toFixed(1)}s`;
  const m = Math.floor(s / 60);
  return `${m}m ${Math.round(s % 60).toString().padStart(2, '0')}s`;
};

// Compact "what did this stage cost" line. Peaks matter more than averages
// here — a stage that pins the GPU for 3 of its 40 seconds is a very
// different problem from one that holds it the whole time, and seeing both
// numbers side by side is what makes that visible.
const resSummary = (r) => {
  if (!r) return [];
  const out = [];
  if (r.cpu_proc_pct_avg !== undefined)
    out.push({ k: 'cpu', v: `${Math.round(r.cpu_proc_pct_avg)}% avg · ${Math.round(r.cpu_proc_pct_peak)}% peak` });
  if (r.gpu_util_pct_avg !== undefined)
    out.push({ k: 'gpu', v: `${Math.round(r.gpu_util_pct_avg)}% avg · ${Math.round(r.gpu_util_pct_peak)}% peak` });
  if (r.gpu_mem_mb_peak !== undefined) {
    const tot = r.gpu_mem_total_mb;
    out.push({ k: 'vram', v: `${(r.gpu_mem_mb_peak / 1024).toFixed(1)} GB${tot ? ` / ${(tot / 1024).toFixed(0)} GB` : ''} peak` });
  }
  if (r.rss_mb_peak !== undefined)
    out.push({ k: 'ram', v: `${(r.rss_mb_peak / 1024).toFixed(1)} GB peak` });
  return out;
};

function StageDot({ state }) {
  const meta = STAGE_STATE_META[state] || STAGE_STATE_META.pending;
  return (
    <span
      className="dot"
      style={{
        background: meta.color,
        boxShadow: state === 'running' ? `0 0 8px ${meta.color}` : 'none',
        animation: state === 'running' ? 'pulse 1.2s ease-in-out infinite' : 'none',
        flexShrink: 0,
      }}
    />
  );
}

// Horizontal breakdown of where wall-clock time actually went. Stages with
// no recorded duration are skipped rather than drawn as slivers.
function StageTimeline({ stages, total }) {
  const timed = stages.filter(s => s.duration_sec > 0);
  if (!total || timed.length === 0) return null;
  // Trust the summed durations over the reported total: rounding on the
  // server can otherwise push a single short stage past 100%.
  const sum = timed.reduce((a, s) => a + s.duration_sec, 0);
  const denom = Math.max(sum, total);
  return (
    <div style={{ marginTop: 10 }}>
      <div style={{ display: 'flex', height: 6, borderRadius: 3, overflow: 'hidden', background: 'var(--bg-3)' }}>
        {timed.map((s, i) => (
          <div
            key={s.id}
            title={`${s.label}: ${fmtDur(s.duration_sec)} (${Math.round(s.duration_sec / denom * 100)}%)`}
            style={{
              width: `${(s.duration_sec / denom) * 100}%`,
              background: i % 2 ? 'var(--accent)' : 'var(--accent-glow)',
              borderRight: '1px solid var(--bg-1)',
            }}
          />
        ))}
      </div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10, marginTop: 6 }}>
        {timed.map(s => (
          <span key={s.id} className="mono" style={{ color: 'var(--ink-3)', fontSize: 10 }}>
            {s.label} {Math.round(s.duration_sec / denom * 100)}%
          </span>
        ))}
      </div>
    </div>
  );
}

function RetryOption({ opt, value, onChange, models, voicePresets }) {
  const common = { fontSize: 12 };
  let control;
  if (opt.type === 'bool') {
    control = (
      <label style={{ display: 'inline-flex', alignItems: 'center', gap: 7, cursor: 'pointer' }}>
        <input
          type="checkbox"
          checked={!!value}
          onChange={e => onChange(opt.key, e.target.checked)}
          style={{ width: 14, height: 14, accentColor: 'var(--accent)', cursor: 'pointer' }}
        />
        <span style={{ color: 'var(--ink-2)', ...common }}>{opt.label}</span>
      </label>
    );
  } else if (opt.type === 'number') {
    // Without this branch a numeric option falls through to the free-text
    // input below and posts a string, which the server then refuses.
    control = (
      <div>
        <div className="caps" style={{ marginBottom: 4 }}>{opt.label}</div>
        <input
          className="field"
          type="number"
          min={opt.min} max={opt.max} step={opt.step}
          value={value === undefined ? '' : value}
          placeholder="unchanged"
          onChange={e => onChange(opt.key,
            e.target.value === '' ? undefined : Number(e.target.value))}
          style={{ ...common, minWidth: 120 }}
        />
      </div>
    );
  } else if (opt.type === 'select' || opt.type === 'model' || opt.type === 'voice') {
    // 'model' and 'voice' are 'select' whose choices come from live server
    // state rather than being hard-coded in the stage definition.
    const choices = opt.type === 'model' ? models
      : opt.type === 'voice' ? voicePresets.map(p => p.id)
      : (opt.choices || []);
    control = (
      <div>
        <div className="caps" style={{ marginBottom: 4 }}>{opt.label}</div>
        <select
          className="field"
          value={value === undefined ? '' : value}
          onChange={e => onChange(opt.key, e.target.value || undefined)}
          style={{ ...common, minWidth: 160 }}
        >
          <option value="">— unchanged —</option>
          {choices.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
      </div>
    );
  } else {
    control = (
      <div>
        <div className="caps" style={{ marginBottom: 4 }}>{opt.label}</div>
        <input
          className="field"
          value={value === undefined ? '' : value}
          placeholder="unchanged"
          onChange={e => onChange(opt.key, e.target.value || undefined)}
          style={{ ...common, minWidth: 200 }}
        />
      </div>
    );
  }
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
      {control}
      {opt.hint && (
        <div style={{ fontSize: 10.5, color: 'var(--ink-3)', maxWidth: 260, lineHeight: 1.4 }}>
          {opt.hint}
        </div>
      )}
    </div>
  );
}

function StageRow({ stage, allStages, jobId, models, voicePresets, onRetried }) {
  const [open, setOpen] = useState(false);
  const [opts, setOpts] = useState({});
  const [stopAfter, setStopAfter] = useState('');
  const [sending, setSending] = useState(false);
  const [err, setErr] = useState('');
  const meta = STAGE_STATE_META[stage.state] || STAGE_STATE_META.pending;
  const res = resSummary(stage.resources);
  // `notices` lives inside detail too; it renders as its own block below, so
  // keep it out of the k=v line where it would print as [object Object].
  const detailPairs = Object.entries(stage.detail || {}).filter(([k]) => k !== 'notices');

  const setOpt = (k, v) => setOpts(o => {
    const next = { ...o };
    if (v === undefined || v === '') delete next[k]; else next[k] = v;
    return next;
  });

  const submit = async () => {
    setSending(true); setErr('');
    try {
      const fd = new FormData();
      fd.append('overrides', JSON.stringify(opts));
      if (stopAfter) fd.append('stop_after', stopAfter);
      const r = await fetch(`/api/dub/${jobId}/retry_stage/${stage.id}`, { method: 'POST', body: fd });
      const d = await r.json();
      if (!r.ok) { setErr(d.error || `HTTP ${r.status}`); }
      else { setOpen(false); setOpts({}); setStopAfter(''); onRetried && onRetried(); }
    } catch (e) {
      setErr(String(e));
    } finally {
      setSending(false);
    }
  };

  // Stopping "after" only makes sense at or beyond this stage.
  const laterStages = allStages.filter(s => s.index >= stage.index);

  return (
    <div style={{
      borderTop: '1px solid var(--line)',
      padding: '10px 0',
      opacity: stage.state === 'pending' ? 0.55 : 1,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <StageDot state={stage.state}/>
        <div style={{ minWidth: 96, fontWeight: 500 }}>{stage.label}</div>
        <div className="mono" style={{ color: meta.color, minWidth: 58, fontSize: 10.5 }}>
          {meta.label}
        </div>
        {stage.degraded && (
          <span className="mono" title="Finished, but not the way you'd expect"
                style={{ fontSize: 10, color: 'var(--warn)' }}>⚠ degraded</span>
        )}
        <div className="mono" style={{ minWidth: 62, color: 'var(--ink-2)' }}>
          {fmtDur(stage.duration_sec)}
        </div>
        {stage.attempt > 1 && (
          <span className="chip" style={{ fontSize: 10, padding: '1px 6px' }}>
            attempt {stage.attempt}
          </span>
        )}
        <div style={{ flex: 1 }}/>
        {stage.can_retry && (
          <button
            className={'btn btn-ghost'}
            style={{ padding: '4px 9px', fontSize: 11.5 }}
            onClick={() => setOpen(o => !o)}
          >
            {open ? 'Cancel' : (stage.state === 'failed' ? 'Retry stage' : 'Re-run')}
          </button>
        )}
      </div>

      {/* Resource + artifact strip */}
      {(res.length > 0 || stage.artifacts.length > 0 || stage.error) && (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginTop: 6, paddingLeft: 16, alignItems: 'center' }}>
          {res.map(r => (
            <span key={r.k} className="mono" style={{ fontSize: 10, color: 'var(--ink-3)' }}>
              <span style={{ color: 'var(--ink-4)' }}>{r.k}</span> {r.v}
            </span>
          ))}
          {stage.artifacts.map(a => (
            a.url ? (
              <a key={a.label} href={a.url} target="_blank" rel="noreferrer" className="chip"
                 style={{ fontSize: 10, padding: '1px 7px', textDecoration: 'none' }}>
                {a.name}{a.is_dir ? ` · ${a.file_count} files` : ''}
                {a.size_mb !== null ? ` · ${a.size_mb} MB` : ''}
              </a>
            ) : (
              <span key={a.label} className="chip" style={{ fontSize: 10, padding: '1px 7px', opacity: 0.6 }}>
                {a.name}{a.exists ? '' : ' · missing'}
              </span>
            )
          ))}
        </div>
      )}
      {detailPairs.length > 0 && (
        <div className="mono" style={{ fontSize: 10, color: 'var(--ink-4)', marginTop: 4, paddingLeft: 16 }}>
          {detailPairs.map(([k, v]) => `${k}=${v}`).join('  ')}
        </div>
      )}
      {/* Degraded: the stage succeeded but not the way the user assumes.
          Sits above the error box so "done ⚠" reads top-down. */}
      {(stage.notices || []).map(n => (
        <div key={n.code} style={{ marginTop: 6, marginLeft: 16, padding: '7px 9px', borderRadius: 5,
                      background: sevMeta(n.severity).bg,
                      border: '1px solid ' + sevMeta(n.severity).line,
                      fontSize: 11, lineHeight: 1.5 }}>
          <div style={{ color: sevMeta(n.severity).color }}>{n.title}</div>
          {n.remediation?.length > 0 && (
            <div className="mono" style={{ fontSize: 10, color: 'var(--ink-2)', marginTop: 3 }}>
              {n.remediation[0]}
            </div>
          )}
          {n.url && (
            <a href={n.url} target="_blank" rel="noreferrer" className="mono"
               style={{ fontSize: 10, color: sevMeta(n.severity).color, marginTop: 3, display: 'inline-block' }}>
              {n.url.replace(/^https?:\/\//, '')} ↗
            </a>
          )}
        </div>
      ))}
      {stage.error && (
        <div style={{ marginTop: 6, marginLeft: 16, padding: '6px 8px', borderRadius: 5,
                      background: 'oklch(0.7 0.2 25 / 0.1)', border: '1px solid oklch(0.7 0.2 25 / 0.25)',
                      color: 'var(--err)', fontSize: 11, lineHeight: 1.45 }}>
          {stage.error}
        </div>
      )}

      {/* Retry form */}
      {open && (
        <div style={{
          marginTop: 10, marginLeft: 16, padding: 12,
          background: 'var(--bg-2)', border: '1px solid var(--line)', borderRadius: 8,
          animation: 'slideUp 0.15s ease-out',
        }}>
          <div className="caps" style={{ marginBottom: 8 }}>
            Re-run from “{stage.label}”
          </div>
          <div style={{ fontSize: 11.5, color: 'var(--ink-3)', marginBottom: 12, lineHeight: 1.5 }}>
            Loads the checkpoint from the previous stage and runs forward.
            Everything before {stage.label.toLowerCase()} is reused as-is.
          </div>
          {stage.options.length > 0 && (
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 16, marginBottom: 12 }}>
              {stage.options.map(o => (
                <RetryOption key={o.key} opt={o} value={opts[o.key]} onChange={setOpt}
                             models={models} voicePresets={voicePresets}/>
              ))}
            </div>
          )}
          <div style={{ display: 'flex', alignItems: 'flex-end', gap: 12, flexWrap: 'wrap' }}>
            <div>
              <div className="caps" style={{ marginBottom: 4 }}>Stop after</div>
              <select className="field" value={stopAfter} onChange={e => setStopAfter(e.target.value)}
                      style={{ fontSize: 12, minWidth: 150 }}>
                <option value="">Run to the end</option>
                {laterStages.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
              </select>
            </div>
            <button className="btn btn-primary" disabled={sending} onClick={submit}>
              {sending ? 'Queueing…' : 'Run'}
            </button>
          </div>
          {err && (
            <div style={{ marginTop: 8, color: 'var(--err)', fontSize: 11.5 }}>{err}</div>
          )}
        </div>
      )}
    </div>
  );
}

function StagePanel({ jobId, system, voicePresets, onChanged, defaultOpen = true }) {
  const [data, setData] = useState(null);
  const [expanded, setExpanded] = useState(defaultOpen);
  const [loadErr, setLoadErr] = useState('');

  const load = React.useCallback(async () => {
    if (!jobId) return;
    try {
      const r = await fetch(`/api/dub/${jobId}/stages`);
      if (!r.ok) { setLoadErr(`HTTP ${r.status}`); return; }
      setData(await r.json());
      setLoadErr('');
    } catch (e) { setLoadErr(String(e)); }
  }, [jobId]);

  // Poll fast while the pipeline owns the job, slowly once it's at rest —
  // this panel is open on the Result/History screens too, where nothing
  // changes until the user asks for a retry.
  useEffect(() => {
    if (!expanded) return;
    load();
    const t = setInterval(load, data && data.busy ? 2000 : 10000);
    return () => clearInterval(t);
  }, [load, expanded, data && data.busy]);

  const models = React.useMemo(() => {
    if (!system) return [];
    const ollama = (system.ollama && system.ollama.models) || [];
    const lms = (system.lm_studio && system.lm_studio.models) || [];
    return Array.from(new Set([...ollama, ...lms]));
  }, [system]);

  if (!jobId) return null;

  return (
    // data-stage-panel: anchor for the Quality panel's "→ fix it" hints,
    // which scroll here — the retry controls live in this panel.
    <div className="panel" data-stage-panel={jobId} style={{ padding: 16, width: '100%' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer' }}
           onClick={() => setExpanded(e => !e)}>
        <div className="caps">Pipeline stages</div>
        <div style={{ flex: 1 }}/>
        {data && (
          <React.Fragment>
            <span className="mono" style={{ color: 'var(--ink-3)', fontSize: 10.5 }}>
              total {fmtDur(data.total_duration_sec)}
            </span>
            <span className="mono" style={{ color: 'var(--ink-4)', fontSize: 10.5 }}>
              gpu probe: {data.gpu_backend || 'none'}
            </span>
          </React.Fragment>
        )}
        <span style={{ color: 'var(--ink-3)', fontSize: 11 }}>{expanded ? '▾' : '▸'}</span>
      </div>

      {expanded && !data && (
        <div style={{ color: 'var(--ink-3)', marginTop: 12, fontSize: 12 }}>
          {loadErr ? `Could not load stages — ${loadErr}` : 'Loading stages…'}
        </div>
      )}

      {expanded && data && (
        <div style={{ marginTop: 4 }}>
          <StageTimeline stages={data.stages} total={data.total_duration_sec}/>
          {data.busy && (
            <div style={{ marginTop: 10, fontSize: 11.5, color: 'var(--warn)' }}>
              Job is {data.job_status} — cancel it to re-run a stage.
            </div>
          )}
          <div style={{ marginTop: 8 }}>
            {data.stages.map(s => (
              <StageRow
                key={s.id} stage={s} allStages={data.stages} jobId={jobId}
                models={models} voicePresets={voicePresets || []}
                onRetried={() => { load(); onChanged && onChanged(); }}
              />
            ))}
          </div>
          {data.stages.some(s => s.state === 'stale') && (
            <div style={{ marginTop: 10, fontSize: 11, color: 'var(--warn)', lineHeight: 1.5 }}>
              Stages marked <strong>stale</strong> ran before an earlier stage was
              re-done — their output no longer reflects the current input. Re-run
              them (or any stage above) to refresh.
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// QUALITY PANEL — per-stage scores + verdicts
// ═══════════════════════════════════════════════════════════════════
// Mirrors GET /api/dub/{id}/quality: rollup.stages holds 0-100 scores per
// stage (or available:false when a stage produced nothing to measure) and
// rollup.verdicts carries actionable findings. The report walks checkpoint
// files on disk, so it is fetched lazily — only once the section is opened.
const QUALITY_STAGE_LABELS = [
  ['asr', 'Transcription'],
  ['translation', 'Translation'],
  ['tts', 'TTS'],
  ['timing', 'Timing'],
  ['loudness', 'Loudness'],
];

const scoreColor = (s) =>
  s === null || s === undefined ? 'var(--ink-4)'
  : s >= 80 ? 'var(--accent)'
  : s >= 50 ? 'var(--warn)'
  : 'var(--err)';

// suggested_action values name existing server routes; the retry controls
// for all of them live in the Pipeline stages panel, so the hint scrolls
// there rather than pretending each has its own editor.
const QUALITY_ACTION_HINTS = {
  retranslate: 'Re-run Translate',
  edit_translations: 'Edit translations',
  retry_tts: 'Retry TTS',
  regenerate_segment: 'Regenerate segment',
};

const VERDICT_SEV_META = {
  serious: { icon: '⚠', color: 'var(--err)' },
  warn:    { icon: '⚠', color: 'var(--warn)' },
  info:    { icon: 'ℹ', color: 'var(--ink-2)' },
};

function QualityVerdict({ v, jobId }) {
  const meta = VERDICT_SEV_META[v.severity] || VERDICT_SEV_META.info;
  const hint = v.suggested_action &&
    (QUALITY_ACTION_HINTS[v.suggested_action] || v.suggested_action.replace(/_/g, ' '));
  const jumpToStages = () => {
    const el = document.querySelector(`[data-stage-panel="${jobId}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  return (
    <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start', padding: '6px 0',
                  borderTop: '1px solid var(--line)' }}>
      <span style={{ color: meta.color, flexShrink: 0, width: 14, textAlign: 'center' }}>{meta.icon}</span>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 11.5, color: 'var(--ink-2)', lineHeight: 1.5 }} className="wrap-any">
          <span className="mono" style={{ fontSize: 10, color: 'var(--ink-4)', marginRight: 6 }}>{v.stage}</span>
          {v.message}
        </div>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center', marginTop: 2, flexWrap: 'wrap' }}>
          {v.segment_indices?.length > 0 && (
            <span className="mono" style={{ fontSize: 9.5, color: 'var(--ink-4)' }}>
              segments {v.segment_indices.slice(0, 8).join(', ')}
              {v.segment_indices.length > 8 ? ` +${v.segment_indices.length - 8} more` : ''}
            </span>
          )}
          {hint && (
            <button onClick={jumpToStages} className="mono"
                    title="The retry controls are in the Pipeline stages panel"
                    style={{ fontSize: 10, color: 'var(--accent)', cursor: 'pointer', padding: 0 }}>
              → {hint}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function QualityPanel({ jobId, defaultOpen = false }) {
  const [expanded, setExpanded] = useState(defaultOpen);
  const [data, setData] = useState(null);
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  const load = useCallback(async () => {
    if (!jobId) return;
    setLoading(true);
    try {
      const r = await fetch(`/api/dub/${jobId}/quality`);
      const d = await r.json();
      if (!r.ok) { setErr(d.error || d.detail || `HTTP ${r.status}`); setData(null); }
      else { setData(d); setErr(''); }
    } catch (e) { setErr(String(e.message || e)); }
    finally { setLoading(false); }
  }, [jobId]);

  useEffect(() => {
    if (expanded && !data && !err && !loading) load();
  }, [expanded]);

  if (!jobId) return null;
  const rollup = data?.rollup;

  return (
    <div className="panel" style={{ padding: 16, width: '100%' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer' }}
           onClick={() => setExpanded(e => !e)}>
        <div className="caps">Quality</div>
        {rollup && rollup.overall !== null && rollup.overall !== undefined && (
          <span className="mono" style={{ fontSize: 10.5, color: scoreColor(rollup.overall) }}>
            {rollup.overall}/100
          </span>
        )}
        <div style={{ flex: 1 }}/>
        {expanded && data && (
          <button className="btn btn-ghost" style={{ padding: '2px 7px', fontSize: 10.5 }}
                  onClick={e => { e.stopPropagation(); load(); }}>
            {I.refresh} Refresh
          </button>
        )}
        <span style={{ color: 'var(--ink-3)', fontSize: 11 }}>{expanded ? '▾' : '▸'}</span>
      </div>

      {expanded && loading && !data && (
        <div style={{ color: 'var(--ink-3)', marginTop: 12, fontSize: 12 }}>Scoring…</div>
      )}
      {expanded && err && (
        <div style={{ color: 'var(--ink-3)', marginTop: 12, fontSize: 12 }}>
          No quality report — {err}
        </div>
      )}

      {expanded && rollup && (
        <div style={{ marginTop: 14 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 18, flexWrap: 'wrap' }}>
            {/* Overall first and big — the chips explain it, not the reverse. */}
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
              <span className="serif" style={{ fontSize: 40, lineHeight: 1,
                                               color: scoreColor(rollup.overall) }}>
                {rollup.overall ?? '—'}
              </span>
              <span className="mono" style={{ fontSize: 10, color: 'var(--ink-4)' }}>/100 overall</span>
            </div>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
              {QUALITY_STAGE_LABELS.map(([key, label]) => {
                const st = rollup.stages?.[key];
                if (!st || !st.available) {
                  // Not-measured is neutral, not a failing grade: a stage
                  // that produced no artifacts simply has nothing to score.
                  return (
                    <span key={key} className="chip" style={{ opacity: 0.55 }}>
                      {label} <span className="mono" style={{ fontSize: 9.5, color: 'var(--ink-4)' }}>not measured</span>
                    </span>
                  );
                }
                const c = scoreColor(st.score);
                return (
                  <span key={key} className="chip" style={{ color: c, borderColor: c + '50' }}>
                    {label} <span className="mono" style={{ fontSize: 10 }}>{st.score}</span>
                  </span>
                );
              })}
            </div>
          </div>
          {data.n_segments !== undefined && (
            <div className="mono" style={{ fontSize: 9.5, color: 'var(--ink-4)', marginTop: 8 }}>
              {data.n_segments} segments · scored from the {data.segments_from || '?'} checkpoint
            </div>
          )}
          {(rollup.verdicts || []).length > 0 ? (
            <div style={{ marginTop: 10 }}>
              {rollup.verdicts.map((v, i) => <QualityVerdict key={i} v={v} jobId={jobId}/>)}
            </div>
          ) : (
            <div style={{ marginTop: 10, fontSize: 11.5, color: 'var(--ink-3)' }}>
              No findings — nothing needs attention.
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// PUBLISH PANEL — stage → review duplicates → approve → upload to VK
// ═══════════════════════════════════════════════════════════════════
// Talks to /api/dub/{id}/publish[...] and /api/secrets. The lifecycle is
// deliberately human-gated: staging never uploads anything; only Approve
// does. A GET 404 simply means "not staged yet" — including on servers
// where the publish backend hasn't landed, where the Stage button will
// report the missing route as an inline error.
const DUP_VERDICT_META = {
  likely_duplicate: { color: 'var(--err)',    bg: 'oklch(0.7 0.2 25 / 0.08)',   line: 'oklch(0.7 0.2 25 / 0.3)',
                      label: 'A very similar video already exists on VK' },
  possible:         { color: 'var(--warn)',   bg: 'oklch(0.78 0.15 60 / 0.08)', line: 'oklch(0.78 0.15 60 / 0.3)',
                      label: 'Possibly similar videos found — check the list before uploading' },
  clear:            { color: 'var(--accent)', bg: 'var(--accent-dim)',          line: 'var(--line-2)',
                      label: 'No similar uploads found' },
  unchecked:        { color: 'var(--ink-3)',  bg: 'var(--bg-1)',                line: 'var(--line)',
                      label: "Couldn't check for duplicates" },
};

const dupScorePct = (s) => {
  if (s === null || s === undefined) return '—';
  return `${Math.round(s <= 1 ? s * 100 : s)}%`;
};

function Spinner() {
  return <span className="dot" style={{ background: 'var(--accent)',
    boxShadow: '0 0 8px var(--accent-glow)', animation: 'pulse 1.2s infinite' }}/>;
}

function PublishPanel({ jobId, defaultOpen = false }) {
  const [expanded, setExpanded] = useState(defaultOpen);
  const [pub, setPub] = useState(null);        // P from the contract, or null
  const [loaded, setLoaded] = useState(false); // first GET finished (404 counts)
  const [secrets, setSecrets] = useState(null);
  const [tokenInput, setTokenInput] = useState('');
  const [title, setTitle] = useState('');
  const [desc, setDesc] = useState('');
  const [warning, setWarning] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  // Seed the editable fields only from a deliberate load or a fresh stage —
  // never from the 3s poll, which would fight the user's typing.
  const applyPub = useCallback((P, seed) => {
    setPub(P || null);
    if (seed && P) { setTitle(P.title || ''); setDesc(P.description || ''); }
  }, []);

  const loadPublish = useCallback(async () => {
    try {
      const r = await fetch(`/api/dub/${jobId}/publish`);
      if (r.status === 404) { setPub(null); }
      else {
        const d = await r.json();
        if (r.ok) applyPub(d.publish, true);
      }
    } catch (_) {}
    setLoaded(true);
  }, [jobId, applyPub]);

  const loadSecrets = useCallback(async () => {
    try {
      const r = await fetch('/api/secrets/status');
      if (r.ok) setSecrets(await r.json());
    } catch (_) {}
  }, []);

  useEffect(() => {
    if (expanded && !loaded) { loadPublish(); loadSecrets(); }
  }, [expanded, loaded, loadPublish, loadSecrets]);

  // While the server owns the upload, watch it.
  const inFlight = pub && (pub.status === 'approved' || pub.status === 'uploading');
  useEffect(() => {
    if (!expanded || !inFlight) return;
    const t = setInterval(async () => {
      try {
        const r = await fetch(`/api/dub/${jobId}/publish`);
        if (r.ok) { const d = await r.json(); setPub(d.publish || null); }
      } catch (_) {}
    }, 3000);
    return () => clearInterval(t);
  }, [expanded, inFlight, jobId]);

  const post = async (path, body) => {
    setBusy(true); setErr('');
    try {
      const r = await fetch(`/api/dub/${jobId}/publish/${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { setErr(d.error || d.detail || `HTTP ${r.status}`); return null; }
      return d;
    } catch (e) { setErr(String(e.message || e)); return null; }
    finally { setBusy(false); }
  };

  const stage = async () => {
    const d = await post('stage', { platform: 'vk' });
    if (d) { applyPub(d.publish, true); setWarning(d.warning || ''); }
  };
  const approve = async () => {
    const d = await post('approve', { title, description: desc });
    if (d) applyPub(d.publish, false);
  };
  const cancel = async () => {
    const d = await post('cancel');
    if (d) { applyPub(d.publish, false); setWarning(''); }
  };

  const saveToken = async () => {
    setBusy(true); setErr('');
    try {
      const r = await fetch('/api/secrets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ vk_access_token: tokenInput.trim() }),
      });
      const d = await r.json();
      if (!r.ok) setErr(d.error || `HTTP ${r.status}`);
      else { setSecrets(d.status || null); setTokenInput(''); }
    } catch (e) { setErr(String(e.message || e)); }
    finally { setBusy(false); }
  };

  if (!jobId) return null;
  const hasToken = !!(secrets && secrets.vk_access_token);
  const status = pub?.status;
  const dupMeta = pub && (DUP_VERDICT_META[pub.duplicate_verdict] || DUP_VERDICT_META.unchecked);
  const statusChip =
    status === 'uploaded' ? { c: 'var(--accent)', t: 'uploaded' } :
    status === 'failed'   ? { c: 'var(--err)',    t: 'failed' } :
    inFlight              ? { c: 'var(--accent)', t: status } :
    status === 'staged'   ? { c: 'var(--warn)',   t: 'awaiting approval' } :
    null;

  return (
    <div className="panel" style={{ padding: 16, width: '100%' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer' }}
           onClick={() => setExpanded(e => !e)}>
        <div className="caps">Publish</div>
        {statusChip && (
          <span className="mono" style={{ fontSize: 10.5, color: statusChip.c }}>{statusChip.t}</span>
        )}
        <div style={{ flex: 1 }}/>
        <span style={{ color: 'var(--ink-3)', fontSize: 11 }}>{expanded ? '▾' : '▸'}</span>
      </div>

      {expanded && !loaded && (
        <div style={{ color: 'var(--ink-3)', marginTop: 12, fontSize: 12 }}>Loading…</div>
      )}

      {expanded && loaded && (
        <div style={{ marginTop: 12, display: 'flex', flexDirection: 'column', gap: 10 }}>
          {err && (
            <div style={{ padding: '8px 10px', borderRadius: 6, fontSize: 11.5, color: 'var(--err)',
                          background: 'oklch(0.7 0.2 25 / 0.1)', border: '1px solid oklch(0.7 0.2 25 / 0.25)' }}>
              {err}
            </div>
          )}

          {/* Credentials gate — the token is write-only: posted once, then
              only its presence boolean ever comes back. */}
          {secrets && !hasToken && (
            <div style={{ padding: 12, background: 'var(--bg-2)', border: '1px solid var(--line)', borderRadius: 8 }}>
              <div className="caps" style={{ marginBottom: 6 }}>VK access token</div>
              <div style={{ fontSize: 11, color: 'var(--ink-3)', lineHeight: 1.55, marginBottom: 8 }}>
                Publishing needs a VK access token with the <span className="mono">video</span> scope
                (create one at vk.com → manage apps, or via an API token generator for your group).
                Stored locally, never shown again.
              </div>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                <input className="field" type="password" placeholder="vk1.a.…"
                       value={tokenInput} onChange={e => setTokenInput(e.target.value)}
                       style={{ flex: 1, minWidth: 200, maxWidth: 340 }}/>
                <button className="btn" onClick={saveToken} disabled={busy || !tokenInput.trim()}>
                  Save token
                </button>
              </div>
            </div>
          )}

          {/* Not staged yet (or cancelled): the one-button entry point. */}
          {(!pub || status === 'cancelled') && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
              <button className="btn btn-primary" onClick={stage} disabled={busy || !hasToken}>
                {busy ? 'Staging…' : 'Publish to VK'}
              </button>
              <span style={{ fontSize: 11, color: 'var(--ink-3)' }}>
                {status === 'cancelled'
                  ? 'Publish was cancelled — stage again to restart.'
                  : 'Stages the upload for review first — nothing is sent until you approve.'}
              </span>
            </div>
          )}

          {pub && status !== 'cancelled' && (
            <React.Fragment>
              {warning && (
                <div style={{ padding: '8px 10px', borderRadius: 6, fontSize: 11.5, color: 'var(--warn)',
                              background: 'oklch(0.78 0.15 60 / 0.08)', border: '1px solid oklch(0.78 0.15 60 / 0.3)' }}>
                  {warning}
                </div>
              )}

              {/* Duplicate check banner + the matches behind it. */}
              {dupMeta && status !== 'uploaded' && (
                <div style={{ padding: '9px 11px', borderRadius: 6, background: dupMeta.bg,
                              border: '1px solid ' + dupMeta.line }}>
                  <div style={{ fontSize: 11.5, color: dupMeta.color }}>{dupMeta.label}</div>
                  {(pub.duplicate_warnings || []).length > 0 && (
                    <div style={{ marginTop: 6, display: 'flex', flexDirection: 'column', gap: 3 }}>
                      {pub.duplicate_warnings.map((w, i) => (
                        <div key={i} style={{ display: 'flex', gap: 8, alignItems: 'baseline', fontSize: 11 }}>
                          {w.url ? (
                            <a href={w.url} target="_blank" rel="noreferrer" className="wrap-any"
                               style={{ color: 'var(--ink)', flex: 1, minWidth: 0 }}>{w.title || w.url}</a>
                          ) : (
                            <span className="wrap-any" style={{ color: 'var(--ink)', flex: 1, minWidth: 0 }}>{w.title}</span>
                          )}
                          <span className="mono" style={{ fontSize: 10, color: 'var(--ink-3)', flexShrink: 0 }}>
                            {w.duration != null ? fmtSec(w.duration) : '—'} · {dupScorePct(w.score)} match
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* Staged / failed: metadata is editable until it is approved. */}
              {(status === 'staged' || status === 'failed') && (
                <React.Fragment>
                  <Field label="Title">
                    <input className="field" value={title} onChange={e => setTitle(e.target.value)}/>
                  </Field>
                  <Field label="Description">
                    <textarea className="field" value={desc} onChange={e => setDesc(e.target.value)}
                              style={{ resize: 'vertical', minHeight: 72 }}/>
                  </Field>
                  {(pub.tags || []).length > 0 && (
                    <div>
                      <div className="caps" style={{ marginBottom: 5 }}>Tags</div>
                      <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
                        {pub.tags.map((t, i) => <span key={i} className="chip" style={{ fontSize: 10 }}>{t}</span>)}
                      </div>
                    </div>
                  )}
                  {status === 'failed' && (
                    <div style={{ padding: '8px 10px', borderRadius: 6, fontSize: 11.5,
                                  background: 'oklch(0.7 0.2 25 / 0.1)', border: '1px solid oklch(0.7 0.2 25 / 0.25)' }}>
                      <div style={{ color: 'var(--err)' }} className="wrap-any">{pub.error || 'Upload failed.'}</div>
                      <div style={{ color: 'var(--ink-3)', marginTop: 3, fontSize: 11 }}>Approve again to retry.</div>
                    </div>
                  )}
                  <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                    <button className="btn btn-primary" onClick={approve} disabled={busy}>
                      {busy ? 'Sending…' : 'Approve & upload'}
                    </button>
                    <button className="btn" onClick={cancel} disabled={busy}>Cancel</button>
                  </div>
                </React.Fragment>
              )}

              {inFlight && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 12, color: 'var(--ink-2)' }}>
                  <Spinner/>
                  {status === 'uploading' ? 'Uploading to VK…' : 'Approved — waiting for the uploader…'}
                </div>
              )}

              {status === 'uploaded' && (
                <div style={{ padding: '10px 12px', borderRadius: 6, background: 'var(--accent-dim)',
                              border: '1px solid var(--line-2)', fontSize: 12 }}>
                  <span style={{ color: 'var(--accent)' }}>✓ Uploaded</span>
                  {pub.url && (
                    <a href={pub.url} target="_blank" rel="noreferrer"
                       style={{ color: 'var(--accent)', marginLeft: 10 }} className="wrap-any">
                      {pub.url.replace(/^https?:\/\//, '')} ↗
                    </a>
                  )}
                  {pub.uploaded_at && (
                    <span className="mono" style={{ fontSize: 10, color: 'var(--ink-3)', marginLeft: 10 }}>
                      {fmtAge(pub.uploaded_at)}
                    </span>
                  )}
                </div>
              )}
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// PROCESSING VIEW (placeholder)
// ═══════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════
// AGENT FEED — home in concept 1a
// ═══════════════════════════════════════════════════════════════════
// One reverse-chronological stream of what the agent, a teammate, or the
// server just did. Three shapes, matching the design:
//
//   · a run card    — the tool calls one agent made, grouped
//   · a job card    — a dub, with its stage chips and live progress
//   · an event row  — a one-line system note
//
// Two things the design shows are absent on purpose rather than faked: the
// natural-language prompt behind a run (agents send tool calls, not the
// sentence that produced them) and per-job cost (the meter arrives with
// billing). Inventing either would put numbers on screen that mean nothing.

// Consecutive calls by the same actor inside this window read as one run.
const RUN_WINDOW_SEC = 300;

const groupFeed = (events, jobs, { groupRuns = true } = {}) => {
  const byId = new Map(jobs.map(j => [j.id, j]));
  const jobCards = new Map();
  const out = [];
  for (const ev of events) {
    const prev = out[out.length - 1];
    if (ev.kind === 'tool_call') {
      if (!groupRuns) { out.push({ type: 'call', key: 'c' + ev.id, ev, ts: ev.ts }); continue; }
      if (prev && prev.type === 'run' && prev.actor === ev.actor
          && prev.lastTs - ev.ts < RUN_WINDOW_SEC) {
        prev.calls.push(ev);
        prev.lastTs = ev.ts;
        continue;
      }
      out.push({ type: 'run', key: 'run' + ev.id, actor: ev.actor,
                 ts: ev.ts, lastTs: ev.ts, calls: [ev] });
      continue;
    }
    if (ev.kind === 'job') {
      // One card per job, and it must merge transitions that are NOT adjacent
      // in the stream: the middleware records a tool call only once its
      // response is on the way out, by which time the job runner has often
      // already emitted its next transition, so a job's events routinely
      // arrive with a tool call wedged between them. Collapsing only
      // neighbours therefore showed the same job twice.
      const seen = jobCards.get(ev.job_id);
      if (seen) { seen.transitions.push(ev); continue; }
      const card = { type: 'job', key: 'job' + ev.job_id, jobId: ev.job_id,
                     ts: ev.ts, job: byId.get(ev.job_id) || null,
                     title: ev.title, transitions: [ev] };
      jobCards.set(ev.job_id, card);
      out.push(card);
      continue;
    }
    out.push({ type: 'event', key: 'ev' + ev.id, ev, ts: ev.ts });
  }
  return out;
};

function FeedFilter({ value, onChange }) {
  const opts = [['all', 'All'], ['run', 'Runs'], ['tool_call', 'Tool calls'],
                ['system', 'System']];
  return (
    <div style={{ display: 'flex', gap: 4 }}>
      {opts.map(([id, label]) => (
        <button key={id} onClick={() => onChange(id)} className="mono" style={{
          fontSize: 10.5, fontWeight: 500, padding: '4px 10px', borderRadius: 5,
          color: value === id ? 'var(--bg)' : 'var(--ink-2)',
          background: value === id ? 'var(--accent)' : 'transparent',
          border: '1px solid ' + (value === id ? 'var(--accent)' : 'var(--line)'),
        }}>{label}</button>
      ))}
    </div>
  );
}

// The design renders the pipeline as a row of chips: done ✓, running ●,
// pending ○. Built from the 6-stage map the rest of the app already uses.
function FeedStageChips({ job, transitions }) {
  const done = job.status === 'complete';
  // stageForStatus() only knows about live statuses, so an errored or
  // cancelled job maps to -1 and every chip drew as pending — hiding how far
  // it actually got. The transitions we recorded name the last live stage.
  let idx = stageForStatus(job.status);
  if (idx < 0 && !done) {
    idx = (transitions || []).reduce(
      (best, t) => Math.max(best, stageForStatus(t.status)), -1);
  }
  return (
    <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
      {STAGES.map((s, i) => {
        const stalled = job.status === 'error' || job.status === 'cancelled';
        const state = done || i < idx ? 'done'
                    : (i === idx ? (stalled ? 'stalled' : 'live') : 'pending');
        const live = state === 'live' && ACTIVE_STATUSES.has(job.status);
        return (
          <span key={s.id} className="mono" style={{
            fontSize: 10, fontWeight: 500, padding: '3px 8px', borderRadius: 4,
            color: state === 'live' ? 'var(--bg)'
                 : state === 'done' ? 'var(--accent)'
                 : state === 'stalled' ? 'var(--err)' : 'var(--ink-3)',
            background: state === 'live' ? 'var(--accent)' : 'transparent',
            border: '1px solid ' + (state === 'done' ? 'var(--accent-dim)'
                                  : state === 'live' ? 'var(--accent)'
                                  : state === 'stalled' ? 'var(--err)' : 'var(--line)'),
            animation: live ? 'pulse 1.4s infinite' : 'none',
          }}>
            {s.label.toLowerCase()} {state === 'done' ? '✓' : state === 'live' ? '●'
                                   : state === 'stalled' ? '✕' : '○'}
          </span>
        );
      })}
    </div>
  );
}

function FeedJobCard({ item, onOpen }) {
  const job = item.job;
  // A job deleted since its events were recorded still has a feed entry.
  if (!job) {
    return (
      <div className="panel" style={{ padding: '12px 16px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
          <span className="dot" style={{ background: 'var(--ink-4)' }}/>
          <span style={{ fontSize: 12.5, color: 'var(--ink-3)' }}>
            {item.title || item.jobId} · no longer available
          </span>
          <span className="mono" style={{ marginLeft: 'auto', fontSize: 10.5,
                                          color: 'var(--ink-4)' }}>{fmtAge(item.ts)}</span>
        </div>
      </div>
    );
  }
  const meta = STATUS_META[job.status] || { color: 'var(--ink-3)', label: job.status };
  const active = ACTIVE_STATUSES.has(job.status);
  const pct = Math.max(0, Math.min(100, job.progress ?? 0));
  return (
    <div className="panel" style={{
      padding: '16px 18px', display: 'flex', flexDirection: 'column', gap: 12,
      borderColor: active ? 'var(--line-2)' : 'var(--line)',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 9, flexWrap: 'wrap' }}>
        <span className="dot" style={{
          width: 7, height: 7, background: meta.color,
          boxShadow: active ? '0 0 6px var(--accent-glow)' : 'none',
          animation: active ? 'pulse 1.4s infinite' : 'none',
        }}/>
        <button onClick={() => onOpen(job)} className="wrap-any" style={{
          fontSize: 12.5, fontWeight: 600, color: 'var(--ink)', textAlign: 'left',
        }}>{job.title || job.source_label || job.source || job.id}</button>
        <span className="mono" style={{ fontSize: 10, color: 'var(--ink-3)' }}>{job.id}</span>
        <span className="mono" style={{ marginLeft: 'auto', fontSize: 10.5,
                                        color: 'var(--ink-3)' }}>
          {meta.label} · {fmtAge(item.ts)}
        </span>
      </div>

      <FeedStageChips job={job} transitions={item.transitions}/>

      {job.status === 'error' && <JobErrorPanel job={job} compact/>}

      {active && (
        <div style={{ height: 4, background: 'var(--line)', borderRadius: 2,
                      overflow: 'hidden' }}>
          <div style={{ width: pct + '%', height: '100%', background: 'var(--accent)',
                        transition: 'width 0.4s' }}/>
        </div>
      )}

      <div className="mono" style={{ display: 'flex', gap: 14, flexWrap: 'wrap',
                                     fontSize: 10.5, color: 'var(--ink-3)' }}>
        {job.target_lang && <span style={{ color: 'var(--ink-2)' }}>{job.target_lang}</span>}
        {job.duration ? <span>{fmtSec(job.duration)} source</span> : null}
        {active && <span>{pct}%</span>}
        {job.step_detail && (
          <span className="wrap-any" style={{ color: 'var(--ink-3)' }}>{job.step_detail}</span>
        )}
      </div>
    </div>
  );
}

function FeedRunCard({ item }) {
  // Repeated polling of the same tool is one line with a count, the way the
  // design shows "get_status ×4".
  const rolled = [];
  for (const c of item.calls) {
    const last = rolled[rolled.length - 1];
    if (last && last.tool === c.tool) { last.n += 1; continue; }
    rolled.push({ tool: c.tool, n: 1, status: c.status, ms: c.ms, id: c.id });
  }
  const failed = item.calls.some(c => c.status && c.status >= 400);
  return (
    <div className="panel" style={{ padding: '14px 18px', display: 'flex',
                                    flexDirection: 'column', gap: 10 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 9, flexWrap: 'wrap' }}>
        <span className="dot" style={{ width: 7, height: 7,
                                       background: failed ? 'var(--err)' : 'var(--accent)' }}/>
        <span style={{ fontSize: 12.5, fontWeight: 600 }}>
          {item.actor.startsWith('mcp/')
            ? `Agent run · ${item.actor.slice(4)} via MCP`
            : `${item.actor} run`}
        </span>
        <span className="mono" style={{ fontSize: 10, color: 'var(--ink-3)' }}>
          {item.calls.length} call{item.calls.length === 1 ? '' : 's'}
        </span>
        <span className="mono" style={{ marginLeft: 'auto', fontSize: 10.5,
                                        color: 'var(--ink-3)' }}>{fmtAge(item.lastTs)}</span>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
        {rolled.map(c => (
          <div key={c.id} className="mono" style={{ display: 'flex', gap: 8, fontSize: 11 }}>
            <span style={{ color: 'var(--ink-3)' }}>→</span>
            <span style={{ color: 'var(--accent)' }}>gochidubb.{c.tool}</span>
            {c.n > 1 && <span style={{ color: 'var(--ink-3)' }}>×{c.n}</span>}
            <span style={{ marginLeft: 'auto',
                           color: c.status >= 400 ? 'var(--err)' : 'var(--ink-3)' }}>
              ⇒ {c.status}{c.ms != null ? ` · ${c.ms}ms` : ''}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

function FeedCallRow({ ev }) {
  const bad = ev.status && ev.status >= 400;
  return (
    <div className="mono" style={{
      display: 'flex', alignItems: 'baseline', gap: 10, padding: '8px 4px',
      borderTop: '1px solid var(--bg-2)', fontSize: 11,
    }}>
      <span style={{ color: 'var(--ink-4)' }}>{fmtClock(ev.ts)}</span>
      <span style={{ color: 'var(--accent)' }}>gochidubb.{ev.tool}</span>
      <span style={{ color: 'var(--ink-3)' }}>{ev.actor}</span>
      <span style={{ marginLeft: 'auto', color: bad ? 'var(--err)' : 'var(--ink-3)' }}>
        ⇒ {ev.status}{ev.ms != null ? ` · ${ev.ms}ms` : ''}
      </span>
    </div>
  );
}

function FeedEventRow({ ev }) {
  const color = ev.severity === 'error' ? 'var(--err)'
              : ev.severity === 'warn' ? 'var(--warn)' : 'var(--ink-3)';
  return (
    <div className="mono" style={{
      display: 'flex', alignItems: 'baseline', gap: 10, padding: '9px 4px',
      borderTop: '1px solid var(--bg-2)', fontSize: 11, color,
    }}>
      <span style={{ color: 'var(--ink-4)' }}>{fmtClock(ev.ts)}</span>
      <span className="wrap-any">{ev.title}</span>
      <span style={{ marginLeft: 'auto', color: 'var(--ink-4)' }}>{fmtAge(ev.ts)}</span>
    </div>
  );
}

function FeedSideTiles({ jobs, system, events }) {
  const queued = jobs.filter(j => j.status === 'queued' || j.status === 'scheduled').length;
  const running = jobs.filter(j => ACTIVE_STATUSES.has(j.status)).length;
  const acc = system?.accelerator;
  const res = system?.resources || {};
  // Minutes of source media dubbed today, from the jobs themselves. Real
  // figure; the money it would cost arrives with billing.
  const dayAgo = Date.now() / 1000 - 86400;
  const minsToday = jobs
    .filter(j => (j.created || 0) > dayAgo && j.duration)
    .reduce((a, j) => a + j.duration, 0) / 60;

  // Which agents have called recently, newest first.
  const clients = [];
  for (const e of events) {
    if (e.kind !== 'tool_call' || !e.actor) continue;
    if (!clients.some(c => c.actor === e.actor)) clients.push({ actor: e.actor, ts: e.ts });
  }

  const Tile = ({ label, children }) => (
    <div className="panel" style={{ padding: '13px 14px', background: 'var(--bg-1)' }}>
      <div className="caps" style={{ marginBottom: 10 }}>{label}</div>
      {children}
    </div>
  );
  const Row = ({ k, v, tint }) => (
    <div className="mono" style={{ display: 'flex', justifyContent: 'space-between',
                                   fontSize: 11, color: 'var(--ink-2)', padding: '4px 0' }}>
      <span>{k}</span><span style={{ color: tint || 'var(--ink)' }}>{v}</span>
    </div>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <Tile label="Live">
        <Row k="queue depth" v={`${queued} job${queued === 1 ? '' : 's'}`}/>
        <Row k="running" v={running} tint={running ? 'var(--accent)' : 'var(--ink)'}/>
        {acc && <Row k={acc.backend || 'accelerator'}
                     v={acc.ok ? 'ready' : 'CPU only'}
                     tint={acc.ok ? 'var(--accent)' : 'var(--warn)'}/>}
        {res.ram_percent != null && (
          <>
            <Row k="RAM" v={`${Math.round(res.ram_percent)}%`}/>
            <div style={{ height: 3, background: 'var(--line)', borderRadius: 2,
                          overflow: 'hidden', margin: '2px 0 6px' }}>
              <div style={{ width: Math.min(100, res.ram_percent) + '%', height: '100%',
                            background: 'var(--accent)' }}/>
            </div>
          </>
        )}
        <Row k="minutes · 24h" v={minsToday.toFixed(0)}/>
      </Tile>

      <Tile label="MCP">
        {clients.length === 0 ? (
          <div className="mono" style={{ fontSize: 10.5, color: 'var(--ink-3)',
                                         lineHeight: 1.6 }}>
            No agent has called yet. Point an MCP client at this server and its
            calls appear here.
          </div>
        ) : clients.slice(0, 6).map(c => (
          <Row key={c.actor} k={c.actor.replace(/^mcp\//, '')} v={fmtAge(c.ts)}
               tint="var(--ink-3)"/>
        ))}
      </Tile>
    </div>
  );
}

function AgentFeedView({ jobs, system, narrow, onOpenJob, onSwitchToHome }) {
  const [filter, setFilter] = useState('all');
  const [events, setEvents] = useState([]);
  const [loaded, setLoaded] = useState(false);

  // Same cadence logic as the jobs poll: brisk while something is running,
  // relaxed when the box is idle.
  const busy = jobs.some(j => ACTIVE_STATUSES.has(j.status));
  useEffect(() => {
    let stopped = false;
    const kinds = filter === 'all' ? '' : (filter === 'run' ? 'tool_call' : filter);
    const pull = async () => {
      try {
        const r = await fetch('/api/activity?limit=120'
                              + (kinds ? '&kinds=' + encodeURIComponent(kinds) : ''));
        if (!r.ok) return;
        const d = await r.json();
        if (!stopped) { setEvents(d.events || []); setLoaded(true); }
      } catch (_) {}
    };
    pull();
    const t = setInterval(pull, busy ? 2000 : 8000);
    return () => { stopped = true; clearInterval(t); };
  }, [filter, busy]);

  const items = groupFeed(events, jobs, { groupRuns: filter !== 'tool_call' })
    .filter(it => {
      if (filter === 'all') return true;
      if (filter === 'run') return it.type === 'run';
      if (filter === 'tool_call') return it.type === 'call';
      if (filter === 'system') return it.type === 'event';
      return true;
    });

  return (
    <div className="scroll" style={{ flex: 1, minHeight: 0 }}>
      <div style={{ display: 'flex', gap: 'var(--gutter)', padding: '22px var(--gutter)',
                    alignItems: 'flex-start', flexDirection: narrow ? 'column' : 'row' }}>
        <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column',
                      gap: 14 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10,
                        flexWrap: 'wrap' }}>
            <div className="serif" style={{ fontSize: 15 }}>Agent activity</div>
            <div style={{ marginLeft: 'auto' }}>
              <FeedFilter value={filter} onChange={setFilter}/>
            </div>
          </div>

          {!loaded ? (
            <div className="mono" style={{ fontSize: 11, color: 'var(--ink-3)' }}>
              Loading activity…
            </div>
          ) : items.length === 0 ? (
            <div className="panel" style={{ padding: '26px 22px', display: 'flex',
                                            flexDirection: 'column', gap: 10 }}>
              <div style={{ fontSize: 13, fontWeight: 600 }}>Nothing has happened yet</div>
              <div style={{ fontSize: 12.5, color: 'var(--ink-2)', lineHeight: 1.6,
                            maxWidth: 460 }}>
                This feed fills up as dubs run and as agents call the MCP tools.
                Jobs you start here appear alongside anything an agent does, so
                both show up in one place.
              </div>
              <div>
                <button className="btn btn-primary" onClick={onSwitchToHome}>
                  Start a dub
                </button>
              </div>
            </div>
          ) : items.map(it =>
            it.type === 'run' ? <FeedRunCard key={it.key} item={it}/>
            : it.type === 'job' ? <FeedJobCard key={it.key} item={it} onOpen={onOpenJob}/>
            : it.type === 'call' ? <FeedCallRow key={it.key} ev={it.ev}/>
            : <FeedEventRow key={it.key} ev={it.ev}/>
          )}
        </div>

        <div style={{ width: narrow ? '100%' : 300, flexShrink: 0 }}>
          <FeedSideTiles jobs={jobs} system={system} events={events}/>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// JOB ERROR PANEL — the one way a failed job explains itself.
// Renders the structured `last_error` the server records at the moment of
// failure: stage, exception type, traceback tail, and the log-ring window
// covering exactly the failed stage's lines ("logs at failure →" jumps to
// System → Logs pre-filtered to that window). Falls back to the legacy
// flat `error` string for jobs recorded before the structure existed.
// ═══════════════════════════════════════════════════════════════════
function _openLogFocus(focus) {
  try { localStorage.setItem('log_focus', JSON.stringify(focus)); } catch (_) {}
  // App switches the view, SystemView switches its tab, LogsTab re-reads
  // the focus — all off this one event, so no prop-threading through the
  // whole view tree just to open a filtered log.
  window.dispatchEvent(new CustomEvent('gcd:open-logs'));
}

// ── Download rescue panel ──
// Rendered inside JobErrorPanel when the download stage failed and the
// server attached a `download_hint`: shows why yt-dlp failed, the exact
// commands to run by hand, and a drop-zone that uploads the manually
// downloaded file to /attach_source so the job resumes from 'extract'.
function DownloadRescuePanel({ job }) {
  const hint = job.download_hint;
  const [uploading, setUploading] = useState(false);
  const [err, setErr] = useState('');
  const [drag, setDrag] = useState(false);
  const inputRef = useRef(null);
  if (!hint) return null;

  const upload = async (f) => {
    if (!f || uploading) return;
    setErr('');
    setUploading(true);
    try {
      const fd = new FormData();
      fd.append('video', f);
      const r = await fetch(`/api/job/${job.id}/attach_source`, { method: 'POST', body: fd });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) setErr(d.error || `Upload failed (HTTP ${r.status})`);
      // On success there is nothing to do here — polling sees the job's
      // status flip to 'queued' and the error panel disappears with it.
    } catch (e) {
      setErr(String(e.message || e));
    } finally {
      setUploading(false);
    }
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8, paddingTop: 8,
                  borderTop: '1px solid oklch(0.7 0.2 25 / 0.2)' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
        <span className="mono" style={{ fontSize: 10, fontWeight: 600, padding: '2px 7px',
                      borderRadius: 4, color: 'var(--ink-2)',
                      border: '1px solid var(--line)' }}>
          {hint.failure_class}
        </span>
        <span style={{ fontSize: 12, lineHeight: 1.45, flex: 1, minWidth: 200 }}>{hint.summary}</span>
      </div>
      {hint.detail && (
        <div className="mono wrap-any" style={{ fontSize: 10.5, color: 'var(--ink-3)' }}>{hint.detail}</div>
      )}
      {(hint.commands || []).map((cmd, i) => (
        <div key={i} style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div className="caps">{cmd.label}</div>
            <div style={{ flex: 1 }}/>
            <CopyButton text={cmd.command}/>
          </div>
          <pre className="mono wrap-any" style={{ margin: 0, fontSize: 10.5, lineHeight: 1.5,
                      whiteSpace: 'pre-wrap', wordBreak: 'break-word',
                      background: 'var(--bg-1)', border: '1px solid var(--line)',
                      borderRadius: 5, padding: '6px 8px' }}>{cmd.command}</pre>
        </div>
      ))}
      <div
        className={'dropzone' + (drag ? ' dragging' : '')}
        onClick={() => !uploading && inputRef.current?.click()}
        onDragOver={e => { e.preventDefault(); if (!uploading) setDrag(true); }}
        onDragLeave={() => setDrag(false)}
        onDrop={e => {
          e.preventDefault(); setDrag(false);
          if (!uploading && e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
        }}
        style={uploading ? { opacity: 0.6, pointerEvents: 'none' } : undefined}
      >
        <input ref={inputRef} type="file" accept="video/*" style={{ display: 'none' }}
          onChange={e => { upload(e.target.files[0]); e.target.value = ''; }}/>
        <div style={{ fontSize: 12.5, color: 'var(--ink)' }}>
          {uploading ? 'Uploading & validating…' : '…or drop the downloaded video here to resume this job'}
        </div>
      </div>
      {err && (
        <div className="wrap-any" style={{ color: 'var(--err)', fontSize: 11.5 }}>{err}</div>
      )}
    </div>
  );
}

function JobErrorPanel({ job, compact }) {
  const [showTb, setShowTb] = useState(false);
  const [showRescue, setShowRescue] = useState(!compact);
  const [reporting, setReporting] = useState(false);
  const le = job.last_error;
  const msg = (le && le.message) || job.error;
  if (!msg) return null;
  const history = (job.error_history || []).length;
  const canFocus = !!(le && le.log_to);
  const rescue = !!(job.download_hint
    && ((le && le.stage === 'download') || job.failed_stage === 'download'));
  return (
    <div style={{ padding: compact ? '8px 10px' : '10px 12px', borderRadius: 6,
                  background: 'oklch(0.7 0.2 25 / 0.08)',
                  border: '1px solid oklch(0.7 0.2 25 / 0.28)',
                  display: 'flex', flexDirection: 'column', gap: 6 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
        {le?.stage && (
          <span className="mono" style={{ fontSize: 10, fontWeight: 600, padding: '2px 7px',
                        borderRadius: 4, color: 'var(--err)',
                        border: '1px solid oklch(0.7 0.2 25 / 0.4)' }}>
            {(le.stage_label || le.stage).toLowerCase()} ✕
          </span>
        )}
        {le?.type && (
          <span className="mono" style={{ fontSize: 10.5, color: 'var(--ink-3)' }}>{le.type}</span>
        )}
        {le?.ts && (
          <span className="mono" style={{ fontSize: 10, color: 'var(--ink-4)' }}>{fmtClock(le.ts)}</span>
        )}
        {history > 1 && (
          <span className="mono" title="Earlier failures of this job, kept across retries"
                style={{ fontSize: 10, color: 'var(--ink-4)' }}>
            ×{history} attempts
          </span>
        )}
        <div style={{ flex: 1 }}/>
        {rescue && compact && (
          <button className="mono" onClick={() => setShowRescue(s => !s)}
                  style={{ fontSize: 10.5, color: 'var(--ink-3)' }}>
            {showRescue ? 'hide rescue' : 'rescue options'}
          </button>
        )}
        {le?.traceback_tail && (
          <button className="mono" onClick={() => setShowTb(s => !s)}
                  style={{ fontSize: 10.5, color: 'var(--ink-3)' }}>
            {showTb ? 'hide trace' : 'trace'}
          </button>
        )}
        {canFocus && (
          <button className="mono"
                  onClick={() => _openLogFocus({ from: le.log_from || 0, to: le.log_to,
                                                 job: job.id, stage: le.stage_label || le.stage })}
                  style={{ fontSize: 10.5, color: 'var(--err)' }}>
            logs at failure →
          </button>
        )}
        <button className="mono" onClick={() => setReporting(s => !s)}
                style={{ fontSize: 10.5, color: 'var(--ink-3)' }}>
          {reporting ? 'hide report' : 'report this →'}
        </button>
      </div>
      <div className="wrap-any" style={{ color: 'var(--err)', fontSize: 12, lineHeight: 1.45 }}>{msg}</div>
      {showTb && le?.traceback_tail && (
        <pre className="mono" style={{ margin: 0, fontSize: 10, lineHeight: 1.5, color: 'var(--ink-2)',
                    whiteSpace: 'pre-wrap', wordBreak: 'break-word', maxHeight: 260, overflow: 'auto',
                    background: 'var(--bg-1)', border: '1px solid var(--line)',
                    borderRadius: 5, padding: 8 }}>{le.traceback_tail}</pre>
      )}
      {rescue && showRescue && <DownloadRescuePanel job={job}/>}
      {reporting && <BugReportFlow jobId={job.id}/>}
    </div>
  );
}

// ── Bug report flow ─────────────────────────────────────────────────
// Rendered inside JobErrorPanel by "report this →". GET /api/bugreport/{id}
// previews the redacted report; "Send to Linear" POSTs it (server-side the
// signature dedupes: create issue or comment on the existing one). The
// Linear key is write-only — saved via /api/secrets like the VK token, only
// a presence boolean ever comes back.
function BugReportFlow({ jobId }) {
  const [data, setData] = useState(null);
  const [err, setErr] = useState('');
  const [note, setNote] = useState('');
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(null);
  const [apiKey, setApiKey] = useState('');
  const [teamId, setTeamId] = useState('');
  const [projectId, setProjectId] = useState('');
  const [saving, setSaving] = useState(false);

  const refetch = async () => {
    try {
      const r = await fetch(`/api/bugreport/${jobId}`);
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { setErr(d.error || `HTTP ${r.status}`); return; }
      setData(d); setErr('');
    } catch (e) { setErr(String(e.message || e)); }
  };
  useEffect(() => { refetch(); }, [jobId]);

  const send = async () => {
    setSending(true); setErr('');
    try {
      const r = await fetch(`/api/bugreport/${jobId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ note: note.trim() }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { setErr(d.error || `HTTP ${r.status}`); return; }
      setSent(d);
    } catch (e) { setErr(String(e.message || e)); }
    finally { setSending(false); }
  };

  const saveLinear = async () => {
    setSaving(true); setErr('');
    try {
      const r = await fetch('/api/secrets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ linear_api_key: apiKey.trim(),
                               linear_team_id: teamId.trim(),
                               linear_project_id: projectId.trim() }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { setErr(d.error || `HTTP ${r.status}`); return; }
      setApiKey('');
      await refetch();       // flips linear_configured
    } catch (e) { setErr(String(e.message || e)); }
    finally { setSaving(false); }
  };

  const report = data && data.report;
  const le = (report && report.last_error) || {};
  const nLogs = ((report && report.logs) || []).length;
  const mailtoHref = (() => {
    if (!report) return '';
    const subject = `[gochidubb] ${le.stage || 'error'}: ${(le.message || '').slice(0, 70)}`;
    const logLines = (report.logs || []).slice(0, 10)
      .map(l => `[${l.level}] ${l.message}`).join('\n');
    const body = [
      le.message || '', '',
      `signature: ${data.signature || ''}`,
      `stage: ${le.stage || ''}`,
      `job: ${jobId}`, '',
      logLines,
    ].join('\n').slice(0, 1500);
    return `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  })();

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8, paddingTop: 8,
                  borderTop: '1px dashed oklch(0.7 0.2 25 / 0.28)' }}>
      {!data && !err && (
        <div className="mono" style={{ fontSize: 10.5, color: 'var(--ink-3)' }}>Preparing report…</div>
      )}
      {report && (
        <div className="mono" style={{ fontSize: 10.5, color: 'var(--ink-3)' }}>
          sig {data.signature || '—'} · {(le.stage_label || le.stage || 'error').toLowerCase()} · {nLogs} log lines attached
        </div>
      )}
      {err && (
        <div style={{ padding: '6px 8px', borderRadius: 5, fontSize: 11, color: 'var(--err)',
                      background: 'oklch(0.7 0.2 25 / 0.1)', border: '1px solid oklch(0.7 0.2 25 / 0.25)' }}>
          {err}
        </div>
      )}
      {sent ? (
        <a className="mono" href={sent.url || '#'} target="_blank" rel="noreferrer"
           style={{ fontSize: 11.5, color: 'var(--accent)' }}>
          {sent.action === 'commented'
            ? '✓ added to existing issue →'
            : `✓ created ${sent.issue || 'issue'} →`}
        </a>
      ) : report && (
        <>
          <input className="field" placeholder="What were you doing? (optional)"
                 value={note} onChange={e => setNote(e.target.value)}
                 style={{ fontSize: 11.5, maxWidth: 420 }}/>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
            {data.linear_configured && (
              <button className="btn btn-primary" onClick={send} disabled={sending}
                      style={{ fontSize: 11, padding: '5px 12px' }}>
                {sending ? 'Sending…' : 'Send to Linear'}
              </button>
            )}
            <CopyButton text={JSON.stringify(report, null, 2)} label="Copy report"/>
            <a className="mono" href={mailtoHref}
               style={{ fontSize: 10.5, color: 'var(--ink-3)' }}>mail it →</a>
          </div>
          {!data.linear_configured && (
            <div style={{ padding: 10, background: 'var(--bg-2)',
                          border: '1px solid var(--line)', borderRadius: 8 }}>
              <div className="caps" style={{ marginBottom: 6 }}>Linear credentials</div>
              <div style={{ fontSize: 11, color: 'var(--ink-3)', lineHeight: 1.55, marginBottom: 8 }}>
                Reports go straight to your Linear workspace (create a personal API key at
                linear.app → Settings → Security &amp; access). Stored locally, never shown again.
              </div>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                <input className="field" type="password" placeholder="lin_api_…"
                       value={apiKey} onChange={e => setApiKey(e.target.value)}
                       style={{ flex: 1, minWidth: 160, maxWidth: 260 }}/>
                <input className="field" placeholder="team id"
                       value={teamId} onChange={e => setTeamId(e.target.value)}
                       style={{ width: 130 }}/>
                <input className="field" placeholder="project id (optional)"
                       value={projectId} onChange={e => setProjectId(e.target.value)}
                       style={{ width: 160 }}/>
                <button className="btn" onClick={saveLinear}
                        disabled={saving || !apiKey.trim() || !teamId.trim()}>
                  {saving ? 'Saving…' : 'Save'}
                </button>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}
