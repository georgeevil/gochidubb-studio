const fmtSec = (s) => {
  if (!s && s !== 0) return '—';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.floor(s % 60);
  if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
  return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
};

const fmtAge = (ts) => {
  if (!ts) return '';
  const now = Date.now() / 1000;
  const d = now - ts;
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d / 60) + 'm ago';
  if (d < 86400) return Math.floor(d / 3600) + 'h ago';
  if (d < 7 * 86400) return Math.floor(d / 86400) + 'd ago';
  const dt = new Date(ts * 1000);
  return dt.toLocaleDateString();
};

// Abbreviated view counts for the Discover tab — trending numbers span
// 5 orders of magnitude, so "1.8B" reads where "1,791,203,554" doesn't.
const fmtViews = (n) => {
  if (n === null || n === undefined) return '—';
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'K';
  return String(n);
};

// Keep in sync with the @media block in the stylesheet above — the CSS

const NARROW_QUERY = '(max-width: 860px)';

function useMediaQuery(query) {
  const [matches, setMatches] = useState(() => {
    try { return window.matchMedia(query).matches; } catch (_) { return false; }
  });
  useEffect(() => {
    let mq;
    try { mq = window.matchMedia(query); } catch (_) { return; }
    const on = (e) => setMatches(e.matches);
    setMatches(mq.matches);
    // addListener is the pre-Safari-14 spelling; phones are exactly where the
    // old API still shows up.
    if (mq.addEventListener) mq.addEventListener('change', on);
    else if (mq.addListener) mq.addListener(on);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener('change', on);
      else if (mq.removeListener) mq.removeListener(on);
    };
  }, [query]);
  return matches;
}

const useIsNarrow = () => useMediaQuery(NARROW_QUERY);

// ── ⌘K command parsing ───────────────────────────────────────────────
// Deliberately narrow: a source, some target languages, and which of the four
// run modes was asked for. It never starts a job on its own — a dub costs real
// GPU minutes and is awkward to undo, so a parsed command pre-fills New dub
// and the human presses Start. Anything it cannot read confidently is reported
// rather than guessed at.
const CMD_MODE_WORDS = [
  [/\b(showcase|reel|stitch(ed)?)\b/i, 'showcase'],
  [/\b(quick ?test|compare|side.by.side)\b/i, 'quick'],
  [/\bbatch\b/i, 'batch'],
];

// Longest names first so "Chinese (Traditional)" wins over "Chinese".
const _LANG_MATCHERS = LANGS
  .filter(l => l.c !== 'auto')
  .map(l => ({ code: l.c, name: l.n.toLowerCase() }))
  .sort((a, b) => b.name.length - a.name.length);

function parseCommand(text) {
  const raw = (text || '').trim();
  if (!raw) return null;
  const out = { text: raw, source: '', langs: [], mode: null, understood: [] };

  const url = raw.match(/https?:\/\/\S+/i);
  if (url) {
    out.source = url[0].replace(/[.,;]+$/, '');
    out.understood.push('source');
  }

  for (const [re, mode] of CMD_MODE_WORDS) {
    if (re.test(raw)) { out.mode = mode; out.understood.push('mode'); break; }
  }

  // Match language names first, then bare two-letter codes — but only codes
  // that appear as their own word, so the "es" in "these" is not Spanish.
  let hay = ' ' + raw.toLowerCase().replace(/[,/]+/g, ' ') + ' ';
  for (const l of _LANG_MATCHERS) {
    if (hay.includes(' ' + l.name + ' ')) {
      if (!out.langs.includes(l.code)) out.langs.push(l.code);
      hay = hay.split(' ' + l.name + ' ').join(' ');
    }
  }
  for (const l of _LANG_MATCHERS) {
    const re = new RegExp('(^|\\s)' + l.code + '(\\s|$)');
    if (re.test(hay) && !out.langs.includes(l.code)) out.langs.push(l.code);
  }
  if (out.langs.length) out.understood.push('languages');

  return out;
}

};

    if (v === null) return fallback;
    if (v === 'true') return true;
    if (v === 'false') return false;
    return v;
  } catch (_) { return fallback; }
};
const _lsSet = (key, v) => {
  try { localStorage.setItem('gochidubb_pref_' + key, String(v)); } catch (_) {}
};

// Creator mode and Pro mode are two surfaces on one account — same jobs, same
// meter, no second login. Record the choice so GET / lands here next time,
// then go. Navigation is not conditional on the save: a failed write means the
// preference doesn't stick, which is recoverable; a button that does nothing
// is not. /creator and /pro are both unconditional, so either address always
// works even if the preference is wrong.
const switchUiMode = async (mode) => {
  try {
    const body = new FormData();
    body.append('prefs', JSON.stringify({ ui_mode: mode }));
    await fetch('/api/preferences', { method: 'POST', body });
  } catch (_) {}
  window.location.href = mode === 'creator' ? '/creator' : '/pro';
};

// SPHERE COMPONENT (simplified)
// ═══════════════════════════════════════════════════════════════════
function mountSphere(el, opts) {
  const { variant = 'idle', size = 220 } = opts || {};
  if (!el || typeof THREE === 'undefined') {
    el.innerHTML = `<div style="width:${size}px;height:${size}px;border-radius:50%;
      border:1px solid var(--line-2);background:radial-gradient(circle at 30% 30%,
      var(--bg-2),var(--bg) 70%);"></div>`;
    return () => { el.innerHTML = ''; };
  }
  // Concept-1a palette: a near-black body that only reveals itself at the
  // rim — idle keeps the rim in ink with a whisper of accent, live goes
  // full #c8f542 with the same 1.4s breath as every other live element.
  const palette = variant === 'live'
    ? { core: 0x1a2005, rim: 0xc8f542, mid: 0x86a532, breath: 4.5, dots: 0.55 }
    : { core: 0x0e0e11, rim: 0xc8f542, mid: 0x5e5e67, breath: 2.2, dots: 0.28 };

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  camera.position.set(0, 0, 5.2);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.setSize(size, size);
  el.appendChild(renderer.domElement);

  const geo = new THREE.IcosahedronGeometry(1.4, 4);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uCore: { value: new THREE.Color(palette.core) },
      uMid: { value: new THREE.Color(palette.mid) },
      uRim: { value: new THREE.Color(palette.rim) },
    },
    vertexShader: `
      varying vec3 vNormal; varying vec3 vPos;
      uniform float uTime;
      float noise(vec3 p) {
        return sin(p.x*2.0+uTime*0.7)*0.5 + cos(p.y*1.7+uTime*0.5)*0.5 + sin(p.z*2.3+uTime*0.6)*0.3;
      }
      void main() {
        vNormal = normal; vPos = position;
        float n = noise(position*0.8) * 0.09;
        vec3 d = position + normal * n;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(d, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vNormal; varying vec3 vPos;
      uniform vec3 uCore; uniform vec3 uMid; uniform vec3 uRim; uniform float uTime;
      void main() {
        vec3 view = normalize(cameraPosition - vPos);
        float fres = 1.0 - max(dot(normalize(vNormal), view), 0.0);
        // Two-stage rim: a wide soft ink falloff, then a tight accent edge —
        // the body stays near-black so only the silhouette carries color.
        float mid = pow(fres, 1.8);
        float edge = pow(fres, 4.5);
        float breath = 0.5 + 0.5 * sin(uTime);
        vec3 col = uCore + uMid * mid * 0.55 + uRim * edge * (0.75 + breath * 0.45);
        gl_FragColor = vec4(col, 0.96);
      }`,
    transparent: true, depthWrite: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  // Constellation halo: accent points drifting on a sparse shell — replaces
  // the old wireframe cage, which read as a different (blue) product.
  const shell = new THREE.IcosahedronGeometry(1.85, 1);
  const halo = new THREE.Points(
    shell,
    new THREE.PointsMaterial({
      color: palette.rim, size: 0.035, transparent: true,
      opacity: palette.dots, depthWrite: false, sizeAttenuation: true,
    })
  );
  scene.add(halo);

  let t0 = performance.now(); let raf;
  const tick = () => {
    const t = (performance.now() - t0) * 0.001;
    mat.uniforms.uTime.value = t * palette.breath;
    mesh.rotation.y = t * 0.12; mesh.rotation.x = Math.sin(t * 0.2) * 0.08;
    halo.rotation.y = -t * 0.06;
    renderer.render(scene, camera);
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  return () => {
    cancelAnimationFrame(raf);
    renderer.dispose(); geo.dispose(); mat.dispose();
    halo.geometry.dispose(); halo.material.dispose();
    if (renderer.domElement.parentNode === el) el.removeChild(renderer.domElement);
  };
}

// ═══════════════════════════════════════════════════════════════════
// SHARED WIDGETS
// ═══════════════════════════════════════════════════════════════════
function Toggle({ value, onChange, label, hint, disabled = false }) {
  const handle = () => { if (!disabled) onChange(!value); };
  return (
    <label style={{
      display: 'flex', alignItems: 'flex-start', gap: 10,
      cursor: disabled ? 'not-allowed' : 'pointer',
      padding: '8px 0',
      opacity: disabled ? 0.5 : 1,
    }}>
      <div onClick={handle} style={{
        width: 30, height: 16, borderRadius: 8,
        background: value ? 'var(--accent)' : 'var(--bg-3)',
        position: 'relative', transition: 'background 0.15s',
        border: '1px solid ' + (value ? 'var(--accent)' : 'var(--line-2)'),
        flexShrink: 0, marginTop: 1,
      }}>
        <div style={{
          position: 'absolute', top: 1, left: value ? 14 : 1,
          width: 12, height: 12, borderRadius: '50%',
          background: value ? 'var(--bg)' : 'var(--ink-2)',
          transition: 'left 0.15s',
        }}/>
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 12.5, fontWeight: 500, color: 'var(--ink)' }}>{label}</div>
        {hint && <div style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 2, lineHeight: 1.45 }}>{hint}</div>}
      </div>
    </label>
  );
}

function Field({ label, hint, children }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
      {label && <div className="caps">{label}</div>}
      {children}
      {hint && <div style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 1 }}>{hint}</div>}
    </div>
  );
}

function Select({ value, onChange, children }) {
  return (
    <select value={value} onChange={e => onChange(e.target.value)} className="field" style={{
      cursor: 'pointer', appearance: 'none', paddingRight: 28,
      backgroundImage: "url(\"data:image/svg+xml,%3Csvg width='10' height='10' viewBox='0 0 10 10' fill='none'%3E%3Cpath d='M2 4l3 3 3-3' stroke='%235a5a63' stroke-width='1.2'/%3E%3C/svg%3E\")",
      backgroundRepeat: 'no-repeat', backgroundPosition: 'right 10px center',
    }}>{children}</select>
  );
}

function SectionHeader({ index, title, subtitle }) {
  return (
    <div style={{ display: 'flex', alignItems: 'baseline', gap: 14, padding: '32px 0 14px', borderBottom: '1px solid var(--line)', marginBottom: 18 }}>
      {index !== undefined && (
        <span className="mono" style={{ fontSize: 11, color: 'var(--ink-4)' }}>{index.toString().padStart(2, '0')}</span>
      )}
      <div className="serif" style={{ fontSize: 28, lineHeight: 1, letterSpacing: '-0.01em' }}>{title}</div>
      {subtitle && <span style={{ fontSize: 12, color: 'var(--ink-3)' }}>· {subtitle}</span>}
    </div>

}

function StatusBadge({ status }) {
  const m = STATUS_META[status] || { color: 'var(--ink-3)', label: status };
  const pulse = ACTIVE_STATUSES.has(status);
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 6,
      padding: '3px 8px', borderRadius: 999,
      border: '1px solid ' + m.color + '40',
      background: m.color + '14', color: m.color,
      fontSize: 11, fontWeight: 500,
      animation: pulse ? 'pulse 1.4s infinite' : 'none',
    }}>
      <span className="dot" style={{ background: m.color }}/>
      {m.label}
    </span>
  );
}

function LongProgress({ value, color = 'var(--accent)', height = 3 }) {
  const v = Math.max(0, Math.min(1, value || 0));
  return (
    <div style={{ height, background: 'var(--bg-3)', borderRadius: height / 2, overflow: 'hidden' }}>
      <div style={{
        height: '100%', width: (v * 100).toFixed(1) + '%', background: color,
        transition: 'width 0.4s', borderRadius: height / 2,
      }}/>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// SETUP NOTICES
// ═══════════════════════════════════════════════════════════════════
// This app runs on the user's own machine with no logs they'll ever read,
// so anything that says "your environment is wrong" has to arrive here.
// Notices come from /api/system (which merges passive checks, whatever the
// last pipeline run observed, and the last deep probe). `code` is the
// identity — dismissal and dedupe both key on it, never on the title.

const SEV_META = {
  error: { color: 'var(--err)',  bg: 'oklch(0.7 0.2 25 / 0.08)',   line: 'oklch(0.7 0.2 25 / 0.3)',   label: 'Problem' },
  warn:  { color: 'var(--warn)', bg: 'oklch(0.78 0.15 60 / 0.08)', line: 'oklch(0.78 0.15 60 / 0.3)', label: 'Degraded' },
  info:  { color: 'var(--ink-2)',bg: 'var(--bg-1)',                line: 'var(--line)',               label: 'Note' },
};
const sevMeta = (s) => SEV_META[s] || SEV_META.warn;

// Dismissals persist so a known-and-accepted warning (e.g. "running on CPU")
// doesn't nag on every launch. Stored as a comma-joined list of codes because
// _lsSet stringifies whatever it's handed.
const _dismissedCodes = () => {
  const raw = _lsGet('setup_dismissed', '');
  return String(raw || '').split(',').filter(Boolean);
};
const _dismiss = (code) => {
  const set = new Set(_dismissedCodes());
  set.add(code);
  _lsSet('setup_dismissed', Array.from(set).join(','));
};
const _undismissAll = () => _lsSet('setup_dismissed', '');

function SetupBanner({ notices, onOpenSetup }) {
  const [dismissed, setDismissed] = useState(_dismissedCodes);
  const live = (notices || []).filter(n => !dismissed.includes(n.code));
  if (!live.length) return null;

  const top = live[0];
  const meta = sevMeta(top.severity);
  const rest = live.length - 1;

  return (
    <div style={{
      margin: '12px 22px 0', padding: '11px 13px', borderRadius: 8,
      background: meta.bg, border: '1px solid ' + meta.line,
      display: 'flex', alignItems: 'flex-start', gap: 10,
      animation: 'slideUp 0.25s',
    }}>
      <span style={{ color: meta.color, marginTop: 1, flexShrink: 0 }}>{I.warn}</span>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 12, color: 'var(--ink)' }}>{top.title}</div>
        {top.remediation?.length > 0 && (
          <div className="mono" style={{ fontSize: 10, color: 'var(--ink-2)', marginTop: 3 }}>
            {top.remediation[0]}
          </div>
        )}
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 7, flexWrap: 'wrap' }}>
          {top.url && (
            <a href={top.url} target="_blank" rel="noreferrer" className="chip"
               style={{ color: meta.color, borderColor: meta.line, textDecoration: 'none' }}>
              Open link ↗
            </a>
          )}
          <button className="chip" onClick={onOpenSetup}
                  style={{ color: 'var(--ink-2)', cursor: 'pointer' }}>
            {rest > 0 ? `Details · ${rest} more` : 'Details'}
          </button>
          <span className="mono" style={{ fontSize: 9, color: 'var(--ink-4)' }}>{top.code}</span>
        </div>
      </div>
      <button className="btn btn-ghost" title="Dismiss until it happens again"
              onClick={() => { _dismiss(top.code); setDismissed(_dismissedCodes()); }}
              style={{ padding: '2px 6px', flexShrink: 0 }}>
        {I.cancel}
      </button>
    </div>
  );
}

// Full notice with every remediation step — the Setup tab's unit of display.
function NoticeCard({ n }) {
  const meta = sevMeta(n.severity);
  return (
    <div style={{
      padding: '12px 14px', borderRadius: 8, marginBottom: 10,
      background: meta.bg, border: '1px solid ' + meta.line,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <span style={{ color: meta.color }}>{I.warn}</span>
        <span style={{ fontSize: 12.5, color: 'var(--ink)' }}>{n.title}</span>
        <div style={{ flex: 1 }}/>
        <span className="mono" style={{ fontSize: 9, color: meta.color }}>{meta.label}</span>
      </div>
      {n.detail && (
        <pre className="mono" style={{
          fontSize: 10, color: 'var(--ink-2)', marginTop: 8, whiteSpace: 'pre-wrap',
          wordBreak: 'break-word', lineHeight: 1.5,
        }}>{n.detail}</pre>
      )}
      {n.remediation?.length > 0 && (
        <ol style={{ margin: '9px 0 0', paddingLeft: 18, fontSize: 11, color: 'var(--ink-2)', lineHeight: 1.7 }}>
          {n.remediation.map((r, i) => <li key={i}>{r}</li>)}
        </ol>
      )}
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 9 }}>
        {n.url && (
          <a href={n.url} target="_blank" rel="noreferrer" className="chip"
             style={{ color: meta.color, borderColor: meta.line, textDecoration: 'none' }}>
            {n.url.replace(/^https?:\/\//, '').slice(0, 46)} ↗
          </a>
        )}
        <div style={{ flex: 1 }}/>
        <span className="mono" style={{ fontSize: 9, color: 'var(--ink-4)' }}>
          {n.subsystem ? n.subsystem + ' · ' : ''}{n.code}
        </span>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// LEFT RAIL (simplified)
// ═══════════════════════════════════════════════════════════════════
function LeftRail({ view, setView, runningJob, awaitingReviewCount, system,
                    publishPendingCount = 0,
                    narrow = false, open = false, onClose }) {
  const mode = system?.mode || 'local';
  // Jobs consolidates History/Processing/Review/Batch, and the publish inbox
  // lives there too — it is a filter over the History list, not a screen of
  // its own. The badge therefore prefers whatever is blocking a human:
  // translation review first, then publish approval, then the running dot.
  const jobsHint = awaitingReviewCount > 0 ? `${awaitingReviewCount} awaiting review`
                 : publishPendingCount > 0 ? `${publishPendingCount} to publish`
                 : runningJob ? 'Live job' : 'All jobs';
  const jobsBadge = awaitingReviewCount > 0 ? String(awaitingReviewCount)
                  : publishPendingCount > 0 ? String(publishPendingCount)
                  : runningJob ? '●' : null;
  const groups = [
    { label: 'Work', items: [
      { id: 'feed',     label: 'Agent feed', hint: 'Runs · events',           ic: I.feed },
      { id: 'home',     label: 'New dub',    hint: 'Upload · URL · showcase', ic: I.home },
      { id: 'jobs',     label: 'Jobs',       hint: jobsHint, ic: I.history,
        badge: jobsBadge },
      { id: 'discover', label: 'Discover',   hint: 'Trending · scout',        ic: I.discover },
      { id: 'library',  label: 'Library',    hint: 'Results · voices · glossary',
        ic: I.result },
    ]},
    { label: 'Develop', items: [
      { id: 'apikeys',  label: 'API keys',   hint: 'Scoped access',    ic: I.key },
      { id: 'mcp',      label: 'MCP server', hint: 'Agent onboarding', ic: I.plug },
      { id: 'webhooks', label: 'Webhooks',   hint: 'Job events out',   ic: I.hook },
    ]},
    ...(mode === 'hosted' ? [{ label: 'Workspace', items: [
      { id: 'members',  label: 'Members',    hint: 'Roles · invites',  ic: I.people },
      { id: 'billing',  label: 'Billing & usage', hint: 'Metered estimate', ic: I.card },
      { id: 'audit',    label: 'Audit log',  hint: 'Key · job actions', ic: I.ledger },
    ]}] : []),
  ];

  const vramTotal = system?.gpu?.vram_gb;
  const vramFree = system?.gpu?.vram_free_gb;
  const vramUsed = (vramTotal != null && vramFree != null) ? Math.max(0, vramTotal - vramFree) : null;
  // system.gpu is CUDA-only, so on Apple Silicon it reports a broken GPU on a
  // machine where MPS works. system.accelerator is the MPS-aware probe.
  const acc = system?.accelerator;
  const gpuName = acc?.name || system?.gpu?.name || 'GPU';
  const accelOk = acc ? acc.ok !== false : (system?.gpu?.ok ?? null);
  // The rail's warning state now tracks real problems instead of "no CUDA",
  // which never cleared and taught everyone to ignore it.
  const problems = (system?.notices || []).filter(n => n.severity === 'error');
  const warnings = (system?.notices || []).filter(n => n.severity === 'warn');
  const issueCount = problems.length + warnings.length;
  const sysHint = problems.length ? `${problems.length} problem${problems.length > 1 ? 's' : ''}`
                : warnings.length ? `${warnings.length} warning${warnings.length > 1 ? 's' : ''}`
                : 'GPU · models · storage';

  // On a phone the rail cannot hold a column of its own — 232px of a 390px
  // viewport left the content ~158px wide, which is what wrapped every label
  // one word per line. Off-canvas instead: same markup, taken out of flow.
  const go = (id) => { setView(id); if (narrow && onClose) onClose(); };

  return (
    <aside style={{
      width: narrow ? 'min(280px, 84vw)' : 'var(--rail-w)',
      background: 'var(--bg)',
      borderRight: '1px solid var(--line)',
      display: 'flex', flexDirection: 'column', flexShrink: 0,
      ...(narrow ? {
        position: 'fixed', top: 0, left: 0, bottom: 0, zIndex: 60,
        transform: open ? 'translateX(0)' : 'translateX(-100%)',
        transition: 'transform 0.22s ease',
        boxShadow: open ? '0 0 40px rgba(0,0,0,0.6)' : 'none',
      } : {}),
    }}>
      <div style={{ padding: '20px 20px 18px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{
            width: 24, height: 24, borderRadius: 6, background: 'var(--accent)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: '0 0 18px var(--accent-glow)',
          }}>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" strokeWidth="1.6" style={{ stroke: 'var(--bg)' }}><path d="M2 6c0-1.5.8-2.5 2-2.5s2 1 2 2.5-.8 2.5-2 2.5"/><path d="M6 6c0-1.5.8-2.5 2-2.5s2 1 2 2.5"/></svg>
          </div>
          <div>
            <div className="serif" style={{ fontSize: 19, lineHeight: 1, letterSpacing: '-0.02em' }}>GoChiDUBB</div>
            <div className="mono" style={{ color: 'var(--ink-4)', fontSize: 9, marginTop: 3 }}>studio</div>
          </div>
        </div>
      </div>

      <div style={{ padding: '0 12px', flex: 1, overflow: 'auto' }}>
        {groups.map((g, gi) => (
          <React.Fragment key={g.label}>
            <div className="caps" style={{ margin: (gi === 0 ? '0' : '20px') + ' 8px 8px' }}>{g.label}</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
              {g.items.map(s => <NavItem key={s.id} item={s} active={view === s.id} onClick={() => go(s.id)}/>)}
            </div>
          </React.Fragment>
        ))}

        <div className="caps" style={{ margin: '20px 8px 8px' }}>System</div>
        <NavItem
          item={{ id: 'system', label: 'Settings', hint: sysHint, ic: I.system,
                  badge: issueCount > 0 ? String(issueCount) : null }}
          active={view === 'system'}
          onClick={() => go('system')}
          warn={problems.length > 0}
        />
      </div>

      <div style={{ padding: 12, borderTop: '1px solid var(--line)' }}>
        {/* A mode, not a tier: same account, same jobs, same meter. Phrased
            as a switch rather than an upgrade or a downgrade — nobody using
            the full tool should read the simpler surface as a demotion. */}
        <button
          onClick={() => switchUiMode('creator')}
          title="Same account, same jobs — a simpler surface for making videos"
          style={{
            width: '100%', display: 'flex', alignItems: 'center', gap: 8,
            padding: '8px 10px', marginBottom: 10, borderRadius: 6,
            background: 'var(--bg-1)', border: '1px solid var(--line)',
            color: 'var(--ink-2)', textAlign: 'left',
          }}>
          <span style={{ color: 'var(--ink-3)', flexShrink: 0 }}>{I.result}</span>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 11 }}>Switch to Creator mode</div>
            <div className="mono" style={{ fontSize: 9, color: 'var(--ink-4)', marginTop: 1,
                                           whiteSpace: 'nowrap', overflow: 'hidden',
                                           textOverflow: 'ellipsis' }}>
              Same jobs, simpler
            </div>
          </div>
          <span style={{ color: 'var(--ink-4)', flexShrink: 0 }}>{I.arrow}</span>
        </button>
        <div style={{ padding: 10, background: 'var(--bg-1)', border: '1px solid var(--line)', borderRadius: 6 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
            <span style={{ color: 'var(--ink-3)' }}>{I.cpu}</span>
            <span className="mono" style={{ fontSize: 10, color: 'var(--ink-2)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {gpuName.replace(/^NVIDIA /, '').slice(0, 18)}
            </span>
            <div style={{ flex: 1 }}/>
            <span className="dot" style={{ background: accelOk === false ? 'var(--err)' : 'var(--accent)', boxShadow: accelOk === false ? 'none' : '0 0 6px var(--accent-glow)' }}/>
          </div>
          {vramTotal ? (
            <>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
                <span className="serif" style={{ fontSize: 16 }}>{vramUsed?.toFixed(1) ?? '—'}</span>
                <span className="mono" style={{ fontSize: 10, color: 'var(--ink-3)' }}>/ {vramTotal} GB · VRAM</span>
              </div>
              <div style={{ height: 2, background: 'var(--bg-3)', borderRadius: 1, marginTop: 6, overflow: 'hidden' }}>
                <div style={{ height: '100%', width: `${Math.min(100, (vramUsed / vramTotal) * 100)}%`, background: 'var(--accent)', opacity: 0.7 }}/>
              </div>
            </>
          ) : acc ? (
            // No VRAM figure doesn't mean no accelerator — MPS exposes no
            // total-memory API, and this card used to sit on "Loading…" forever.
            <div className="mono" style={{ fontSize: 10, color: 'var(--ink-3)' }}>
              {acc.backend ? acc.backend + ' · ' : ''}{acc.ok ? 'ready' : 'CPU only'}
            </div>
          ) : (
            <div className="mono" style={{ fontSize: 10, color: 'var(--ink-4)' }}>Loading…</div>
          )}
        </div>
        <div style={{ padding: '8px 12px 4px', borderTop: '1px solid var(--line)', textAlign: 'center' }}>
          <div className="mono" style={{ fontSize: 9, color: 'var(--ink-4)', lineHeight: 1.6 }}>
            TachikomaRed &amp; smolemaru
          </div>
        </div>
      </div>
    </aside>
  );
}

function NavItem({ item, active, onClick, warn }) {
  return (
    <button onClick={onClick} style={{
      display: 'flex', alignItems: 'center', gap: 10,
      padding: '9px 10px', borderRadius: 6,
      background: active ? 'var(--bg-2)' : 'transparent',
      border: '1px solid ' + (active ? 'var(--line-2)' : 'transparent'),

      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 12, fontWeight: active ? 500 : 400 }}>{item.label}</div>

          animation: item.badge === '●' ? 'pulse 1.5s infinite' : 'none',

    </button>
  );
}

// ═══════════════════════════════════════════════════════════════════
// TOP BAR
// ═══════════════════════════════════════════════════════════════════
function TopBar({ view, runningJob, awaitingReviewCount, notices, mode = 'local',
                  onJumpToProcessing, onJumpToReview, onOpenSetup, onCommand,
                  narrow = false, onOpenNav }) {
  const TITLES = {
    feed: 'Agent feed', home: 'New dub', jobs: 'Jobs', library: 'Library',
    discover: 'Discover', apikeys: 'API keys', mcp: 'MCP server',
    webhooks: 'Webhooks', members: 'Members', billing: 'Billing & usage',
    audit: 'Audit log', system: 'Settings',
  };
  // ⌘K / Ctrl-K focuses the command field from anywhere in the app.
  const cmdRef = useRef(null);
  useEffect(() => {
    const h = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        cmdRef.current?.focus();
      }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);
  const issues = notices || [];
  const worst = issues.some(n => n.severity === 'error') ? 'error'
              : issues.some(n => n.severity === 'warn') ? 'warn' : '';
  const overall = (runningJob?.progress ?? 0) / 100;
  const eta = runningJob?.eta_seconds ?? null;

  return (
    <div style={{
      height: 50, borderBottom: '1px solid var(--line)',
      display: 'flex', alignItems: 'center',
      padding: '0 var(--gutter)', gap: 10, background: 'var(--bg)', flexShrink: 0,
      overflow: 'hidden',
    }}>
      {narrow && (
        <button onClick={onOpenNav} aria-label="Open navigation"
                style={{ display: 'flex', flexDirection: 'column', gap: 3,
                         padding: '10px 6px 10px 0', flexShrink: 0 }}>
          {[0, 1, 2].map(i => (
            <span key={i} style={{ display: 'block', width: 17, height: 1.5,
                                   background: 'var(--ink-2)', borderRadius: 1 }}/>
          ))}
        </button>
      )}
      <div className="serif" style={{ fontSize: narrow ? 15 : 17, letterSpacing: '-0.01em',
                                      flexShrink: 0 }}>
        {TITLES[view] || 'GoChiDUBB Studio'}
      </div>
      {view === 'jobs' && runningJob && !narrow && (
        // A YouTube URL is ~45 chars of unbreakable text; on a phone it pushed
        // the whole bar wider than the screen, so it only shows with room.
        <span className="mono" style={{
          fontSize: 10, color: 'var(--ink-4)', marginTop: 2, minWidth: 0,
          overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
        }}>
          · {(runningJob.title || runningJob.source_label || runningJob.source || runningJob.id).slice(0, 50)}
        </span>
      )}
      {!narrow && onCommand ? (
        <form
          style={{ flex: 1, minWidth: 8, display: 'flex', justifyContent: 'center', padding: '0 12px' }}
          onSubmit={e => {
            e.preventDefault();
            onCommand(cmdRef.current ? cmdRef.current.value : '');
            if (cmdRef.current) cmdRef.current.value = '';
          }}>
          <label
            title="Describe a dub — a URL, target languages, and optionally a showcase reel. It fills in New dub; you press Start."
            style={{ display: 'flex', alignItems: 'center', gap: 8,
                     width: 'min(440px, 100%)', padding: '5px 10px', cursor: 'text',
                     background: 'var(--bg-1)', border: '1px solid var(--line)',
                     borderRadius: 'var(--r-md)' }}>
            <input ref={cmdRef} placeholder='Dub the last upload into fr, es, ja…'
                   style={{ flex: 1, minWidth: 0, fontSize: 12, color: 'var(--ink)' }}/>
            <span className="mono" style={{ fontSize: 9, color: 'var(--ink-4)',
                                            padding: '2px 5px', borderRadius: 4,
                                            border: '1px solid var(--line)', flexShrink: 0 }}>⌘K</span>
          </label>
        </form>
      ) : (
        <div style={{ flex: 1, minWidth: 8 }}/>
      )}

      <span className="chip mono" title="Deployment mode" style={{
        fontSize: 9, letterSpacing: '0.1em', textTransform: 'uppercase', flexShrink: 0,
        color: mode === 'hosted' ? 'var(--accent)' : 'var(--ink-3)',
        borderColor: mode === 'hosted' ? 'var(--accent)' : 'var(--line)',
      }}>{mode}</span>

      {runningJob && view !== 'jobs' && (
        <button onClick={onJumpToProcessing} className="chip" style={{ color: 'var(--ink-2)', cursor: 'pointer' }}>
          <span className="dot" style={{ background: 'var(--accent)', boxShadow: '0 0 5px var(--accent-glow)', animation: 'pulse 1.5s infinite' }}/>
          <span>Running · {(overall * 100).toFixed(0)}%</span>
          {eta != null && <span className="mono" style={{ color: 'var(--ink-4)' }}>· ETA {Math.round(eta / 60)}m</span>}
        </button>
      )}

      {awaitingReviewCount > 0 && view !== 'jobs' && (
        <button onClick={onJumpToReview} className="chip" style={{
          color: 'var(--warn)', borderColor: 'var(--warn)',
          background: 'oklch(0.78 0.15 60 / 0.1)', cursor: 'pointer',
        }}>
          {I.review} {awaitingReviewCount} awaiting review
        </button>
      )}

      {worst && view !== 'system' && (
        <button onClick={onOpenSetup} className="chip" style={{
          color: sevMeta(worst).color, borderColor: sevMeta(worst).line,
          background: sevMeta(worst).bg, cursor: 'pointer',
        }}>
          {I.warn} {issues.length} setup {issues.length === 1 ? 'issue' : 'issues'}
        </button>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// HOME VIEW — with dynamic model loading
// ═══════════════════════════════════════════════════════════════════
function HomeView({ system, voicePresets, sphereOn, onJobSubmitted,
                   command = null, onCommandConsumed }) {
  // ── Dynamic models state ──
  const [availableModels, setAvailableModels] = useState([]);
  const [translationBackend, setTranslationBackend] = useState('lm_studio');
  const [loadingModels, setLoadingModels] = useState(true);

  // ── Form state ──
  const [mode, setMode] = useState('url');
  const [batchMode, setBatchMode] = useState(false);
  const [quickTestMode, setQuickTestMode] = useState(false);
  const [showcaseMode, setShowcaseMode] = useState(false);
  const switchTo = (target) => {
    setBatchMode(target === 'batch');
    setQuickTestMode(target === 'quick');
    setShowcaseMode(target === 'showcase');
  };
  const [videoFile, setVideoFile] = useState(null);
  const [ytUrl, setYtUrl] = useState('');
  const [refFile, setRefFile] = useState(null);
  const [batchFiles, setBatchFiles] = useState([]);
  const [batchUrls, setBatchUrls] = useState('');
  const [batchLabel, setBatchLabel] = useState('');
  const [batchSchedule, setBatchSchedule] = useState('');

  const [srcLang, setSrcLang] = useState(() => _lsGet('srcLang', 'auto'));
  const [tgtLang, setTgtLang] = useState(() => _lsGet('tgtLang', 'ru'));
  // Multi-language runs dub the whole video by default now; trimming is the
  // opt-in "audition it first" path rather than the only behaviour.
  const [qtTrimOn, setQtTrimOn] = useState(() => _lsGet('qtTrimOn', false));
  const [model, setModel] = useState(() => _lsGet('model', ''));
  const [whisperModel, setWhisperModel] = useState(() => _lsGet('whisperModel', 'base'));
  const [speakerMode, setSpeakerMode] = useState(() => _lsGet('speakerMode', 'main'));
  const [voicePreset, setVoicePreset] = useState(() => _lsGet('voicePreset', 'auto'));
  const [voiceStyle, setVoiceStyle] = useState('');
  const [ttsSpeed, setTtsSpeed] = useState(() => _lsGet('ttsSpeed', 'balanced'));
  const [contextHint, setContextHint] = useState(() => _lsGet('contextHint', ''));
  // 'keepBg2': the persist effect below auto-wrote keepBg:false for every existing
  // visitor on first render, so flipping only the default would change nothing for
  // existing browsers — a renamed key lets the new default actually take effect.
  const [keepBg, setKeepBg] = useState(() => _lsGet('keepBg2', true));
  const [autoDenoise, setAutoDenoise] = useState(() => _lsGet('autoDenoise', false));
  const [lipSync, setLipSync] = useState(() => _lsGet('lipSync', false));
  const [llmRegroup, setLlmRegroup] = useState(() => _lsGet('llmRegroup', false));
  const [wizardReview, setWizardReview] = useState(() => _lsGet('wizardReview', false));
  // Per-job VoxCPM overrides. 0 = "auto", i.e. follow Settings -> Voice & TTS.
  const [voxCfg, setVoxCfg] = useState(() => _lsGet('voxCfg', 0));
  const [voxSteps, setVoxSteps] = useState(() => _lsGet('voxSteps', 0));

  const [qtTrimSeconds, setQtTrimSeconds] = useState(() => _lsGet('qtTrim', 60));
  const [qtLangs, setQtLangs] = useState(() => {
    const stored = _lsGet('qtLangs', null);
    return Array.isArray(stored) && stored.length >= 2 ? stored : ['es', 'fr', 'de', 'ja', 'pt'];
  });

  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState(null);
  // What ⌘K filled in, kept so the form can say what it understood — and,
  // just as importantly, what it did not.
  const [applied, setApplied] = useState(null);

  // Apply a parsed ⌘K command. Nothing is submitted: the form is filled and
  // the human presses Start, because a dub spends real GPU time.
  useEffect(() => {
    if (!command) return;
    // Understood nothing? Then touch nothing. Resetting the mode someone had
    // already chosen, because their sentence made no sense, is worse than
    // simply saying it made no sense.
    if (!command.understood.length) { setApplied(command); onCommandConsumed && onCommandConsumed(); return; }
    if (command.source) { setYtUrl(command.source); setMode('url'); }
    if (command.mode === 'showcase') switchTo('showcase');
    else if (command.mode === 'quick') switchTo('quick');
    else if (command.mode === 'batch') switchTo('batch');
    else if (command.langs.length > 1) switchTo('quick');
    else switchTo('single');
    if (command.langs.length === 1) setTgtLang(command.langs[0]);
    else if (command.langs.length > 1) setQtLangs(command.langs);
    setApplied(command);
    onCommandConsumed && onCommandConsumed();
  }, [command]);
  const [lipStatus, setLipStatus] = useState(null);

  // ── Fetch models dynamically ──
  useEffect(() => {
    const fetchModels = async () => {
      setLoadingModels(true);
      try {
        // First check which backend is active from system
        if (system) {
          const backend = system.translation_backend || 
                         (system.lm_studio?.ok ? 'lm_studio' : 
                          system.ollama?.ok ? 'ollama' : 'unknown');
          setTranslationBackend(backend);
        }

        // Try to fetch models from LM Studio
        const res = await fetch('/api/lm_studio/models');
        if (res.ok) {
          const data = await res.json();
          if (data.models && data.models.length > 0) {
            setAvailableModels(data.models);
            // If no model selected or current model not in list, select first
            if (!model || !data.models.includes(model)) {
              // Prefer Qwen models
              const qwenModel = data.models.find(m => m.toLowerCase().includes('qwen'));
              setModel(qwenModel || data.models[0]);
            }
            setLoadingModels(false);
            return;
          }
        }

        // Fallback: try system endpoint
        if (system) {
          const sysModels = system.lm_studio?.models || system.ollama?.models || [];
          if (sysModels.length > 0) {
            setAvailableModels(sysModels);
            if (!model || !sysModels.includes(model)) {
              const qwenModel = sysModels.find(m => String(m).toLowerCase().includes('qwen'));
              setModel(qwenModel || sysModels[0]);
            }
            setLoadingModels(false);
            return;
          }
        }

        // Final fallback: use known good models
        const fallback = ['Qwen/Qwen2.5-14B-Instruct', 'Qwen/Qwen2.5-7B-Instruct', 'google/gemma-3-12b-it'];
        setAvailableModels(fallback);
        if (!model) setModel(fallback[0]);
        setLoadingModels(false);
      } catch (e) {
        console.warn('Failed to fetch models:', e);
        const fallback = ['Qwen/Qwen2.5-14B-Instruct', 'Qwen/Qwen2.5-7B-Instruct'];
        setAvailableModels(fallback);
        if (!model) setModel(fallback[0]);
        setLoadingModels(false);
      }
    };
    fetchModels();
  }, [system]);

  // ── Persist preferences ──
  useEffect(() => { _lsSet('srcLang', srcLang); }, [srcLang]);
  useEffect(() => { _lsSet('tgtLang', tgtLang); }, [tgtLang]);
  useEffect(() => { _lsSet('qtTrimOn', qtTrimOn); }, [qtTrimOn]);
  useEffect(() => { _lsSet('model', model); }, [model]);
  useEffect(() => { _lsSet('whisperModel', whisperModel); }, [whisperModel]);
  useEffect(() => { _lsSet('speakerMode', speakerMode); }, [speakerMode]);
  useEffect(() => { _lsSet('voicePreset', voicePreset); }, [voicePreset]);
  useEffect(() => { _lsSet('ttsSpeed', ttsSpeed); }, [ttsSpeed]);
  useEffect(() => { _lsSet('contextHint', contextHint); }, [contextHint]);
  useEffect(() => { _lsSet('keepBg2', keepBg); }, [keepBg]);
  useEffect(() => { _lsSet('autoDenoise', autoDenoise); }, [autoDenoise]);
  useEffect(() => { _lsSet('lipSync', lipSync); }, [lipSync]);
  useEffect(() => { _lsSet('llmRegroup', llmRegroup); }, [llmRegroup]);
  useEffect(() => { _lsSet('wizardReview', wizardReview); }, [wizardReview]);
  useEffect(() => { _lsSet('voxCfg', voxCfg); }, [voxCfg]);
  useEffect(() => { _lsSet('voxSteps', voxSteps); }, [voxSteps]);
  useEffect(() => { _lsSet('qtTrim', qtTrimSeconds); }, [qtTrimSeconds]);
  useEffect(() => { _lsSet('qtLangs', qtLangs); }, [qtLangs]);

  // ── Fetch lip sync status ──
  useEffect(() => {
    fetch('/api/lip_sync/status').then(r => r.json()).then(setLipStatus).catch(() => {});
  }, []);

  // ── Submit handlers ──
  const submitSingle = async () => {
    setError(null); setSubmitting(true);
    const fd = new FormData();
    if (mode === 'file' && videoFile) fd.append('video', videoFile);
    else if (mode === 'url' && ytUrl) fd.append('source', ytUrl);
    if (refFile) fd.append('reference', refFile);
    fd.append('source_lang', srcLang);
    fd.append('target_lang', tgtLang);
    fd.append('model', model);
    fd.append('keep_bg', keepBg);
    fd.append('whisper_model', whisperModel);
    fd.append('speaker_mode', speakerMode);
    fd.append('context_hint', contextHint);
    fd.append('voice_style', voiceStyle);
    fd.append('voice_preset', voicePreset);
    fd.append('tts_speed', ttsSpeed);
    fd.append('voxcpm_cfg', String(voxCfg));
    fd.append('voxcpm_steps', String(voxSteps));
    fd.append('wizard_mode', wizardReview ? 'review_translation' : 'auto');
    fd.append('auto_denoise', autoDenoise);
    fd.append('llm_regroup', llmRegroup);
    fd.append('lip_sync', lipSync);
    try {
      const r = await fetch('/api/dub', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.job_id) onJobSubmitted(d.job_id);
      else setError(d.error || d.detail || 'Submit failed');
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setSubmitting(false);
    }
  };

  const submitBatch = async () => {
    setError(null); setSubmitting(true);
    const fd = new FormData();
    batchFiles.forEach(f => fd.append('videos', f));
    if (batchUrls.trim()) fd.append('sources', batchUrls.trim());
    if (refFile) fd.append('reference', refFile);
    fd.append('source_lang', srcLang);
    fd.append('target_lang', tgtLang);
    fd.append('model', model);
    fd.append('keep_bg', keepBg);
    fd.append('whisper_model', whisperModel);
    fd.append('speaker_mode', speakerMode);
    fd.append('context_hint', contextHint);
    fd.append('voice_style', voiceStyle);
    fd.append('voice_preset', voicePreset);
    fd.append('tts_speed', ttsSpeed);
    fd.append('voxcpm_cfg', String(voxCfg));
    fd.append('voxcpm_steps', String(voxSteps));
    fd.append('wizard_mode', 'auto');
    fd.append('auto_denoise', autoDenoise);
    fd.append('llm_regroup', llmRegroup);
    fd.append('batch_label', batchLabel || `Batch ${new Date().toLocaleString()}`);
    if (batchSchedule) {
      const ts = Math.floor(new Date(batchSchedule).getTime() / 1000);
      if (ts > Math.floor(Date.now() / 1000) + 10) fd.append('scheduled_at', String(ts));
    }
    try {
      const r = await fetch('/api/dub/batch', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.batch_id || d.job_ids) onJobSubmitted(null);
      else setError(d.error || d.detail || 'Batch submit failed');
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setSubmitting(false);
    }
  };

  const submitQuickTest = async () => {
    setError(null); setSubmitting(true);
    const fd = new FormData();
    if (mode === 'file' && videoFile) fd.append('video', videoFile);
    else if (mode === 'url' && ytUrl) fd.append('source', ytUrl);
    if (refFile) fd.append('reference', refFile);
    fd.append('trim_seconds', String(qtTrimOn ? qtTrimSeconds : 0));
    fd.append('target_langs', qtLangs.join(','));
    fd.append('source_lang', srcLang);
    fd.append('model', model);
    fd.append('whisper_model', whisperModel);
    fd.append('speaker_mode', speakerMode);
    fd.append('voice_preset', voicePreset);
    fd.append('voice_style', voiceStyle);
    fd.append('tts_speed', ttsSpeed);
    fd.append('voxcpm_cfg', String(voxCfg));
    fd.append('voxcpm_steps', String(voxSteps));
    fd.append('keep_bg', keepBg);
    fd.append('auto_denoise', autoDenoise);
    fd.append('context_hint', contextHint);
    fd.append('wizard_mode', wizardReview ? 'review_translation' : 'auto');
    fd.append('lip_sync', lipSync);
    try {
      const r = await fetch('/api/quick_test', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.batch_id || d.job_ids) onJobSubmitted(null);
      else setError(d.error || d.detail || 'Multi-language submit failed');
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setSubmitting(false);
    }
  };

  const submitShowcase = async () => {
    setError(null); setSubmitting(true);
    const fd = new FormData();
    if (mode === 'file' && videoFile) fd.append('video', videoFile);
    else if (mode === 'url' && ytUrl) fd.append('source', ytUrl);
    if (refFile) fd.append('reference', refFile);
    fd.append('trim_seconds', String(qtTrimSeconds));
    fd.append('target_langs', qtLangs.join(','));
    fd.append('source_lang', srcLang);
    fd.append('model', model);
    fd.append('whisper_model', whisperModel);
    fd.append('speaker_mode', speakerMode);
    fd.append('voice_preset', voicePreset);
    fd.append('voice_style', voiceStyle);
    fd.append('tts_speed', ttsSpeed);
    fd.append('voxcpm_cfg', String(voxCfg));
    fd.append('voxcpm_steps', String(voxSteps));
    fd.append('keep_bg', keepBg);
    fd.append('auto_denoise', autoDenoise);
    fd.append('context_hint', contextHint);
    try {
      const r = await fetch('/api/showcase', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.batch_id || d.job_ids) onJobSubmitted(null);
      else setError(d.error || d.detail || 'Showcase submit failed');
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setSubmitting(false);
    }
  };

  const submit = () => {
    if (showcaseMode) return submitShowcase();
    if (quickTestMode) return submitQuickTest();
    if (batchMode) return submitBatch();
    return submitSingle();
  };

  const canSubmit = !submitting && (
    batchMode
      ? (batchFiles.length + batchUrls.split('\n').filter(l => l.trim()).length) > 0
      : (mode === 'file' ? !!videoFile : !!ytUrl.trim())
  ) && model;

  // ── CTA label ──
  const submitLabel = (() => {
    if (submitting) return 'Submitting…';
    if (batchMode) {
      const c = batchFiles.length + batchUrls.split('\n').filter(l => l.trim()).length;
      if (c === 0) return 'Add at least one source';
      if (batchSchedule) return `Schedule ${c} videos for ${new Date(batchSchedule).toLocaleString()}`;
      return `Queue ${c} videos now`;
    }
    if (mode === 'file' && !videoFile) return 'Choose a video file';
    if (mode === 'url' && !ytUrl.trim()) return 'Paste a URL';
    if (!model) return loadingModels ? 'Loading models…' : 'Select a model';
    return 'Start dubbing';
  })();

  return (
    <div style={{ flex: 1, overflow: 'auto', position: 'relative', background: 'var(--bg)' }}>
      {/* Hero */}
      <Hero sphereOn={sphereOn}/>

      {/* Form */}
      <div style={{ maxWidth: 760, margin: '0 auto', padding: '0 32px 80px' }}>
        {/* What ⌘K filled in. It reports what it did NOT understand too — a
            command bar that quietly drops half your sentence is worse than one
            that admits it only caught part of it. */}
        {applied && (
          <div style={{ display: 'flex', gap: 10, padding: '12px 14px',
                        marginBottom: 18, background: 'var(--bg-1)',
                        border: '1px solid var(--line-2)',
                        borderRadius: 'var(--r-md)' }}>
            <span style={{ color: 'var(--accent)', flexShrink: 0 }}>{I.feed}</span>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 12.5, color: 'var(--ink)', marginBottom: 4 }}>
                Filled in from your command — check it and press Start.
              </div>
              <div className="mono wrap-any" style={{ fontSize: 10.5,
                                                      color: 'var(--ink-3)',
                                                      lineHeight: 1.6 }}>
                “{applied.text}”
              </div>
              <div className="mono" style={{ fontSize: 10.5, marginTop: 6,
                                             color: 'var(--ink-3)' }}>
                {applied.understood.length
                  ? 'read: ' + applied.understood.join(' · ')
                  : 'nothing recognised — fill the form in yourself'}
                {!applied.source && ' · no source URL found'}
              </div>
            </div>
            <button className="btn btn-ghost" style={{ marginLeft: 'auto', fontSize: 11 }}
                    onClick={() => setApplied(null)}>Dismiss</button>
          </div>
        )}
        {error && (
          <div style={{
            margin: '0 0 24px',
            padding: '12px 14px',
            background: 'oklch(0.7 0.2 25 / 0.08)',
            border: '1px solid oklch(0.7 0.2 25 / 0.3)',
            borderRadius: 8, display: 'flex', alignItems: 'center', gap: 10,
          }}>
            <span style={{ color: 'var(--err)' }}>{I.cancel}</span>
            <div style={{ flex: 1, fontSize: 12.5, color: 'var(--ink)' }}>{error}</div>
            <button className="btn-ghost" style={{ padding: 4, color: 'var(--ink-3)' }} onClick={() => setError(null)}>{I.cancel}</button>
          </div>
        )}

        <SectionHeader index={1} title="Source media" subtitle="One file or batch · file upload or URL"/>

        <div style={{ display: 'flex', gap: 6, marginBottom: 16, flexWrap: 'wrap' }}>
          <ModeBtn active={!batchMode && !quickTestMode && !showcaseMode} onClick={() => switchTo('single')} label="Single video"/>
          <ModeBtn active={batchMode}     onClick={() => switchTo('batch')}    label="Batch — many videos"/>
          <ModeBtn active={quickTestMode} onClick={() => switchTo('quick')}    label="Multi-language"/>
          <ModeBtn active={showcaseMode}  onClick={() => switchTo('showcase')} label="Showcase · stitched reel"/>
        </div>

        {showcaseMode && (
          <QuickTestForm
            kind="showcase"
            mode={mode} setMode={setMode}
            videoFile={videoFile} setVideoFile={setVideoFile}
            ytUrl={ytUrl} setYtUrl={setYtUrl}
            refFile={refFile}
            voicePreset={voicePreset}
            ttsSpeed={ttsSpeed}
            trimSeconds={qtTrimSeconds} setTrimSeconds={setQtTrimSeconds}
            trimOn={true} setTrimOn={() => {}}
            langs={qtLangs} setLangs={setQtLangs}
            onSubmit={submitShowcase}
            submitting={submitting}
            limits={system?.limits}
            error={error}/>
        )}

        {quickTestMode && (
          <QuickTestForm
            mode={mode} setMode={setMode}
            videoFile={videoFile} setVideoFile={setVideoFile}
            ytUrl={ytUrl} setYtUrl={setYtUrl}
            refFile={refFile}
            voicePreset={voicePreset}
            ttsSpeed={ttsSpeed}
            trimSeconds={qtTrimSeconds} setTrimSeconds={setQtTrimSeconds}
            trimOn={qtTrimOn} setTrimOn={setQtTrimOn}
            langs={qtLangs} setLangs={setQtLangs}
            onSubmit={submitQuickTest}
            submitting={submitting}
            limits={system?.limits}
            error={error}
          />
        )}

        {/* Multi-language shares sections 2-4 with a single dub — it is a
            primary workflow, not a smoke test, so it gets the same controls.
            Only the source picker and the single-target select stay
            exclusive, because QuickTestForm above already owns those. */}
        {!showcaseMode && (<>
        {!batchMode && !quickTestMode && (
          <SingleSource
            mode={mode} setMode={setMode}
            videoFile={videoFile} setVideoFile={setVideoFile}
            ytUrl={ytUrl} setYtUrl={setYtUrl}

          <BatchSource
            files={batchFiles} setFiles={setBatchFiles}
            urls={batchUrls} setUrls={setBatchUrls}
          />

        <SectionHeader index={2} title="Languages & models"/>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 14 }}>
          <Field label="Source language">
            <Select value={srcLang} onChange={setSrcLang}>
              {LANGS.map(l => <option key={l.c} value={l.c} style={{ background: '#16161c' }}>{l.n}</option>)}
            </Select>
          </Field>
          {!quickTestMode && (
          <Field label="Target language">
            <Select value={tgtLang} onChange={setTgtLang}>
              {LANGS.filter(l => l.c !== 'auto').map(l => <option key={l.c} value={l.c} style={{ background: '#16161c' }}>{l.n}</option>)}
            </Select>
          </Field>
          )}
          <Field label="Translation model" hint={
            loadingModels ? 'Loading models from LM Studio…' :
            translationBackend === 'lm_studio' ? `LM Studio · ${availableModels.length} models available` :
            'Ollama'
          }>
            <Select value={model} onChange={setModel}>
              {loadingModels ? (
                <option value="" style={{ background: '#16161c' }}>Loading models…</option>
              ) : availableModels.length === 0 ? (
                <option value="" style={{ background: '#16161c' }}>
                  {translationBackend === 'lm_studio' ? 'No models found — check LM Studio' : 'No Ollama models found'}
                </option>
              ) : availableModels.map(m => (
                <option key={m} value={m} style={{ background: '#16161c' }}>{m}</option>
              ))}
            </Select>
          </Field>
          <Field label="Whisper model" hint="base = fastest, large-v3 = best quality">
            <Select value={whisperModel} onChange={setWhisperModel}>
              {WHISPER_MODELS.map(m => <option key={m.id} value={m.id} style={{ background: '#16161c' }}>{m.name} · {m.size} · {m.detail}</option>)}
            </Select>
          </Field>
        </div>

        <SectionHeader index={3} title="Voice"/>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 12 }}>
          {[
            ['main', 'Main speaker only', 'Best for solo videos · one consistent voice'],
            ['all',  'All speakers',       'Clone every detected voice'],
          ].map(([v, label, hint]) => (
            <button key={v} onClick={() => setSpeakerMode(v)} style={{
              padding: '10px 14px', borderRadius: 6, textAlign: 'left',
              cursor: 'pointer', transition: 'all 0.15s',
              background: speakerMode === v ? 'var(--bg-2)' : 'var(--bg-1)',
              border: '1px solid ' + (speakerMode === v ? 'var(--accent)' : 'var(--line)'),
              color: 'var(--ink)',
            }}>
              <div style={{ fontSize: 12.5, fontWeight: 500 }}>{label}</div>
              <div className="mono" style={{ fontSize: 10, color: 'var(--ink-3)', marginTop: 2 }}>{hint}</div>
            </button>
          ))}
        </div>
        <Field label="Voice preset" hint="Auto-clone uses each speaker's extracted reference. Pick a preset to override.">
          <Select value={voicePreset} onChange={setVoicePreset}>
            <option value="auto" style={{ background: '#16161c' }}>auto · clone source</option>
            {voicePresets.map(p => (
              <option key={p.id} value={p.id} style={{ background: '#16161c' }}>
                {p.name}{p.style ? ' · ' + p.style : ''}{p.type === 'file' ? ' · file' : ''}
              </option>
            ))}
          </Select>
        </Field>
        <div style={{ marginTop: 14 }}>
          <Field label="TTS speed">
            <div style={{ display: 'flex', gap: 6 }}>
              {['fast', 'balanced', 'quality'].map(s => (
                <button key={s} onClick={() => setTtsSpeed(s)} className="btn" style={{
                  flex: 1, justifyContent: 'center',
                  borderColor: ttsSpeed === s ? 'var(--accent)' : 'var(--line)',
                  background: ttsSpeed === s ? 'var(--bg-2)' : 'var(--bg-1)',
                  color: ttsSpeed === s ? 'var(--ink)' : 'var(--ink-2)',
                }}>{s}</button>
              ))}
            </div>
          </Field>
        </div>
        <div style={{ marginTop: 14 }}>
          <Field label="Voice reference (optional)" hint="WAV or MP3. 10-30s of clean speech.">
            <FileSlot file={refFile} setFile={setRefFile} accept="audio/*,video/*"/>
          </Field>
        </div>

        <SectionHeader index={4} title="Advanced"/>
        <Toggle value={keepBg}     onChange={setKeepBg}     label="Keep background audio (music / SFX)" hint="Splits music/SFX from speech (Demucs, or audio-separator as fallback) and ducks it under the dub. If neither is installed the dub still completes, with a notice — see System."/>
        <Toggle value={autoDenoise} onChange={setAutoDenoise} label="Auto-denoise audio" hint="+3-5s · ON for noisy footage (mat sounds, crowd, AC hum) · OFF for clean studio audio"/>
        <Toggle value={lipSync} onChange={setLipSync}
                disabled={lipStatus && !lipStatus.installed}
                label={'Sync lips with Wav2Lip' + (lipStatus && !lipStatus.installed ? ' (not installed)' : '')}
                hint={lipStatus && !lipStatus.installed
                  ? 'Wav2Lip not detected. Install via System tab to enable. Adds 2-5x video duration to processing time.'
                  : 'Auto-runs Wav2Lip after dubbing. Best for talking-head footage; fails on action shots or far-away faces. Adds 2-5x video duration.'}/>
        <Toggle value={llmRegroup}  onChange={setLlmRegroup}  label="LLM segment regrouping" hint="+20-40s on long videos · fixes mid-sentence breaks · best for podcasts, lectures, seminars"/>
        <Toggle value={wizardReview} onChange={setWizardReview} label="Wizard mode — pause for review" hint="Pause after translation so you can edit segments and replace voice references."/>

        {/* Per-job VoxCPM tuning. The same two knobs live in Settings ->
            Voice & TTS as global defaults; these override them for this run
            only, which is the point — one hard source shouldn't change the
            default for everything else. 'auto' means inherit. */}
        <div style={{ marginTop: 18 }}>
          <div className="caps" style={{ marginBottom: 10 }}>
            VoxCPM tuning · this job only
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <NumberKnob label="Guidance (cfg)" min={1} max={3} step={0.1} sentinel={0}
                      value={voxCfg} onChange={setVoxCfg}
                      hint="Higher sticks closer to the translated text; lower sounds
                            more natural but can drift. Used as-is, including for
                            cross-lingual jobs. auto = the global setting."/>
          <NumberKnob label="Inference steps" min={4} max={24} step={1} sentinel={0}
                      value={voxSteps} onChange={setVoxSteps}
                      hint="More steps trade render time for quality.
                            auto = follow the global setting and the quality tier."/>
          </div>
        </div>

        <div style={{ marginTop: 14 }}>
          <Field label="Translation context (optional)" hint="A short hint for the LLM. Examples: 'BJJ grappling seminar', 'tech podcast', 'cooking show'.">
            <input
              className="field"
              value={contextHint}
              onChange={e => setContextHint(e.target.value)}
              placeholder="e.g. BJJ seminar, tech podcast"
            />
          </Field>
        </div>

        {batchMode && (
          <>
            <SectionHeader index={5} title="Batch options"/>
            <Field label="Batch label (optional)">
              <input
                className="field"
                value={batchLabel}
                onChange={e => setBatchLabel(e.target.value)}
                placeholder="e.g. BJJ Course · Week 1"
              />
            </Field>
            <div style={{ marginTop: 14 }}>
              <Field label="Schedule start (optional)" hint="Empty = start now. Set to run overnight on cheap GPU hours.">
                <input
                  className="field"
                  type="datetime-local"
                  value={batchSchedule}
                  onChange={e => setBatchSchedule(e.target.value)}
                />
              </Field>
            </div>
          </>
        )}

        <div style={{ marginTop: 36, display: 'flex', gap: 10, alignItems: 'center' }}>
          <button onClick={submit} disabled={!canSubmit} className="btn btn-primary" style={{
            flex: 1, justifyContent: 'center', padding: '12px 16px', fontSize: 13,
          }}>
            {submitLabel} {canSubmit && I.arrow}
          </button>
          <span className="mono" style={{ fontSize: 10, color: 'var(--ink-4)' }}>⌘↵</span>
        </div>
        </>)}
      </div>
    </div>
  );
}

function SubTab({ active, onClick, label }) {

    }}>{label}</button>

function FileSlot({ file, setFile, accept }) {
  const [drag, setDrag] = useState(false);
  const inputRef = useRef(null);

  const onPick = (f) => { if (f) setFile(f); };

  if (file) {
    return (
      <div style={{
        display: 'flex', alignItems: 'center', gap: 10,
        padding: '10px 12px',
        background: 'var(--bg-2)', border: '1px solid var(--accent-dim)',
        borderRadius: 6,
      }}>
        <div style={{
          width: 28, height: 28, borderRadius: 5,
          background: 'var(--bg-3)', border: '1px solid var(--line)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          color: 'var(--accent)', flexShrink: 0,
        }}>{I.check}</div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 12.5, color: 'var(--ink)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{file.name}</div>
          <div className="mono" style={{ fontSize: 10, color: 'var(--ink-4)', marginTop: 2 }}>
            {(file.size / (1024 * 1024)).toFixed(1)} MB
          </div>
        </div>
        <button className="btn-ghost" style={{ padding: 4, color: 'var(--ink-3)' }} onClick={() => setFile(null)}>{I.cancel}</button>
      </div>
    );
  }

  return (
    <div
      className={'dropzone' + (drag ? ' dragging' : '')}
      onClick={() => inputRef.current?.click()}
      onDragOver={e => { e.preventDefault(); setDrag(true); }}
      onDragLeave={() => setDrag(false)}
      onDrop={e => {
        e.preventDefault(); setDrag(false);
        if (e.dataTransfer.files[0]) onPick(e.dataTransfer.files[0]);
      }}
    >
      <input ref={inputRef} type="file" accept={accept} style={{ display: 'none' }}
        onChange={e => onPick(e.target.files[0])}/>
      <div style={{
        width: 36, height: 36, margin: '0 auto 8px', borderRadius: 8,
        background: 'var(--bg-2)', border: '1px solid var(--line)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: 'var(--ink-2)',
      }}>{I.upload}</div>
      <div style={{ fontSize: 13, color: 'var(--ink)', marginBottom: 3 }}>Drop or click to choose</div>
      <div className="mono" style={{ fontSize: 10, color: 'var(--ink-4)' }}>video/audio · up to 4 GB</div>
    </div>
  );
}

// ── QuickTestForm (simplified for space) ──
function QuickTestForm({
  kind = 'quick',
  mode, setMode, videoFile, setVideoFile, ytUrl, setYtUrl,
  refFile, voicePreset, ttsSpeed,
  trimSeconds, setTrimSeconds, trimOn, setTrimOn, langs, setLangs,
  onSubmit, submitting, error, limits,
}) {
  const isShowcase = kind === 'showcase';
  const TRIM_STOPS = [30, 60, 90, 120];
  const pickableLangs = LANGS.filter(l => l.c !== 'auto');
  // Bounds come from /api/system so the picker and the API can't disagree;
  // the literals are only a pre-first-poll fallback.
  const minLangs = limits?.min_target_langs ?? 2;
  const maxLangs = limits?.max_target_langs ?? 12;

  const toggleLang = (code) => {
    if (langs.includes(code)) {
      if (langs.length > minLangs) setLangs(langs.filter(c => c !== code));
    } else {
      if (langs.length < maxLangs) setLangs([...langs, code]);
    }
  };

  const sourceReady = (mode === 'file' && videoFile) || (mode === 'url' && ytUrl.trim());
  const langsOk = langs.length >= minLangs && langs.length <= maxLangs;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 22 }}>
      <div>
        <div className="caps" style={{ marginBottom: 8 }}>
          {isShowcase ? 'Source · multilingual showcase reel' : 'Source · multi-language dub'}
        </div>
        <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
          <button className={'btn ' + (mode === 'file' ? 'btn-primary' : '')}
                  onClick={() => setMode('file')}>File</button>
          <button className={'btn ' + (mode === 'url' ? 'btn-primary' : '')}
                  onClick={() => setMode('url')}>URL</button>
        </div>
        {mode === 'file' ? (
          <input type="file" accept="video/*"
                 onChange={e => setVideoFile(e.target.files?.[0] || null)}
                 className="field"/>
        ) : (
          <input className="field" placeholder="https://youtube.com/watch?v=…"
                 value={ytUrl} onChange={e => setYtUrl(e.target.value)}/>
        )}
      </div>

      <div>
        {/* A showcase reel is by definition made of clips, so it always
            trims. A multi-language dub is a real deliverable — it dubs the
            whole video unless you deliberately ask to audition a clip. */}
        {!isShowcase && (
          <Toggle value={!!trimOn} onChange={setTrimOn}
                  label="Trim to a short clip first"
                  hint="Off = dub the whole video. On = audition languages and voices on a clip before committing the GPU time."/>
        )}
        {(isShowcase || trimOn) && (
          <>
            <div className="caps" style={{ margin: '10px 0 8px' }}>Clip length</div>
            <div style={{ display: 'flex', gap: 6 }}>
              {TRIM_STOPS.map(s => (
                <button key={s}
                  onClick={() => setTrimSeconds(s)}
                  className={'btn ' + (trimSeconds === s ? 'btn-primary' : '')}
                  style={{ flex: 1 }}>
                  {s}s
                </button>
              ))}
            </div>
          </>
        )}
      </div>

      <div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 8 }}>
          <div className="caps">Target languages · {langs.length} of {minLangs}–{maxLangs}</div>
        </div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
          {pickableLangs.map(l => {
            const on = langs.includes(l.c);
            const disabled = !on && langs.length >= maxLangs;
            return (
              <button key={l.c}
                onClick={() => toggleLang(l.c)}
                disabled={disabled}
                style={{
                  padding: '6px 10px', borderRadius: 4,
                  background: on ? 'var(--accent)' : 'var(--bg-1)',
                  color: on ? 'var(--bg)' : 'var(--ink-2)',
                  border: '1px solid ' + (on ? 'var(--accent)' : 'var(--line)'),
                  fontSize: 11.5, cursor: disabled ? 'not-allowed' : 'pointer',
                  opacity: disabled ? 0.4 : 1,
                }}>
                {l.n}
              </button>
            );
          })}
        </div>
      </div>

      <div style={{ padding: 12, background: 'var(--bg-1)', border: '1px solid var(--line)', borderRadius: 6 }}>
        <div className="mono" style={{ fontSize: 11, color: 'var(--ink-3)' }}>
          {isShowcase
            ? `${langs.length} languages · ${trimSeconds}s clip · stitched into one video`
            : `${langs.length} jobs × ${trimOn ? trimSeconds + 's clip' : 'full video'}`
              + ' · sequential on the GPU queue'}
        </div>
      </div>

      {error && <div className="mono" style={{ fontSize: 11, color: 'var(--err)' }}>{error}</div>}

      <button className="btn btn-primary" disabled={submitting || !sourceReady || !langsOk} onClick={onSubmit}
              style={{ width: '100%', justifyContent: 'center', padding: '12px 16px' }}>
        {submitting ? 'Submitting…' : (isShowcase ? `Build showcase reel ▸ ${langs.length} langs` : `Start ${langs.length}-language dub`)}
      </button>
    </div>
  );
}

        />

    </div>
  );
